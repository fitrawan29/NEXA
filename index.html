<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NEXA - The Future of Smart Education</title>
    
    <!-- Meta tags for PWA -->
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/stitch_assets/screen_3_logo.png">

    <!-- Native pre-render theme & status bar sync script: prevents cold-boot FOUC / emerald flash in dark mode -->
    <script>
      (function() {
        try {
          var manual = localStorage.getItem('nexa_dark_mode_manual');
          var isDark = false;
          if (manual) {
            var saved = localStorage.getItem('nexa_dark_mode');
            isDark = saved !== null ? saved === 'true' : false;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            isDark = true;
          } else {
            var saved = localStorage.getItem('nexa_dark_mode');
            isDark = saved === 'true';
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0f172a');
            var appleMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
            if (appleMeta) appleMeta.setAttribute('content', 'black-translucent');
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Preconnect Google Fonts CDN for faster DNS & TLS handshake -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Fonts & Icons (Complete Nunito weights 300 to 900 + Material Symbols) -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    
    <!-- React Quill CSS -->
    <link rel="stylesheet" href="https://unpkg.com/react-quill@1.3.3/dist/quill.snow.css">
    
    <!-- KaTeX for ReactQuill Equation Editor -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.9.0/katex.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.9.0/katex.min.js"></script>
    
    <!-- MathJax for rendering formulas in view -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-white font-sans antialiased overflow-x-hidden selection:bg-primary/30 min-h-screen transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Unified Service Worker registration: navigator.serviceWorker.register('/sw.js') is managed in src/registerSW.js -->
</body>
</html>
