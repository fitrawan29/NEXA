<body>
  <!-- Root DOM Node for React -->

  <!-- React Code Block -->
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ==============================================================================
    // KONFIGURASI UTAMA
    // ==============================================================================
    const SUPABASE_URL = 'https://cdcbarlyxjywltgrjgnr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkY2Jhcmx5eGp5d2x0Z3JqZ25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyOTkwNTQsImV4cCI6MjEwMjg3NTA1NH0.Lze94l74sblAVNN4-IUtyQ_idr-aQCECxgPWTVAI5-c';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Utility: Penghitung Waktu Mundur
    const calculateTimeLeft = (endTime) => {
      const difference = new Date(endTime) - new Date();
      if (difference <= 0) return { total: 0, hours: 0, minutes: 0, seconds: 0 };
      return {
        total: difference,
        hours: Math.floor((difference / (1000 * 60 * 60)) % 24),
        minutes: Math.floor((difference / 1000 / 60) % 60),
        seconds: Math.floor((difference / 1000) % 60)
      };
    };

    // Fungsi fetchAPI sebagai Router Supabase
    const fetchAPI = async (action, payload = {}) => {
      try {
        let data, error;
        switch (action) {
          // ================= AUTH =================
          case 'login':
            ({ data, error } = await supabaseClient
              .from('users')
              .select('*')
              .eq('username', payload.username)
              .eq('password', payload.password)
              .eq('role', payload.role)
              .single());
            if (error || !data) return { status: 'error', message: 'Username, password, atau role salah.' };
            return { status: 'success', user: data };

          case 'register':
            ({ data, error } = await supabaseClient
              .from('users')
              .insert([{
                id_user: payload.id_user,
                nama_lengkap: payload.nama_lengkap,
                username: payload.username,
                password: payload.password,
                role: payload.role
              }]);
            if (error) {
              if (error.code === '23505') return { status: 'error', message: 'ID User atau Username sudah terdaftar.' };
              return { status: 'error', message: error.message };
            }
            return { status: 'success', message: 'Registrasi berhasil. Silakan login.' };

          // ================= ADMIN =================
          case 'get_admin_dashboard_data':
            const [siswaRes, guruRes, jadwalRes, aktifRes] = await Promise.all([
              supabaseClient.from('users').select('id_user', { count: 'exact' }).eq('role', 'siswa'),
              supabaseClient.from('users').select('id_user', { count: 'exact' }).eq('role', 'guru'),
              supabaseClient.from('jadwal').select('id_jadwal', { count: 'exact' }),
              supabaseClient.from('log_ujian').select('id_log', { count: 'exact' }).eq('status_ujian', 'SEDANG KERJA')
            ]);
            
            const { data: jadwalAktifData } = await supabaseClient
              .from('jadwal')
              .select('id_jadwal, nama_mapel, waktu_mulai, waktu_selesai, users(nama_lengkap)')
              .limit(5);

            return {
              status: 'success',
              data: {
                totalSiswa: siswaRes.count || 0,
                totalGuru: guruRes.count || 0,
                totalJadwal: jadwalRes.count || 0,
                totalSesiAktif: aktifRes.count || 0,
                jadwalAktif: (jadwalAktifData || []).map(j => ({
                  id_jadwal: j.id_jadwal,
                  nama_mapel: j.nama_mapel,
                  guru: j.users ? j.users.nama_lengkap : 'Unknown',
                  waktu_mulai: j.waktu_mulai,
                  waktu_selesai: j.waktu_selesai
                }))
              }
            };

          case 'get_users_by_role':
            let userQuery = supabaseClient.from('users').select('*');
            if (payload.role) userQuery = userQuery.eq('role', payload.role);
            ({ data, error } = await userQuery);
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', data };

          case 'get_all_jadwal':
            ({ data, error } = await supabaseClient.from('jadwal').select('*, users(nama_lengkap)'));
            if (error) return { status: 'error', message: error.message };
            return { 
              status: 'success', 
              data: data.map(j => ({ ...j, guru: j.users ? j.users.nama_lengkap : 'Unknown' }))
            };

          case 'delete_jadwal':
            ({ error } = await supabaseClient.from('jadwal').delete().eq('id_jadwal', payload.id_jadwal));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', message: 'Data berhasil dihapus.' };

          case 'delete_user':
            ({ error } = await supabaseClient.from('users').delete().eq('id_user', payload.id_user));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', message: 'Data berhasil dihapus.' };

          // ================= GURU / PENGAWAS =================
          case 'get_jadwal_pengawas':
            ({ data, error } = await supabaseClient.from('jadwal').select('*');
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', data };

          case 'get_token':
            ({ data, error } = await supabaseClient.from('jadwal').select('token_aktif, last_update_token').eq('id_jadwal', payload.id_jadwal).single());
            if (error) return { status: 'error', message: error.message };
            
            let token = data.token_aktif;
            let lastUpdate = data.last_update_token ? new Date(data.last_update_token).getTime() : 0;
            let now = new Date().getTime();
            
            if (now - lastUpdate > 300000 || !token) {
              token = Math.random().toString(36).substring(2, 8).toUpperCase();
              await supabaseClient.from('jadwal').update({
                token_aktif: token,
                last_update_token: new Date().toISOString()
              }).eq('id_jadwal', payload.id_jadwal);
            }
            return { status: 'success', token };

          case 'monitoring_ujian':
            ({ data, error } = await supabaseClient.from('log_ujian').select('*, users(nama_lengkap)').eq('id_jadwal', payload.id_jadwal));
            if (error) return { status: 'error', message: error.message };
            return { 
              status: 'success', 
              data: data.map(l => ({ ...l, nama_lengkap: l.users ? l.users.nama_lengkap : 'Unknown' })) 
            };

          case 'buka_blokir':
            ({ error } = await supabaseClient.from('log_ujian').update({ is_blocked: false }).eq('id_log', payload.id_log));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', message: 'Blokir berhasil dibuka.' };

          case 'submit_nilai_uraian':
            ({ error } = await supabaseClient.from('log_ujian').update({ nilai_uraian: payload.nilai }).eq('id_log', payload.id_log));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', message: 'Nilai uraian berhasil diupdate.' };

          // ================= SISWA =================
          case 'get_jadwal':
            ({ data, error } = await supabaseClient.from('jadwal').select('*, users(nama_lengkap)'));
            if (error) return { status: 'error', message: error.message };
            return { 
              status: 'success', 
              data: data.map(j => ({ ...j, nama_guru: j.users ? j.users.nama_lengkap : 'Unknown' }))
            };

          case 'mulai_ujian':
            ({ data, error } = await supabaseClient.from('jadwal').select('token_aktif, waktu_selesai').eq('id_jadwal', payload.id_jadwal).single());
            if (error || !data) return { status: 'error', message: 'Jadwal tidak ditemukan.' };
            if (new Date(data.waktu_selesai) < new Date()) return { status: 'error', message: 'Ujian sudah berakhir.' };
            if (data.token_aktif !== payload.token) return { status: 'error', message: 'Token tidak valid atau sudah expired.' };

            const { data: logData } = await supabaseClient.from('log_ujian').select('*').eq('id_siswa', payload.id_siswa).eq('id_jadwal', payload.id_jadwal).single();
            let idLog = logData ? logData.id_log : null;
            
            if (logData) {
              if (logData.is_blocked) return { status: 'error', message: 'Akun Anda diblokir dari ujian ini.' };
              if (logData.status_ujian === 'SELESAI') return { status: 'error', message: 'Anda sudah menyelesaikan ujian ini.' };
            } else {
              idLog = 'LOG-' + Math.random().toString(36).substr(2, 9);
              await supabaseClient.from('log_ujian').insert([{
                id_log: idLog,
                id_jadwal: payload.id_jadwal,
                id_siswa: payload.id_siswa,
                status_ujian: 'SEDANG KERJA'
              }]);
            }
            return { status: 'success', id_log: idLog };

          case 'get_soal_ujian':
            ({ data, error } = await supabaseClient.from('soal_ujian').select('*').eq('id_jadwal', payload.id_jadwal));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', data };

          case 'catat_pelanggaran':
            const { data: currLog } = await supabaseClient.from('log_ujian').select('pelanggaran').eq('id_log', payload.id_log).single();
            if (!currLog) return { status: 'error', message: 'Log tidak ditemukan' };
            const newPelanggaran = (currLog.pelanggaran || 0) + 1;
            const isBlocked = newPelanggaran >= 3;
            await supabaseClient.from('log_ujian').update({ pelanggaran: newPelanggaran, is_blocked: isBlocked }).eq('id_log', payload.id_log);
            return { status: 'success' };

          case 'submit_ujian':
            const logId = payload.id_log;
            const jawaban = payload.jawaban; 
            const idSiswa = payload.id_siswa;

            const { data: soalData } = await supabaseClient.from('soal_ujian').select('*').eq('id_jadwal', payload.id_jadwal);
            let totalSkorPG = 0;
            let totalPG = 0;
            let insertJawaban = [];
            
            if (soalData) {
              for (const soal of soalData) {
                const jwb = jawaban[soal.id_soal] || '';
                let isCorrect = false;
                let skorDiperoleh = 0;

                if (soal.jenis_soal === 'PG') {
                  totalPG++;
                  if (jwb === soal.kunci_jawaban) {
                    isCorrect = true;
                    skorDiperoleh = Number(soal.skor) || 1;
                    totalSkorPG += skorDiperoleh;
                  }
                }

                insertJawaban.push({
                  id_jawaban: 'JWB-' + Math.random().toString(36).substr(2, 9),
                  id_log: logId,
                  id_soal: soal.id_soal,
                  jawaban_user: jwb,
                  is_correct: isCorrect,
                  skor_diperoleh: skorDiperoleh
                });
              }
            }
            
            await supabaseClient.from('jawaban_siswa').delete().eq('id_log', logId);
            if (insertJawaban.length > 0) {
              await supabaseClient.from('jawaban_siswa').insert(insertJawaban);
            }

            let nilaiAuto = 0;
            if (totalPG > 0) {
               nilaiAuto = (totalSkorPG / totalPG) * 100;
               nilaiAuto = Math.round(nilaiAuto * 100) / 100;
            }

            await supabaseClient.from('log_ujian').update({
              status_ujian: 'SELESAI',
              nilai_auto: nilaiAuto
            }).eq('id_log', logId);

            return { status: 'success', message: 'Ujian berhasil diselesaikan.', nilai_auto: nilaiAuto };

          default:
            return { status: 'error', message: 'Action tidak dikenali oleh router Supabase.' };
        }
      } catch (error) {
        console.error("Supabase Error:", error);
        return { status: 'error', message: error.message };
      }
    };

    // Komponen Modal Premium (Pengganti Alert dan Confirm bawaan browser)
    const Modal = ({ isOpen, title, message, onClose, type = 'info', children, onConfirm, confirmText = "Lanjutkan" }) => {
      if (!isOpen) return null;
      const bgColors = { info: 'bg-blue-600', warning: 'bg-yellow-500', error: 'bg-red-600', success: 'bg-green-600' };

      return (
        <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-900/70 backdrop-blur-sm p-4 transition-opacity">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden animate-fade-in-up transform transition-all">
            <div className={`${bgColors[type]} p-5 text-white font-bold text-lg flex items-center justify-between`}>
              {title}
            </div>
            <div className="p-6 text-gray-700 font-medium leading-relaxed">
              {message}
              {children}
            </div>
            <div className="p-4 bg-gray-50 flex justify-end gap-3 border-t border-gray-100">
              {onConfirm && (
                <button onClick={onClose} className="px-5 py-2 bg-white text-slate-700 border border-slate-300 rounded-xl hover:bg-slate-100 transition-colors font-bold shadow-sm">
                  Batal
                </button>
              )}
              <button onClick={onConfirm ? onConfirm : onClose} className={`px-6 py-2 text-white rounded-xl transition-colors font-bold shadow-md ${onConfirm ? 'bg-blue-600 hover:bg-blue-700' : 'bg-slate-800 hover:bg-slate-700'}`}>
                {onConfirm ? confirmText : "Mengerti"}
              </button>
            </div>
          </div>
        </div>
      );
    };

    const Loader = ({ text = "Memuat data..." }) => (
      <div className="flex flex-col justify-center items-center p-12 space-y-4 w-full">
        <div className="animate-spin rounded-full h-14 w-14 border-4 border-slate-200 border-t-blue-600 shadow-sm"></div>
        <p className="text-slate-500 font-medium animate-pulse">{text}</p>
      </div>
    );

    // ==========================================
    // VIEW: ADMIN
    // ==========================================
    const AdminView = ({ user, onLogout, isDarkMode, setIsDarkMode }) => {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [dashboardData, setDashboardData] = useState(null);
      const [dataSiswa, setDataSiswa] = useState([]);
      const [dataGuru, setDataGuru] = useState([]);
      const [dataJadwal, setDataJadwal] = useState([]);
      const [isLoading, setIsLoading] = useState(true);

      const fetchData = async (tab) => {
        setIsLoading(true);
        if (tab === 'dashboard') {
          const res = await fetchAPI('get_admin_dashboard_data', {});
          if (res.status === 'success') setDashboardData(res.data);
        } else if (tab === 'siswa') {
          const res = await fetchAPI('get_users_by_role', { role: 'siswa' });
          if (res.status === 'success') setDataSiswa(res.data);
        } else if (tab === 'guru') {
          const res = await fetchAPI('get_users_by_role', { role: 'guru' });
          if (res.status === 'success') setDataGuru(res.data);
        } else if (tab === 'jadwal') {
          const res = await fetchAPI('get_all_jadwal', {});
          if (res.status === 'success') setDataJadwal(res.data);
        }
        setIsLoading(false);
      };

      useEffect(() => {
        fetchData(activeTab);
      }, [activeTab]);

      const handleDeleteJadwal = async (id) => {
        if (!confirm('Hapus jadwal ini?')) return;
        const res = await fetchAPI('delete_jadwal', { id_jadwal: id });
        if (res.status === 'success') fetchData('jadwal');
      };
      
      const handleDeleteUser = async (id, tab) => {
        if (!confirm('Hapus user ini?')) return;
        const res = await fetchAPI('delete_user', { id_user: id });
        if (res.status === 'success') fetchData(tab);
      };

      return (
        <div className="bg-background dark:bg-slate-900 text-on-background dark:text-slate-100 antialiased flex min-h-screen transition-colors duration-500">
          {/* SideNavBar */}
          <nav className="bg-surface-container-low dark:bg-slate-900 text-primary docked left-0 h-full w-64 border-r border-outline-variant dark:border-slate-800 flat no shadows fixed top-0 flex flex-col p-md z-40 hidden md:flex transition-colors duration-500">
            {/* Header */}
            <div className="flex items-center space-x-sm mb-lg px-sm">
              <img alt="NEXA Logo" className="w-10 h-10 rounded-full object-cover shadow-sm" src="https://lh3.googleusercontent.com/aida/AEtjO1VVZfSUCXhHzY1X0SeCMcnnfH7eVLHQqeKZRoS92h6LX1juBz1mnHDbVWx1-Ba6QJacojgIbeoyE3UGy8T6Tb1_zTR54w2rmJiBCsvoFvsirZvz0_Sze5GuvCCAGNsKINOED0RXdkwpJDJinvxgu4KYdM823w67kkw4wzY5RntMk58ZhF_-cEiEvWXFYy34ycs42ktHbpwy_GH_ydOPW5eO4S5k_plk9debDcu5KRZwhT3Qv_0W8MX-"/>
              <div>
                <h1 className="font-headline-sm text-headline-sm font-bold text-on-surface dark:text-white">NEXA</h1>
                <p className="font-label-md text-label-md text-on-surface-variant dark:text-slate-400">Panel Kontrol</p>
              </div>
            </div>
            {/* Navigation Links */}

    // ==========================================
    // VIEW: GURU / PENGAWAS
    // ==========================================
    const GuruView = ({ user, onLogout, showMessage, isDarkMode, setIsDarkMode }) => {
      const [jadwalAktif, setJadwalAktif] = useState([]);
      const [selectedJadwal, setSelectedJadwal] = useState(null);
      const [monitoringData, setMonitoringData] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      const [token, setToken] = useState('------');
      const [isLoading, setIsLoading] = useState(false);

      const filteredMonitoringData = monitoringData.filter(s => 
        s.nama_lengkap.toLowerCase().includes(searchQuery.toLowerCase()) || 
        s.id_siswa.toLowerCase().includes(searchQuery.toLowerCase())
      );

      const [gradingModal, setGradingModal] = useState({ isOpen: false, siswa: null, nilaiInput: '' });

      useEffect(() => { loadJadwal(); }, []);

      useEffect(() => {
        let tokenInterval;
        if (selectedJadwal) {
          tokenInterval = setInterval(() => fetchToken(selectedJadwal), 300000);
        }
        return () => clearInterval(tokenInterval);
      }, [selectedJadwal]);

      const loadJadwal = async () => {
        setIsLoading(true);
        const res = await fetchAPI('get_jadwal_pengawas');
        if (res.status === 'success') setJadwalAktif(res.data);
        setIsLoading(false);
      };

      const fetchToken = async (id_jadwal) => {
        const res = await fetchAPI('get_token', { id_jadwal });
        if (res.status === 'success') setToken(res.token);
      };

      const loadMonitoring = async (id_jadwal) => {
        setIsLoading(true);
        setSelectedJadwal(id_jadwal);
        await fetchToken(id_jadwal);
        const res = await fetchAPI('monitoring_ujian', { id_jadwal });
        if (res.status === 'success') setMonitoringData(res.data);
        setIsLoading(false);
      };

      const unblockAkun = async (id_log) => {
        const res = await fetchAPI('buka_blokir', { id_log });
        if (res.status === 'success') {
          showMessage('Sukses', 'Blokir berhasil dibuka. Siswa dapat melanjutkan ujian.', 'success');
          loadMonitoring(selectedJadwal);
        } else {
          showMessage('Gagal', res.message, 'error');
        }
      };

      const submitNilaiUraian = async () => {
        if (!gradingModal.nilaiInput || isNaN(gradingModal.nilaiInput)) {
          showMessage('Error', 'Masukkan angka yang valid.', 'error');
          return;
        }
        const res = await fetchAPI('submit_nilai_uraian', { id_log: gradingModal.siswa.id_log, nilai: gradingModal.nilaiInput });
        if (res.status === 'success') {
          setGradingModal({ isOpen: false, siswa: null, nilaiInput: '' });
          showMessage('Tersimpan', 'Nilai uraian berhasil diupdate.', 'success');
          loadMonitoring(selectedJadwal);
        }
      };

      return (
        <div className="bg-background dark:bg-slate-900 text-on-background dark:text-slate-100 min-h-screen font-body-md text-body-md antialiased selection:bg-primary-container selection:text-on-primary-container flex flex-col transition-colors duration-500">
          {/* TopNavBar */}
          <nav className="bg-surface/90 dark:bg-slate-900/90 backdrop-blur-md fixed top-0 w-full z-50 flex justify-between items-center px-lg h-16 border-b border-outline-variant dark:border-slate-800 transition-colors duration-500">
            <div className="flex items-center gap-xl">
              <div className="flex items-center h-8">
                  <img src="https://lh3.googleusercontent.com/aida/AEtjO1VVZfSUCXhHzY1X0SeCMcnnfH7eVLHQqeKZRoS92h6LX1juBz1mnHDbVWx1-Ba6QJacojgIbeoyE3UGy8T6Tb1_zTR54w2rmJiBCsvoFvsirZvz0_Sze5GuvCCAGNsKINOED0RXdkwpJDJinvxgu4KYdM823w67kkw4wzY5RntMk58ZhF_-cEiEvWXFYy34ycs42ktHbpwy_GH_ydOPW5eO4S5k_plk9debDcu5KRZwhT3Qv_0W8MX-" alt="NEXA Logo" className="h-full w-auto object-contain" />
              </div>
              <div className="hidden md:flex items-center h-full gap-lg">
                <a className="h-16 flex items-center text-primary dark:text-primary-fixed font-bold border-b-2 border-primary dark:border-primary-fixed font-label-md text-label-md" href="#">Dashboard Pemantauan</a>
              </div>
            </div>
            <div className="flex items-center gap-md">
              <button className="w-10 h-10 flex items-center justify-center rounded-full text-secondary dark:text-slate-400 hover:bg-surface-container-highest dark:hover:bg-slate-800 transition-colors relative hidden sm:flex">
                <span className="material-symbols-outlined">notifications</span>
                <span className="absolute top-2 right-2 w-2 h-2 bg-error rounded-full"></span>
              </button>
              <button onClick={() => setIsDarkMode(!isDarkMode)} className="w-9 h-9 rounded-full bg-surface-container-highest dark:bg-slate-800 border border-outline-variant dark:border-slate-700 flex items-center justify-center text-on-surface dark:text-white hover:bg-white dark:hover:bg-slate-700 transition-colors shadow-sm">
                <span className="material-symbols-outlined text-[20px]">{isDarkMode ? 'light_mode' : 'dark_mode'}</span>
              </button>
              <div className="ml-sm flex items-center gap-sm cursor-pointer border-l pl-sm border-outline-variant dark:border-slate-700">
                <span className="text-sm font-bold text-slate-700 dark:text-slate-200 hidden sm:block">{user.nama_lengkap}</span>
              </div>
              <button onClick={onLogout} className="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant dark:text-slate-400 hover:bg-error-container/20 hover:text-error transition-colors cursor-pointer active:opacity-80" title="Logout">
                <span className="material-symbols-outlined">logout</span>
              </button>
            </div>
          </nav>

          {/* Main Content Canvas */}
          <main className="pt-[96px] px-md md:px-lg max-w-container-max mx-auto space-y-gutter pb-xl flex-1 w-full">
            {!selectedJadwal ? (
              /* Pemilihan Jadwal */
              <>
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-sm mb-lg">
                  <div>
                    <h1 className="font-headline-lg text-headline-lg text-on-surface dark:text-white">Pilih Jadwal Ujian</h1>
                    <p className="font-body-md text-body-md text-on-surface-variant dark:text-slate-400 mt-1">Pilih jadwal ujian yang ingin Anda pantau.</p>
                  </div>
                  <div className="flex gap-sm">
                    <button onClick={loadJadwal} className="bg-primary text-on-primary py-sm px-md rounded-lg font-label-md text-label-md hover:bg-on-primary-fixed-variant transition-colors flex items-center gap-2">
                      <span className="material-symbols-outlined text-[18px]">refresh</span> Refresh Jadwal
                    </button>
                  </div>
                </div>

                {isLoading ? <Loader text="Memuat jadwal ujian..." /> : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {jadwalAktif.map(j => (
                      <div key={j.id_jadwal} className="group bg-white dark:bg-slate-800 border border-outline-variant dark:border-slate-700 rounded-xl p-6 hover:shadow-lg hover:-translate-y-1 hover:border-primary/30 transition-all duration-300 relative overflow-hidden flex flex-col justify-between">
                        <div className="absolute top-0 right-0 w-24 h-24 bg-primary/5 dark:bg-primary-fixed/5 rounded-full -translate-y-8 translate-x-8 group-hover:scale-110 transition-transform duration-500"></div>
                        <div className="relative z-10">
                          <h3 className="font-headline-sm text-headline-sm text-on-surface dark:text-white mb-1">{j.nama_mapel}</h3>
                          <p className="font-mono-label text-mono-label text-on-surface-variant dark:text-slate-400 mb-4">{j.id_jadwal}</p>
                          <div className="text-sm text-on-surface-variant dark:text-slate-300 mb-6 bg-surface-container-low dark:bg-slate-900/50 p-4 rounded-xl border border-outline-variant dark:border-slate-700">
                            <div className="flex justify-between mb-1"><span>Mulai:</span> <span className="font-semibold text-on-surface dark:text-white">{new Date(j.waktu_mulai).toLocaleString()}</span></div>
                            <div className="flex justify-between"><span>Selesai:</span> <span className="font-semibold text-on-surface dark:text-white">{new Date(j.waktu_selesai).toLocaleString()}</span></div>
                          </div>
                        </div>
                        <button onClick={() => loadMonitoring(j.id_jadwal)} className="w-full bg-primary text-on-primary py-sm px-md rounded-lg font-label-md text-label-md hover:bg-on-primary-fixed-variant transition-colors flex justify-center items-center gap-2 shadow-sm relative z-10">
                          <span className="material-symbols-outlined text-[18px]">visibility</span> Monitor Kelas
                        </button>
                      </div>
                    ))}
                    {jadwalAktif.length === 0 && (
                      <div className="col-span-full py-12 text-center text-on-surface-variant dark:text-slate-500">Tidak ada jadwal ujian aktif saat ini.</div>
                    )}
                  </div>
                )}
              </>
            ) : (
              /* Area Monitoring Real-time */
              <>
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-sm mb-lg">
                  <div>
                    <h1 className="font-headline-lg text-headline-lg text-on-surface dark:text-white">Live Monitoring</h1>
                    <p className="font-body-md text-body-md text-on-surface-variant dark:text-slate-400 mt-1">Sesi: <span className="font-mono">{selectedJadwal}</span></p>
                  </div>
                  <div className="flex gap-sm">
                    <button className="bg-surface-container-lowest dark:bg-slate-800 border border-outline-variant dark:border-slate-700 text-on-surface dark:text-slate-200 py-sm px-md rounded-lg font-label-md text-label-md hover:bg-surface-container-low dark:hover:bg-slate-700 transition-colors flex items-center gap-2 hidden sm:flex">
                      <span className="material-symbols-outlined text-[18px]">filter_list</span> Filter
                    </button>
                    <button onClick={() => setSelectedJadwal(null)} className="bg-white dark:bg-slate-800 border border-outline-variant dark:border-slate-700 text-on-surface dark:text-slate-200 py-sm px-md rounded-lg font-label-md text-label-md hover:bg-surface-container-low dark:hover:bg-slate-700 transition-colors flex items-center gap-2 shadow-sm">
                      <span className="material-symbols-outlined text-[18px]">arrow_back</span> Kembali
                    </button>
                    <button onClick={() => loadMonitoring(selectedJadwal)} className="bg-primary-container text-on-primary-container py-sm px-md rounded-lg font-label-md text-label-md hover:bg-primary-fixed-dim transition-colors flex items-center gap-2">
                      <span className="material-symbols-outlined text-[18px]">refresh</span> Refresh
                    </button>
                  </div>
                </div>

                {/* Token Card */}
                <div className="bg-primary text-on-primary rounded-xl p-lg md:p-xl shadow-[0_8px_16px_rgba(0,63,177,0.15)] relative overflow-hidden flex flex-col md:flex-row items-center justify-between gap-lg mb-gutter">
                  <div className="absolute -right-20 -top-20 w-64 h-64 bg-white opacity-5 rounded-full blur-3xl pointer-events-none"></div>
                  <div className="flex flex-col gap-xs z-10 w-full md:w-auto text-center md:text-left">
                    <h2 className="font-headline-sm text-headline-sm text-primary-fixed-dim">Token Ujian Aktif</h2>
                    <div className="font-mono-label text-[48px] md:text-[64px] font-bold tracking-widest leading-none mt-2">
                      {token}
                    </div>
                  </div>
                  <div className="w-full md:w-1/3 flex flex-col gap-sm z-10 bg-primary-fixed-dim/20 p-md rounded-lg backdrop-blur-sm border border-primary-fixed-dim/30">
                    <div className="flex justify-between mt-1 items-center">
                      <p className="text-on-primary text-[12px] opacity-80">Token ini di-refresh secara otomatis.</p>
                      <button onClick={() => fetchToken(selectedJadwal)} className="text-on-primary text-[12px] hover:underline flex items-center gap-1 opacity-80 hover:opacity-100 transition-opacity">
                        <span className="material-symbols-outlined text-[14px]">refresh</span> Perbarui
                      </button>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-gutter">
                  {/* Left Column: Live Table */}
                  <div className="col-span-1 lg:col-span-8 bg-white dark:bg-slate-800 border border-outline-variant dark:border-slate-700 rounded-xl shadow-sm flex flex-col overflow-hidden">
                    <div className="p-md border-b border-outline-variant dark:border-slate-700 flex justify-between items-center bg-surface-container-lowest dark:bg-slate-800">
                      <h3 className="font-headline-sm text-headline-sm text-on-surface dark:text-white flex items-center gap-2">
                        <span className="material-symbols-outlined text-secondary dark:text-slate-400">group</span> Status Peserta
                      </h3>
                      <div className="relative w-48 hidden sm:block">
                        <span className="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant dark:text-slate-400 text-[18px]">search</span>
                        <input value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-9 pr-3 py-2 bg-surface-container-lowest dark:bg-slate-800 border border-outline-variant dark:border-slate-700 rounded-lg font-body-md text-body-md text-on-surface dark:text-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder-on-surface-variant dark:placeholder-slate-400" placeholder="Cari siswa..." type="text" />
                      </div>
                    </div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-left font-body-md text-body-md">
                        <thead className="bg-surface-container-low dark:bg-slate-900/50 text-on-surface-variant dark:text-slate-400 font-label-md text-label-md border-b border-outline-variant dark:border-slate-700">
                          <tr>
                            <th className="py-3 px-md font-semibold">Peserta</th>
                            <th className="py-3 px-md font-semibold text-center">Status & Pelanggaran</th>
                            <th className="py-3 px-md font-semibold text-center">Skor (Auto / Uraian)</th>
                            <th className="py-3 px-md font-semibold text-right">Aksi</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-outline-variant dark:divide-slate-700/50 text-on-surface dark:text-slate-200">
                          {isLoading ? <tr><td colSpan="4" className="py-12"><Loader text="Menarik data..." /></td></tr> :
                           filteredMonitoringData.length > 0 ? filteredMonitoringData.map(siswa => (
                             <tr key={siswa.id_siswa} className={`hover:bg-surface-container-low dark:hover:bg-slate-700/50 transition-colors group ${siswa.is_blocked ? 'bg-error-container/10 dark:bg-error/10' : ''}`}>
                               <td className="py-sm px-md flex items-center gap-3">
                                 <div className={`w-8 h-8 rounded-full flex items-center justify-center font-label-md text-label-md font-bold ${siswa.is_blocked ? 'bg-error-container text-error dark:bg-error/20 dark:text-error-container' : 'bg-secondary-container text-on-secondary-container dark:bg-secondary/20 dark:text-secondary-fixed'}`}>
                                   {siswa.nama_lengkap.substring(0, 2).toUpperCase()}
                                 </div>
                                 <div className="flex flex-col">
                                   <span className={`font-semibold ${siswa.is_blocked ? 'text-error dark:text-error-container' : 'text-on-surface dark:text-white'}`}>{siswa.nama_lengkap}</span>
                                   <span className="text-[12px] text-on-surface-variant dark:text-slate-400">{siswa.id_siswa}</span>
                                 </div>
                               </td>
                               <td className="py-sm px-md text-center">
                                  <span className={`inline-flex items-center gap-1.5 py-1 px-2.5 rounded-full text-[12px] font-semibold mb-1 ${
                                    siswa.is_blocked ? 'bg-error-container text-error dark:bg-error/20 dark:text-error-container border border-error/20' :
                                    siswa.status_ujian === 'SELESAI' ? 'bg-surface-variant text-on-surface-variant dark:bg-slate-700 dark:text-slate-300 border border-outline-variant dark:border-slate-600' :
                                    siswa.status_ujian === 'SEDANG KERJA' ? 'bg-[#e6f4ea] text-[#137333] dark:bg-[#137333]/20 dark:text-[#81c995] border border-[#137333]/20' :
                                    'bg-surface-container-high text-on-surface-variant dark:bg-slate-800 dark:text-slate-400 border border-outline-variant dark:border-slate-700'
                                  }`}>
                                    {siswa.is_blocked ? 'TERBLOKIR' : siswa.status_ujian}
                                  </span>
                                  {siswa.pelanggaran > 0 && (
                                    <div className="text-[12px] text-error dark:text-error-container flex items-center justify-center gap-1">
                                      <span className="material-symbols-outlined text-[14px]">warning</span>
                                      {siswa.pelanggaran} / 3 Pelanggaran
                                    </div>
                                  )}
                               </td>
                               <td className="py-sm px-md text-center">
                                 <div className="font-mono-label text-on-surface dark:text-white font-bold text-lg">{siswa.nilai_auto || '-'} <span className="text-on-surface-variant dark:text-slate-400 text-sm">/ {siswa.nilai_uraian || '-'}</span></div>
                               </td>
                               <td className="py-sm px-md text-right space-x-2">
                                 {siswa.is_blocked && siswa.id_log && (
                                    <button onClick={() => unblockAkun(siswa.id_log)} className="bg-error text-on-error py-1 px-3 rounded text-sm font-bold shadow-sm hover:opacity-90">Buka Blokir</button>
                                 )}
                                 {siswa.status_ujian === 'SELESAI' && (
                                    <button onClick={() => setGradingModal({ isOpen: true, siswa, nilaiInput: siswa.nilai_uraian || '' })} className="bg-primary-container text-on-primary-container py-1 px-3 rounded text-sm font-bold shadow-sm hover:opacity-90 border border-primary-fixed-dim">Nilai Uraian</button>
                                 )}
                               </td>
                             </tr>
                           )) : (
                             <tr>
                               <td colSpan="4" className="py-8 text-center text-on-surface-variant dark:text-slate-500">Belum ada data monitoring.</td>
                             </tr>
                           )
                          }
                        </tbody>
                      </table>
                    </div>
                  </div>

                  {/* Right Column: Stats */}
                  <div className="col-span-1 lg:col-span-4 flex flex-col gap-gutter">
                    <div className="grid grid-cols-2 gap-sm">
                      <div className="bg-white dark:bg-slate-800 border border-outline-variant dark:border-slate-700 rounded-xl p-md flex flex-col gap-xs shadow-sm hover:shadow-lg hover:-translate-y-1 transition-all duration-300">
                        <div className="w-8 h-8 rounded-full bg-surface-container dark:bg-slate-700 flex items-center justify-center mb-1">
                          <span className="material-symbols-outlined text-secondary dark:text-slate-300 text-[18px]">group</span>
                        </div>
                        <span className="font-label-md text-label-md text-on-surface-variant dark:text-slate-400">Total Peserta Sesi</span>
                        <div className="flex items-baseline gap-1">
                          <span className="font-headline-lg text-headline-lg text-on-surface dark:text-white">{monitoringData.length}</span>
                        </div>
                      </div>
                      <div className="bg-white dark:bg-slate-800 border border-outline-variant dark:border-slate-700 rounded-xl p-md flex flex-col gap-xs shadow-sm hover:shadow-lg hover:-translate-y-1 transition-all duration-300">
                        <div className="w-8 h-8 rounded-full bg-[#e6f4ea] dark:bg-[#137333]/20 flex items-center justify-center mb-1">
                          <span className="material-symbols-outlined text-[#137333] dark:text-[#81c995] text-[18px]">task_alt</span>
                        </div>
                        <span className="font-label-md text-label-md text-on-surface-variant dark:text-slate-400">Telah Selesai</span>
                        <div className="flex items-baseline gap-1">
                          <span className="font-headline-lg text-headline-lg text-[#137333] dark:text-[#81c995]">{monitoringData.filter(s => s.status_ujian === 'SELESAI').length}</span>
                        </div>
                      </div>
                    </div>
                    {monitoringData.some(s => s.is_blocked) && (
                      <div className="bg-error-container/20 dark:bg-error/10 border border-error-container dark:border-error/30 rounded-xl p-md flex flex-col gap-sm shadow-sm relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-1 h-full bg-error"></div>
                        <div className="flex items-center gap-2 text-error dark:text-error-container">
                          <span className="material-symbols-outlined">warning</span>
                          <h4 className="font-headline-sm text-headline-sm">Peringatan Sistem</h4>
                        </div>
                        <p className="font-body-md text-body-md text-on-surface-variant dark:text-slate-300">
                          Terdapat <strong className="text-error dark:text-error-container">{monitoringData.filter(s => s.is_blocked).length} siswa</strong> yang terblokir karena terindikasi curang atau keluar ujian.
                        </p>
                      </div>
                    )}
                  </div>
                </div>
              </>
            )}
          </main>

          {/* Modal Penilaian Uraian */}
          <Modal isOpen={gradingModal.isOpen} title={`Penilaian Uraian - ${gradingModal.siswa?.nama_lengkap}`} type="info" onClose={() => setGradingModal({ isOpen: false, siswa: null })}>
            <div className="mt-4 text-left">
              <label className="block font-label-md text-label-md text-on-surface mb-2">Input Total Nilai Uraian (Angka):</label>
              <input
                type="number"
                className="w-full pl-md pr-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all mb-4"
                value={gradingModal.nilaiInput}
                onChange={(e) => setGradingModal({ ...gradingModal, nilaiInput: e.target.value })}
                placeholder="Contoh: 85"
              />
              <button onClick={submitNilaiUraian} className="w-full bg-primary text-on-primary py-sm px-md rounded-lg font-label-md text-label-md hover:bg-on-primary-fixed-variant transition-colors shadow-sm">
                Simpan Nilai
              </button>
            </div>
          </Modal>
        </div>
      );
    };

    // ==========================================
    // VIEW: RUANG UJIAN (EKSEKUSI SOAL & ANTI-CHEAT)
    // ==========================================
    const ExamRoom = ({ user, jadwal, idLog, showMessage, onFinish, isDarkMode, setIsDarkMode }) => {
      const [soal, setSoal] = useState([]);
      const [jawabanSiswa, setJawabanSiswa] = useState({});
      const [raguRagu, setRaguRagu] = useState({});
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isLoading, setIsLoading] = useState(true);
      const [violationCount, setViolationCount] = useState(0);
      const [isBlocked, setIsBlocked] = useState(false);

      const [timeLeft, setTimeLeft] = useState({ total: 1, hours: 0, minutes: 0, seconds: 0 });
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [confirmModal, setConfirmModal] = useState({ isOpen: false });

      const examContainerRef = useRef(null);

      useEffect(() => {
        fetchSoal();
        setupAntiCheat();

        const timerInterval = setInterval(() => {
          const remaining = calculateTimeLeft(jadwal.waktu_selesai);
          setTimeLeft(remaining);

          if (remaining.total <= 0 && !isSubmitting && !isBlocked) {
            clearInterval(timerInterval);
            showMessage('Waktu Habis!', 'Waktu ujian telah berakhir. Sistem mengumpulkan jawaban otomatis.', 'warning');
            executeSubmitExam(true);
          }
        }, 1000);

        return () => {
          clearInterval(timerInterval);
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          document.removeEventListener('fullscreenchange', handleFullscreenChange);
        };
      }, []);

      const fetchSoal = async () => {
        const res = await fetchAPI('get_soal_ujian', { id_jadwal: jadwal.id_jadwal });
        if (res.status === 'success') {
          const parsedSoal = res.data.map(s => {
            let parsedOpsi = [];
            try { parsedOpsi = s.opsi ? JSON.parse(s.opsi) : []; } catch (e) { parsedOpsi = [s.opsi]; }
            return { ...s, opsi: parsedOpsi };
          });
          setSoal(parsedSoal);
        }
        setIsLoading(false);
      };

      const reportViolation = async () => {
        if (isBlocked || isSubmitting) return;

        const res = await fetchAPI('catat_pelanggaran', { id_log: idLog });
        if (res.status === 'success') {
          setViolationCount(res.pelanggaran_saat_ini);
          if (res.terblokir) {
            setIsBlocked(true);
            if (document.fullscreenElement) document.exitFullscreen().catch(() => { });
            showMessage('TERBLOKIR!', 'Akun Anda diblokir karena meninggalkan halaman ujian lebih dari 3 kali. Hubungi pengawas.', 'error');
            setTimeout(onFinish, 5000);
          } else {
            showMessage('Peringatan Keamanan!', `Sistem mendeteksi Anda keluar dari halaman ujian! Ini pelanggaran ke-${res.pelanggaran_saat_ini} dari maksimal 3.`, 'warning');
          }
        }
      };

      const handleVisibilityChange = () => { if (document.hidden) reportViolation(); };
      const handleFullscreenChange = () => { if (!document.fullscreenElement && !isSubmitting && !isBlocked) reportViolation(); };

      const setupAntiCheat = () => {
        document.addEventListener('visibilitychange', handleVisibilityChange);
        document.addEventListener('fullscreenchange', handleFullscreenChange);
      };

      const enforceFullscreen = () => {
        if (!isBlocked && document.documentElement.requestFullscreen && !document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => { });
        }
      };

      const handleAnswerChange = (soalId, value, tipe) => {
        setJawabanSiswa(prev => {
          if (tipe === 'PGK') {
            let arr = Array.isArray(prev[soalId]) ? [...prev[soalId]] : [];
            if (arr.includes(value)) arr = arr.filter(item => item !== value);
            else arr.push(value);
            return { ...prev, [soalId]: arr };
          }
          return { ...prev, [soalId]: value };
        });
      };

      const toggleRaguRagu = (soalId) => {
        setRaguRagu(prev => ({ ...prev, [soalId]: !prev[soalId] }));
      };

      const requestSubmit = () => {
        setConfirmModal({ isOpen: true });
      };

      const executeSubmitExam = async (isAuto = false) => {
        setConfirmModal({ isOpen: false });
        if (isSubmitting) return;

        setIsSubmitting(true);
        setIsLoading(true);

        const formattedJawaban = Object.keys(jawabanSiswa).map(key => ({
          id_soal: key,
          jawaban: jawabanSiswa[key]
        }));

        const res = await fetchAPI('submit_ujian', {
          id_log: idLog,
          id_jadwal: jadwal.id_jadwal,
          id_siswa: user.id_user,
          jawaban: formattedJawaban
        });

        if (document.fullscreenElement) document.exitFullscreen().catch(() => { });

        if (res.status === 'success') {
          showMessage('Ujian Selesai', `Terima kasih! Skor pilihan ganda/objektif Anda: ${res.nilai_objektif}. Soal uraian dinilai terpisah oleh guru.`, 'success');
          setTimeout(onFinish, 4000);
        } else {
          showMessage('Gagal Mengumpulkan', res.message, 'error');
          setIsLoading(false);
          setIsSubmitting(false);
        }
      };

      const renderQuestionInput = (s) => {
        const currentAns = jawabanSiswa[s.id_soal] || '';

        switch (s.tipe_soal) {
          case 'PG':
          case 'BS':
            return s.opsi.map((op, idx) => (
              <label key={idx} className={`flex items-center p-md border rounded-lg cursor-pointer transition-colors ${currentAns === op ? 'border-2 border-primary dark:border-primary-fixed bg-primary-fixed dark:bg-primary/20 shadow-[0_4px_8px_rgba(0,0,0,0.05)]' : 'border-outline-variant dark:border-slate-700 hover:bg-surface-container-low dark:hover:bg-slate-700/50 bg-white dark:bg-slate-800'}`}>
                <input type="radio" name={s.id_soal} value={op} checked={currentAns === op} onChange={() => handleAnswerChange(s.id_soal, op, s.tipe_soal)} className={`form-radio h-5 w-5 ${currentAns === op ? 'text-primary border-primary' : 'text-primary border-outline-variant dark:border-slate-600'} focus:ring-primary focus:ring-offset-0`} />
                <span className="ml-md font-body-lg text-body-lg text-on-surface dark:text-white flex-1">
                  <span className="font-bold mr-sm text-primary dark:text-primary-fixed">{String.fromCharCode(65 + idx)}.</span> {op}
                </span>
              </label>
            ));

          case 'PGK':
            return s.opsi.map((op, idx) => {
              const isChecked = currentAns.includes && currentAns.includes(op);
              return (
                <label key={idx} className={`flex items-center p-md border rounded-lg cursor-pointer transition-colors ${isChecked ? 'border-2 border-primary dark:border-primary-fixed bg-primary-fixed dark:bg-primary/20 shadow-[0_4px_8px_rgba(0,0,0,0.05)]' : 'border-outline-variant dark:border-slate-700 hover:bg-surface-container-low dark:hover:bg-slate-700/50 bg-white dark:bg-slate-800'}`}>
                  <input type="checkbox" value={op} checked={isChecked} onChange={() => handleAnswerChange(s.id_soal, op, s.tipe_soal)} className={`form-checkbox rounded h-5 w-5 ${isChecked ? 'text-primary border-primary' : 'text-primary border-outline-variant dark:border-slate-600'} focus:ring-primary focus:ring-offset-0`} />
                  <span className="ml-md font-body-lg text-body-lg text-on-surface dark:text-white flex-1">
                    <span className="font-bold mr-sm text-primary dark:text-primary-fixed">{String.fromCharCode(65 + idx)}.</span> {op}
                  </span>
                </label>
              );
            });

          case 'JODOH':
            return (
              <div className="bg-secondary-container dark:bg-secondary/20 p-md rounded-lg border border-outline-variant dark:border-slate-700">
                <p className="text-on-secondary-container dark:text-secondary-fixed font-label-md text-label-md mb-sm flex items-center gap-2"><span className="material-symbols-outlined text-[18px]">link</span> Ketikkan pasangan yang tepat sesuai urutan instruksi di soal.</p>
                <textarea rows="3" placeholder="Contoh: 1-A, 2-C, 3-B" value={currentAns} onChange={(e) => handleAnswerChange(s.id_soal, e.target.value, s.tipe_soal)} className="w-full pl-md pr-md py-sm bg-white dark:bg-slate-900 border border-outline-variant dark:border-slate-600 rounded-lg font-body-md text-body-md text-on-surface dark:text-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"></textarea>
              </div>
            );

          case 'ISIAN':
          case 'URAIAN':
            return (
              <textarea rows={s.tipe_soal === 'URAIAN' ? 8 : 2} placeholder="Ketik jawaban Anda di sini..." value={currentAns} onChange={(e) => handleAnswerChange(s.id_soal, e.target.value, s.tipe_soal)} className="w-full pl-md pr-md py-sm bg-white dark:bg-slate-900 border border-outline-variant dark:border-slate-600 rounded-lg font-body-md text-body-md text-on-surface dark:text-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"></textarea>
            );

          default: return <p className="text-error font-bold p-sm bg-error-container/20 rounded">⚠️ Tipe soal tidak didukung.</p>;
        }
      };

      if (isLoading) return <div className="min-h-screen bg-background dark:bg-slate-900 flex flex-col items-center justify-center"><Loader text="Menyiapkan Soal dan Enkripsi Sesi..." /></div>;
      if (isBlocked) return (
        <div className="min-h-screen bg-error flex flex-col items-center justify-center space-y-4">
          <span className="material-symbols-outlined text-[80px] text-on-error">block</span>
          <h1 className="text-on-error font-headline-lg text-headline-lg font-bold">AKUN DIBLOKIR</h1>
          <p className="text-on-error font-body-lg text-body-lg">Sistem mendeteksi kecurangan. Hubungi pengawas untuk membuka akses.</p>
        </div>
      );

      const currentS = soal[currentIndex];

      const answeredCount = soal.filter(s => {
          const ans = jawabanSiswa[s.id_soal];
          return ans && (Array.isArray(ans) ? ans.length > 0 : String(ans).trim() !== '');
      }).length;
      const flaggedCount = Object.values(raguRagu).filter(Boolean).length;
      const unansweredCount = soal.length - answeredCount;

      return (
        <div className="font-body-md text-body-md text-on-background dark:text-slate-100 bg-background dark:bg-slate-900 h-screen flex flex-col overflow-hidden select-none transition-colors duration-500" ref={examContainerRef} onClick={enforceFullscreen}>
          {/* TopNavBar */}
          <header className="fixed top-0 w-full z-50 flex justify-between items-center px-lg h-20 bg-primary dark:bg-slate-900 border-b border-transparent dark:border-slate-800 shadow-md">
            <div className="flex items-center gap-md">
              <img alt="NEXA Logo" className="h-10 w-auto object-contain hidden md:block" src="https://lh3.googleusercontent.com/aida/AEtjO1VVZfSUCXhHzY1X0SeCMcnnfH7eVLHQqeKZRoS92h6LX1juBz1mnHDbVWx1-Ba6QJacojgIbeoyE3UGy8T6Tb1_zTR54w2rmJiBCsvoFvsirZvz0_Sze5GuvCCAGNsKINOED0RXdkwpJDJinvxgu4KYdM823w67kkw4wzY5RntMk58ZhF_-cEiEvWXFYy34ycs42ktHbpwy_GH_ydOPW5eO4S5k_plk9debDcu5KRZwhT3Qv_0W8MX-"/>
              <div className="font-headline-sm text-headline-sm text-on-primary font-bold md:hidden">NEXA</div>
            </div>
            <div className="flex items-center gap-md md:gap-xl text-on-primary">
              <div className="flex flex-col items-end hidden sm:flex">
                <span className="font-label-md text-label-md text-primary-fixed-dim">{user.nama_lengkap}</span>
                <span className="font-label-md text-label-md text-primary-fixed-dim">ID: {user.id_user}</span>
              </div>
              <div className="h-8 w-px bg-primary-fixed-dim opacity-50 hidden sm:block"></div>
              <div className="font-body-lg text-body-lg text-on-primary font-semibold hidden md:block max-w-[200px] truncate">{jadwal.nama_mapel}</div>
              <div className="h-8 w-px bg-primary-fixed-dim opacity-50 hidden md:block"></div>
              <div className={`font-headline-sm text-headline-sm ${timeLeft.total < 300000 ? 'text-error-container animate-pulse' : 'text-on-primary'} font-bold flex items-center gap-xs`}>
                <span className="material-symbols-outlined" style={{fontVariationSettings: "'FILL' 1"}}>timer</span>
                {String(timeLeft.hours).padStart(2, '0')}:{String(timeLeft.minutes).padStart(2, '0')}:{String(timeLeft.seconds).padStart(2, '0')}
              </div>
              <button onClick={requestSubmit} className="font-label-md text-label-md text-on-primary font-bold hover:opacity-90 active:scale-95 transition-transform ml-sm md:ml-md bg-error text-on-error px-md py-sm rounded">Selesai</button>
            </div>
          </header>
          
          <div className="flex flex-1 pt-20 h-full">
            {/* SideNavBar */}
            <aside className="hidden md:flex fixed left-0 mt-20 w-80 h-[calc(100vh-80px)] border-r border-outline-variant dark:border-slate-800 bg-surface dark:bg-slate-900 flex-col p-md overflow-y-auto sidebar-scroll z-40 transition-colors duration-500">
              <div className="mb-md">
                <h2 className="font-label-md text-label-md text-on-surface dark:text-white font-bold">Navigasi Soal</h2>
                <p className="font-label-md text-label-md text-on-surface-variant dark:text-slate-400 font-normal">Klik nomor untuk pindah soal</p>
                {violationCount > 0 && (
                   <p className="font-label-md text-label-md text-error mt-2 font-bold flex items-center gap-1">
                      <span className="material-symbols-outlined text-[16px]">warning</span> Pelanggaran: {violationCount} / 3
                   </p>
                )}
              </div>
              <div className="grid grid-cols-6 gap-sm mb-lg">
                {soal.map((s, idx) => {
                  const ans = jawabanSiswa[s.id_soal];
                  const hasAnswered = !!ans && (Array.isArray(ans) ? ans.length > 0 : String(ans).trim() !== '');
                  const isFlagged = raguRagu[s.id_soal];
                  
                  let btnClass = "w-10 h-10 rounded-sm font-mono-label text-mono-label flex items-center justify-center cursor-pointer transition-all ";
                  
                  if (currentIndex === idx) {
                    btnClass += "bg-primary text-on-primary ring-2 ring-primary ring-offset-2 dark:ring-offset-slate-900";
                  } else if (isFlagged) {
                    btnClass += "bg-[#D97706] text-white"; // flagged color
                  } else if (hasAnswered) {
                    btnClass += "bg-[#10B981] text-white"; // answered color
                  } else {
                    btnClass += "border border-outline-variant dark:border-slate-700 text-on-surface dark:text-slate-300 hover:border-primary hover:text-primary dark:hover:border-primary-fixed dark:hover:text-primary-fixed bg-white dark:bg-slate-800";
                  }
                  
                  return (
                    <button key={s.id_soal} onClick={() => setCurrentIndex(idx)} className={btnClass}>
                      {idx + 1}
                    </button>
                  );
                })}
              </div>
              <div className="mt-auto pt-md border-t border-outline-variant dark:border-slate-800">
                <div className="flex items-center gap-sm mb-xs">
                  <div className="w-4 h-4 bg-[#10B981] rounded-sm"></div>
                  <span className="font-label-md text-label-md text-on-surface-variant dark:text-slate-400">Terjawab ({answeredCount})</span>
                </div>
                <div className="flex items-center gap-sm mb-xs">
                  <div className="w-4 h-4 bg-[#D97706] rounded-sm"></div>
                  <span className="font-label-md text-label-md text-on-surface-variant dark:text-slate-400">Ragu-ragu ({flaggedCount})</span>
                </div>
                <div className="flex items-center gap-sm mb-xs">
                  <div className="w-4 h-4 border border-outline-variant dark:border-slate-700 rounded-sm bg-white dark:bg-slate-800"></div>
                  <span className="font-label-md text-label-md text-on-surface-variant dark:text-slate-400">Belum Dijawab ({unansweredCount})</span>
                </div>
                <div className="flex items-center gap-sm">
                  <div className="w-4 h-4 bg-primary rounded-sm ring-1 ring-primary ring-offset-1 dark:ring-offset-slate-900"></div>
                  <span className="font-label-md text-label-md text-on-surface-variant dark:text-slate-400">Posisi Saat Ini</span>
                </div>
              </div>
            </aside>

            {/* Main Content (Canvas) */}
            <main className="flex-1 md:ml-80 flex flex-col bg-background dark:bg-slate-900 relative overflow-y-auto pb-24 transition-colors duration-500">
              <div className="max-w-[1200px] mx-auto w-full p-md md:p-xl mt-sm md:mt-lg">
                {currentS ? (
                  <div className="bg-white dark:bg-slate-800 border-2 border-primary dark:border-primary/50 rounded-lg p-md md:p-xl shadow-sm mb-xl">
                    <div className="flex justify-between items-center mb-md pb-md border-b border-outline-variant dark:border-slate-700">
                      <span className="font-headline-md text-headline-md text-on-surface dark:text-white">Soal No. {currentIndex + 1}</span>
                      <div className="flex items-center gap-sm bg-surface-container dark:bg-slate-700 py-xs px-sm rounded-full">
                        <span className="material-symbols-outlined text-secondary dark:text-slate-300" style={{fontSize: "16px"}}>category</span>
                        <span className="font-label-md text-label-md text-secondary dark:text-slate-300 uppercase">{currentS.tipe_soal}</span>
                      </div>
                    </div>
                    <div className="font-question-text text-question-text text-on-surface dark:text-white mb-xl whitespace-pre-wrap">
                      {currentS.pertanyaan}
                    </div>
                    {/* Options */}
                    <div className="space-y-sm">
                      {renderQuestionInput(currentS)}
                    </div>
                  </div>
                ) : (
                  <div className="text-center text-on-surface-variant py-20 font-bold text-xl">Tidak ada soal yang tersedia.</div>
                )}
              </div>
              
              {/* Bottom Action Bar */}
              {currentS && (
                <div className="fixed bottom-0 md:left-80 left-0 right-0 h-20 bg-white dark:bg-slate-900 border-t border-outline-variant dark:border-slate-800 px-md md:px-xl flex items-center justify-between shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-40 transition-colors duration-500">
                  <button 
                    onClick={() => setCurrentIndex(Math.max(0, currentIndex - 1))}
                    disabled={currentIndex === 0}
                    className="flex items-center gap-xs px-md md:px-lg py-sm border-2 border-primary dark:border-primary-fixed text-primary dark:text-primary-fixed font-body-md text-body-md font-semibold rounded hover:bg-primary-fixed dark:hover:bg-primary/20 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    <span className="material-symbols-outlined">arrow_back</span>
                    <span className="hidden sm:inline">Sebelumnya</span>
                  </button>
                  <div className="flex items-center gap-md md:gap-lg">
                    <label className="flex items-center cursor-pointer gap-sm group">
                      <div className="relative flex items-center justify-center w-6 h-6 border-2 border-outline-variant dark:border-slate-600 rounded group-hover:border-[#D97706] transition-colors">
                        <input type="checkbox" checked={raguRagu[currentS.id_soal] || false} onChange={() => toggleRaguRagu(currentS.id_soal)} className="absolute opacity-0 w-full h-full cursor-pointer peer"/>
                        <span className="material-symbols-outlined text-[#D97706] opacity-0 peer-checked:opacity-100 transition-opacity" style={{fontSize: "20px", fontVariationSettings: "'FILL' 1"}}>check</span>
                      </div>
                      <span className="font-body-md text-body-md text-on-surface dark:text-slate-200 group-hover:text-[#D97706] dark:group-hover:text-[#D97706] transition-colors hidden sm:inline">Tandai Ragu-ragu</span>
                    </label>
                    <button 
                      onClick={() => setCurrentIndex(Math.min(soal.length - 1, currentIndex + 1))}
                      disabled={currentIndex === soal.length - 1}
                      className="flex items-center gap-xs px-md md:px-lg py-sm bg-primary text-on-primary font-body-md text-body-md font-semibold rounded hover:bg-on-primary-fixed-variant transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                      <span className="hidden sm:inline">Selanjutnya</span>
                      <span className="material-symbols-outlined">arrow_forward</span>
                    </button>
                  </div>
                </div>
              )}
            </main>
          </div>

          <Modal
            isOpen={confirmModal.isOpen}
            title="Konfirmasi Pengumpulan"
            message={`Anda telah menjawab ${answeredCount} dari ${soal.length} soal. Yakin ingin mengumpulkan ujian sekarang? Waktu Anda masih tersisa. Anda tidak bisa kembali setelah menekan tombol Kumpulkan.`}
            type="warning"
            onClose={() => setConfirmModal({ isOpen: false })}
            onConfirm={() => executeSubmitExam(false)}
            confirmText="Ya, Kumpulkan"
          />
        </div>
      );
    };

    // ==========================================
    // VIEW: SISWA (DASHBOARD)
    // ==========================================
    const SiswaView = ({ user, onLogout, showMessage, isDarkMode, setIsDarkMode }) => {
      const [jadwal, setJadwal] = useState([]);
      const [isLoading, setIsLoading] = useState(false);
      const [activeExamData, setActiveExamData] = useState(null);
      const [inputToken, setInputToken] = useState('');
      const [selectedJadwalUntukToken, setSelectedJadwalUntukToken] = useState(null);

      useEffect(() => { loadJadwal(); }, []);

      const loadJadwal = async () => {
        setIsLoading(true);
        const res = await fetchAPI('get_jadwal', { id_siswa: user.id_user });
        if (res.status === 'success') setJadwal(res.data);
        setIsLoading(false);
      };

      const handleMulaiUjian = async (j) => {
        if (!inputToken) {
          showMessage('Perhatian', 'Harap masukkan 6 digit token dari pengawas.', 'warning');
          return;
        }

        setIsLoading(true);
        const res = await fetchAPI('mulai_ujian', {
          id_jadwal: j.id_jadwal,
          id_siswa: user.id_user,
          token: inputToken.toUpperCase()
        });
        setIsLoading(false);

        if (res.status === 'success') {
          setActiveExamData({ jadwal: j, idLog: res.id_log });
        } else {
          showMessage('Akses Ditolak', res.message, 'error');
        }
      };

      if (activeExamData) {
        return (
          <ExamRoom
            user={user}
            jadwal={activeExamData.jadwal}
            idLog={activeExamData.idLog}
            showMessage={showMessage}
            onFinish={() => {
              setActiveExamData(null);
              setSelectedJadwalUntukToken(null);
              setInputToken('');
              loadJadwal();
            }}
            isDarkMode={isDarkMode}
            setIsDarkMode={setIsDarkMode}
          />
        );
      }

      return (
        <div className="bg-background dark:bg-slate-900 text-on-background dark:text-slate-100 min-h-screen font-body-md text-body-md antialiased selection:bg-primary-container selection:text-on-primary-container flex flex-col transition-colors duration-500">
          {/* TopNavBar */}
          <nav className="bg-surface/90 dark:bg-slate-900/90 backdrop-blur-md fixed top-0 w-full z-50 flex justify-between items-center px-lg h-16 border-b border-outline-variant dark:border-slate-800 transition-colors duration-500">
            <div className="flex items-center gap-xl">
              <div className="flex items-center h-8">
                  <img src="https://lh3.googleusercontent.com/aida/AEtjO1VVZfSUCXhHzY1X0SeCMcnnfH7eVLHQqeKZRoS92h6LX1juBz1mnHDbVWx1-Ba6QJacojgIbeoyE3UGy8T6Tb1_zTR54w2rmJiBCsvoFvsirZvz0_Sze5GuvCCAGNsKINOED0RXdkwpJDJinvxgu4KYdM823w67kkw4wzY5RntMk58ZhF_-cEiEvWXFYy34ycs42ktHbpwy_GH_ydOPW5eO4S5k_plk9debDcu5KRZwhT3Qv_0W8MX-" alt="NEXA Logo" className="h-full w-auto object-contain" />
              </div>
              <div className="hidden md:flex items-center h-full gap-lg">
                <a className="h-16 flex items-center text-primary dark:text-primary-fixed font-bold border-b-2 border-primary dark:border-primary-fixed font-label-md text-label-md" href="#">Portal Ujian Siswa</a>
              </div>
            </div>
            <div className="flex items-center gap-md">
              <button className="w-10 h-10 flex items-center justify-center rounded-full text-secondary dark:text-slate-400 hover:bg-surface-container-highest dark:hover:bg-slate-800 transition-colors relative hidden sm:flex">
                <span className="material-symbols-outlined">notifications</span>
              </button>
              <button onClick={() => setIsDarkMode(!isDarkMode)} className="w-9 h-9 rounded-full bg-surface-container-highest dark:bg-slate-800 border border-outline-variant dark:border-slate-700 flex items-center justify-center text-on-surface dark:text-white hover:bg-white dark:hover:bg-slate-700 transition-colors shadow-sm">
                <span className="material-symbols-outlined text-[20px]">{isDarkMode ? 'light_mode' : 'dark_mode'}</span>
              </button>
              <div className="ml-sm flex items-center gap-sm cursor-pointer border-l pl-sm border-outline-variant dark:border-slate-700">
                <div className="flex flex-col items-end">
                  <span className="text-sm font-bold text-slate-700 dark:text-slate-200 hidden sm:block">{user.nama_lengkap}</span>
                  <span className="text-[10px] text-slate-500 hidden sm:block uppercase font-bold tracking-wider">{user.id_user}</span>
                </div>
              </div>
              <button onClick={onLogout} className="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant dark:text-slate-400 hover:bg-error-container/20 hover:text-error transition-colors cursor-pointer active:opacity-80" title="Logout">
                <span className="material-symbols-outlined">logout</span>
              </button>
            </div>
          </nav>

          {/* Main Content Canvas */}
          <main className="pt-[96px] px-md md:px-lg max-w-container-max mx-auto space-y-gutter pb-xl flex-1 w-full">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-sm mb-lg">
              <div>
                <h1 className="font-headline-lg text-headline-lg text-on-surface dark:text-white flex items-center gap-2">
                  <span className="material-symbols-outlined text-primary dark:text-primary-fixed text-[32px]">menu_book</span> Daftar Ujian Tersedia
                </h1>
                <p className="font-body-md text-body-md text-on-surface-variant dark:text-slate-400 mt-1">Pilih jadwal ujian dan masukkan token dari pengawas untuk memulai.</p>
              </div>
              <div className="flex gap-sm">
                <button onClick={loadJadwal} className="bg-primary text-on-primary py-sm px-md rounded-lg font-label-md text-label-md hover:bg-on-primary-fixed-variant transition-colors flex items-center gap-2">
                  <span className="material-symbols-outlined text-[18px]">refresh</span> Refresh Jadwal
                </button>
              </div>
            </div>

            {isLoading ? <Loader text="Menyinkronkan jadwal..." /> : (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {jadwal.map(j => (
                  <div key={j.id_jadwal} className="group bg-white dark:bg-slate-800 border border-outline-variant dark:border-slate-700 rounded-xl p-6 hover:shadow-lg hover:-translate-y-1 hover:border-primary/30 transition-all duration-300 relative overflow-hidden flex flex-col">
                    <div className="absolute top-0 right-0 w-32 h-32 bg-primary/5 dark:bg-primary-fixed/5 rounded-full -translate-y-10 translate-x-10 group-hover:scale-110 transition-transform duration-500 pointer-events-none"></div>
                    <div className={`absolute top-0 left-0 w-full h-1 ${j.status_siswa === 'SELESAI' ? 'bg-[#10B981]' : j.status_siswa === 'SEDANG KERJA' ? 'bg-[#D97706]' : 'bg-primary'}`}></div>

                    <h3 className="font-headline-sm text-headline-sm text-on-surface dark:text-white mb-2 pt-2 relative z-10">{j.nama_mapel}</h3>
                    <div className="flex items-center gap-2 mb-4 relative z-10">
                      <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider ${j.status_siswa === 'SELESAI' ? 'bg-[#10B981]/10 text-[#10B981] dark:bg-[#10B981]/20 dark:text-[#81c995]' :
                          j.status_siswa === 'SEDANG KERJA' ? 'bg-[#D97706]/10 text-[#D97706] dark:bg-[#D97706]/20 dark:text-[#fcd34d]' :
                            'bg-surface-variant text-on-surface-variant dark:bg-slate-700 dark:text-slate-300'
                        }`}>
                        Status: {j.status_siswa}
                      </span>
                    </div>

                    <div className="font-body-md text-body-md text-on-surface-variant dark:text-slate-300 mb-6 space-y-2 bg-surface-container-low dark:bg-slate-900/50 p-4 rounded-xl border border-outline-variant dark:border-slate-700 flex-1 relative z-10">
                      <div className="flex justify-between items-center border-b border-outline-variant dark:border-slate-700 pb-2">
                        <span className="font-medium flex items-center gap-1"><span className="material-symbols-outlined text-[16px]">schedule</span> Buka</span>
                        <span className="font-bold text-on-surface dark:text-white">{new Date(j.waktu_mulai).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                      </div>
                      <div className="flex justify-between items-center pt-1">
                        <span className="font-medium flex items-center gap-1"><span className="material-symbols-outlined text-[16px]">timer_off</span> Tutup</span>
                        <span className="font-bold text-error dark:text-error-container">{new Date(j.waktu_selesai).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                      </div>
                    </div>

                    {j.status_siswa !== 'SELESAI' ? (
                      selectedJadwalUntukToken === j.id_jadwal ? (
                        <div className="animate-fade-in-up bg-primary-fixed/30 dark:bg-primary/20 p-4 rounded-xl border border-primary-fixed-dim dark:border-primary/30 relative z-10">
                          <input
                            type="text"
                            placeholder="6 DIGIT TOKEN"
                            className="w-full text-center tracking-[0.3em] font-mono font-bold text-xl p-3 border border-primary/30 dark:border-primary/50 rounded-lg mb-3 focus:ring-2 focus:ring-primary outline-none uppercase bg-white dark:bg-slate-800 text-on-surface dark:text-white"
                            value={inputToken}
                            onChange={(e) => setInputToken(e.target.value)}
                            maxLength={6}
                          />
                          <div className="flex gap-2">
                            <button onClick={() => setSelectedJadwalUntukToken(null)} className="flex-1 py-2 bg-white dark:bg-slate-700 text-on-surface-variant dark:text-slate-300 rounded-lg font-label-md text-label-md hover:bg-surface-container-low dark:hover:bg-slate-600 border border-outline-variant dark:border-slate-600 transition-colors">Batal</button>
                            <button onClick={() => handleMulaiUjian(j)} className="flex-1 py-2 bg-primary text-on-primary py-sm px-md rounded-lg font-label-md text-label-md hover:bg-on-primary-fixed-variant shadow-sm transition-transform active:scale-95">Masuk Ujian</button>
                          </div>
                        </div>
                      ) : (
                        <button
                          onClick={() => setSelectedJadwalUntukToken(j.id_jadwal)}
                          className={`w-full py-3 rounded-xl font-label-md text-label-md transition-all shadow-sm active:scale-95 border relative z-10 ${j.status_siswa === 'SEDANG KERJA' ? 'bg-[#D97706]/10 text-[#D97706] hover:bg-[#D97706]/20 border-[#D97706]/30 dark:bg-[#D97706]/20 dark:text-[#fcd34d] dark:hover:bg-[#D97706]/30' : 'bg-primary text-on-primary hover:bg-on-primary-fixed-variant border-transparent'
                            }`}
                        >
                          {j.status_siswa === 'SEDANG KERJA' ? 'LANJUTKAN UJIAN' : 'MULAI KERJAKAN'}
                        </button>
                      )
                    ) : (
                      <div className="w-full py-3 bg-surface-container dark:bg-slate-800 text-on-surface-variant dark:text-slate-400 rounded-xl font-label-md text-label-md border border-outline-variant dark:border-slate-700 flex flex-col items-center relative z-10">
                        <span>SUDAH DISELESAIKAN</span>
                        <span className="text-[12px] font-normal mt-1 text-on-surface dark:text-slate-200 font-bold">Skor Objektif: {j.nilai_auto || 0}</span>
                      </div>
                    )}
                  </div>
                ))}
                {jadwal.length === 0 && (
                  <div className="col-span-full py-12 text-center font-body-md text-on-surface-variant">Tidak ada jadwal ujian saat ini.</div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    };

    // ==========================================
    // ROOT APP & LOGIN
    // ==========================================
    const App = () => {
      const [user, setUser] = useState(null);
      const [isRegistering, setIsRegistering] = useState(false);
      const [loading, setLoading] = useState(false);

      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [rememberMe, setRememberMe] = useState(false);
      const [loginError, setLoginError] = useState('');
      const [loginSuccess, setLoginSuccess] = useState(false);
      const [isOnline, setIsOnline] = useState(navigator.onLine);
