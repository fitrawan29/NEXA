<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBT AKM Terpadu</title>

  <!-- Tailwind CSS -->

      darkMode: "class",

          colors: {

            "primary-container": "#1a56db",
            "inverse-primary": "#b5c4ff",
            "inverse-on-surface": "#f0f0fb",
            "surface-variant": "#e2e1ed",
            "inverse-surface": "#2e3039",
            "on-primary": "#ffffff",
            "secondary-fixed": "#dce2f7",
            "primary-fixed": "#dbe1ff",
            "on-primary-fixed": "#00174d",
            "outline": "#737686",
            "on-primary-container": "#d4dcff",
            "outline-variant": "#c3c5d7",
            "background": "#faf8ff",
            "on-secondary-fixed-variant": "#404758",
            "surface-container-highest": "#e2e1ed",
            "surface": "#faf8ff",
            "secondary": "#575e70",
            "surface-container": "#ededf8",
            "on-tertiary": "#ffffff",
            "on-error": "#ffffff",
            "surface-container-low": "#f3f3fe",
            "surface-bright": "#faf8ff",
            "surface-container-lowest": "#ffffff",
            "on-tertiary-fixed": "#191c1d",
            "on-primary-fixed-variant": "#003dab",
            "secondary-container": "#d9dff5",
            "secondary-fixed-dim": "#c0c6db",
            "on-secondary": "#ffffff",
            "on-secondary-container": "#5c6274",
            "primary": "#003fb1",
            "tertiary-fixed-dim": "#c5c7c8",
            "on-surface-variant": "#434654",
            "on-tertiary-container": "#dcdedf",
            "surface-tint": "#1353d8",
            "tertiary-container": "#5f6263",
            "on-surface": "#191b23",
            "error": "#ba1a1a",
            "surface-container-high": "#e7e7f3",
            "tertiary": "#484a4b",
            "on-secondary-fixed": "#141b2b",
            "error-container": "#ffdad6",
            "surface-dim": "#d9d9e4"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",

          spacing: {

            "base": "8px",

            "sm": "12px"
          },
          fontFamily: {
            "headline-lg": ["Inter"],

            "mono-label": ["Courier Prime"],
            "headline-sm": ["Inter"],

            "question-text": ["Inter"],
            "headline-md": ["Inter"],
            "body-md": ["Inter"],
            "body-lg": ["Inter"]
          },
          fontSize: {
            "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }],
            "headline-lg-mobile": ["24px", { lineHeight: "32px", fontWeight: "700" }],
            "mono-label": ["14px", { lineHeight: "20px", fontWeight: "400" }],
            "headline-sm": ["20px", { lineHeight: "28px", fontWeight: "600" }],
            "label-md": ["12px", { lineHeight: "16px", fontWeight: "600" }],
            "question-text": ["18px", { lineHeight: "28px", fontWeight: "500" }],
            "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
            "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
            "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }]
          }

      }
    };
  </script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #faf8ff; /* surface */
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 20px;
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.4s ease-out forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Stitch Custom Styles */
    .academic-input:focus {
      outline: none;
      border-color: #1a56db;
      box-shadow: 0 0 0 4px rgba(26, 86, 219, 0.1);
    }
    .form-slider {
      display: flex;
      width: 200%;
      transition: transform 0.4s ease-in-out;
    }
    .show-register {
      transform: translateX(-50%);
    }
    .form-pane {
      width: 50%;
      flex-shrink: 0;
    }
  </style>
</head>

<body>
  <!-- Root DOM Node for React -->
  <div id="root"></div>

  <!-- React Code Block -->
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ==============================================================================
    // KONFIGURASI UTAMA
    // PENTING: GANTI URL INI DENGAN URL WEB APP DARI GOOGLE APPS SCRIPT KAMU!
    // ==============================================================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbwT8XXxRAti-nlIj5dRP5zYcjXvSxYVJlETYtn3a_m0jx_xaacvtNUTrB26ocj8O573tw/exec';

    // Utility: Penghitung Waktu Mundur
    const calculateTimeLeft = (endTime) => {
      const difference = new Date(endTime) - new Date();
      if (difference <= 0) return { total: 0, hours: 0, minutes: 0, seconds: 0 };
      return {
        total: difference,
        hours: Math.floor((difference / (1000 * 60 * 60)) % 24),
        minutes: Math.floor((difference / 1000 / 60) % 60),
        seconds: Math.floor((difference / 1000) % 60)
      };
    };

    // Fungsi helper untuk fetching API ke GAS
    const fetchAPI = async (action, payload = {}) => {
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, payload })
        });
        return await response.json();
      } catch (error) {
        console.error("API Error:", error);
        return { status: 'error', message: 'Koneksi ke server gagal. Pastikan URL API (Google Apps Script) sudah benar dan di-deploy dengan benar.' };
      }
    };

    // Komponen Modal Premium (Pengganti Alert dan Confirm bawaan browser)
    const Modal = ({ isOpen, title, message, onClose, type = 'info', children, onConfirm, confirmText = "Lanjutkan" }) => {
      if (!isOpen) return null;
      const bgColors = { info: 'bg-blue-600', warning: 'bg-yellow-500', error: 'bg-red-600', success: 'bg-green-600' };

      return (
        <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-900/70 backdrop-blur-sm p-4 transition-opacity">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden animate-fade-in-up transform transition-all">
            <div className={`${bgColors[type]} p-5 text-white font-bold text-lg flex items-center justify-between`}>
              {title}
            </div>
            <div className="p-6 text-gray-700 font-medium leading-relaxed">
              {message}
              {children}
            </div>
            <div className="p-4 bg-gray-50 flex justify-end gap-3 border-t border-gray-100">
              {onConfirm && (
                <button onClick={onClose} className="px-5 py-2 bg-white text-slate-700 border border-slate-300 rounded-xl hover:bg-slate-100 transition-colors font-bold shadow-sm">
                  Batal
                </button>
              )}
              <button onClick={onConfirm ? onConfirm : onClose} className={`px-6 py-2 text-white rounded-xl transition-colors font-bold shadow-md ${onConfirm ? 'bg-blue-600 hover:bg-blue-700' : 'bg-slate-800 hover:bg-slate-700'}`}>
                {onConfirm ? confirmText : "Mengerti"}
              </button>
            </div>
          </div>
        </div>
      );
    };

    const Loader = ({ text = "Memuat data..." }) => (
      <div className="flex flex-col justify-center items-center p-12 space-y-4 w-full">
        <div className="animate-spin rounded-full h-14 w-14 border-4 border-slate-200 border-t-blue-600 shadow-sm"></div>
        <p className="text-slate-500 font-medium animate-pulse">{text}</p>
      </div>
    );

    // ==========================================
    // VIEW: ADMIN
    // ==========================================
    const AdminView = ({ user, onLogout }) => {
      const [dashboardData, setDashboardData] = useState(null);
      const [isLoading, setIsLoading] = useState(true);

      useEffect(() => {
        const fetchDashboardData = async () => {
          setIsLoading(true);
          const res = await fetchAPI('get_admin_dashboard_data', {});
          if (res.status === 'success') {
            setDashboardData(res.data);
          }
          setIsLoading(false);
        };
        fetchDashboardData();
      }, []);

      return (
        <div className="bg-background text-on-background antialiased flex min-h-screen">
          {/* SideNavBar */}
          <nav className="bg-surface-container-low text-primary docked left-0 h-full w-64 border-r border-outline-variant flat no shadows fixed top-0 flex flex-col p-md z-40 hidden md:flex">
            {/* Header */}
            <div className="flex items-center space-x-sm mb-lg px-sm">
              <img alt="NEXA Logo" className="w-10 h-10 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1VVZfSUCXhHzY1X0SeCMcnnfH7eVLHQqeKZRoS92h6LX1juBz1mnHDbVWx1-Ba6QJacojgIbeoyE3UGy8T6Tb1_zTR54w2rmJiBCsvoFvsirZvz0_Sze5GuvCCAGNsKINOED0RXdkwpJDJinvxgu4KYdM823w67kkw4wzY5RntMk58ZhF_-cEiEvWXFYy34ycs42ktHbpwy_GH_ydOPW5eO4S5k_plk9debDcu5KRZwhT3Qv_0W8MX-"/>
              <div>
                <h1 className="font-headline-sm text-headline-sm font-bold text-on-surface">NEXA</h1>
                <p className="font-label-md text-label-md text-on-surface-variant">Panel Kontrol</p>
              </div>
            </div>
            {/* Navigation Links */}
            <div className="flex-1 space-y-base mt-md">
              <a className="flex items-center space-x-sm px-md py-sm bg-primary-container text-on-primary-container rounded-lg font-label-md text-label-md duration-200 ease-in-out" href="#">
                <span className="material-symbols-outlined" style={{ fontVariationSettings: "'FILL' 1" }}>dashboard</span>
                <span>Beranda</span>
              </a>
              <a href="https://docs.google.com/spreadsheets/" target="_blank" rel="noreferrer" className="flex items-center space-x-sm px-md py-sm text-on-surface-variant hover:bg-surface-container-highest transition-colors rounded-lg font-label-md text-label-md duration-200 ease-in-out">
                <span className="material-symbols-outlined">database</span>
                <span>Database (Sheets)</span>
              </a>
            </div>
            {/* Footer Links */}
            <div className="mt-auto pt-md border-t border-outline-variant">
              <button onClick={onLogout} className="w-full flex items-center space-x-sm px-md py-sm text-on-surface-variant hover:bg-surface-container-highest transition-colors rounded-lg font-label-md text-label-md duration-200 ease-in-out">
                <span className="material-symbols-outlined">logout</span>
                <span>Keluar</span>
              </button>
            </div>
          </nav>

          {/* Main Content Canvas */}
          <main className="flex-1 ml-0 md:ml-64 flex flex-col bg-background">
            {/* TopNavBar */}
            <header className="bg-surface text-primary font-body-md text-body-md docked full-width top-0 border-b border-outline-variant flat no shadows sticky top-0 z-30 flex justify-between items-center px-lg h-16 transition-all">
              <div className="md:hidden flex items-center">
                <span className="font-headline-sm text-headline-sm font-bold text-primary">NEXA Admin</span>
              </div>
              <div className="hidden md:flex flex-1"></div>
              <div className="flex items-center space-x-lg">
                <div className="flex items-center space-x-sm">
                  <div className="ml-sm flex items-center gap-sm cursor-pointer">
                    <span className="text-sm font-bold text-slate-700 hidden sm:block">{user.nama_lengkap}</span>
                    <div className="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-bold border border-outline-variant">
                      {user.nama_lengkap.charAt(0).toUpperCase()}
                    </div>
                  </div>
                </div>
              </div>
            </header>

            {/* Page Content */}
            <div className="p-md md:p-lg xl:p-xl overflow-y-auto w-full max-w-6xl mx-auto">
              <div className="mb-lg">
                <h2 className="font-headline-md text-headline-md text-on-surface">Dashboard Ringkasan</h2>
                <p className="font-body-md text-body-md text-on-surface-variant mt-xs">Tinjauan sistem operasional sekolah saat ini.</p>
              </div>
              
              {isLoading ? <Loader text="Menarik data dashboard..." /> : (
                <>
                  {/* Bento Grid - Summary Cards */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-md mb-lg">
                    {/* Card 1 */}
                    <div className="bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col justify-between h-32 hover:shadow-[0_4px_8px_rgba(0,0,0,0.05)] transition-shadow">
                      <div className="flex justify-between items-start">
                        <p className="font-label-md text-label-md text-on-surface-variant">Total Siswa</p>
                        <span className="material-symbols-outlined text-primary-container bg-primary-fixed p-1 rounded-lg">group</span>
                      </div>
                      <div>
                        <p className="font-headline-lg text-headline-lg text-on-surface">{dashboardData?.totalSiswa || 0}</p>
                        <p className="font-label-md text-label-md text-secondary mt-1">Siswa terdaftar</p>
                      </div>
                    </div>
                    {/* Card 2 */}
                    <div className="bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col justify-between h-32 hover:shadow-[0_4px_8px_rgba(0,0,0,0.05)] transition-shadow">
                      <div className="flex justify-between items-start">
                        <p className="font-label-md text-label-md text-on-surface-variant">Total Guru</p>
                        <span className="material-symbols-outlined text-primary-container bg-primary-fixed p-1 rounded-lg">school</span>
                      </div>
                      <div>
                        <p className="font-headline-lg text-headline-lg text-on-surface">{dashboardData?.totalGuru || 0}</p>
                        <p className="font-label-md text-label-md text-secondary mt-1">Aktif mengajar</p>
                      </div>
                    </div>
                    {/* Card 3 */}
                    <div className="bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col justify-between h-32 hover:shadow-[0_4px_8px_rgba(0,0,0,0.05)] transition-shadow">
                      <div className="flex justify-between items-start">
                        <p className="font-label-md text-label-md text-on-surface-variant">Total Ujian</p>
                        <span className="material-symbols-outlined text-primary-container bg-primary-fixed p-1 rounded-lg">assignment</span>
                      </div>
                      <div>
                        <p className="font-headline-lg text-headline-lg text-on-surface">{dashboardData?.totalJadwal || 0}</p>
                        <p className="font-label-md text-label-md text-secondary mt-1">Jadwal yang dibuat</p>
                      </div>
                    </div>
                    {/* Card 4 */}
                    <div className="bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col justify-between h-32 hover:shadow-[0_4px_8px_rgba(0,0,0,0.05)] transition-shadow">
                      <div className="flex justify-between items-start">
                        <p className="font-label-md text-label-md text-on-surface-variant">Sesi Ujian Aktif</p>
                        <span className="material-symbols-outlined text-[#059669] bg-[#d1fae5] p-1 rounded-lg">speed</span>
                      </div>
                      <div>
                        <p className="font-headline-lg text-headline-lg text-on-surface">{dashboardData?.totalSesiAktif || 0}</p>
                        <p className="font-label-md text-label-md text-secondary mt-1">Sedang mengerjakan</p>
                      </div>
                    </div>
                  </div>

                  {/* Data Table Section */}
                  <div className="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden">
                    <div className="p-md border-b border-outline-variant flex justify-between items-center bg-background">
                      <h3 className="font-headline-sm text-headline-sm text-on-surface">Jadwal Ujian Aktif</h3>
                    </div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse">
                        <thead>
                          <tr className="bg-background font-label-md text-label-md text-on-surface-variant border-b border-outline-variant">
                            <th className="py-sm px-md font-medium">ID Jadwal</th>
                            <th className="py-sm px-md font-medium">Mata Pelajaran</th>
                            <th className="py-sm px-md font-medium">Guru</th>
                            <th className="py-sm px-md font-medium">Waktu Mulai</th>
                            <th className="py-sm px-md font-medium">Waktu Selesai</th>
                          </tr>
                        </thead>
                        <tbody className="font-body-md text-body-md text-on-surface">
                          {dashboardData?.jadwalAktif?.length > 0 ? dashboardData.jadwalAktif.map((j) => (
                            <tr key={j.id_jadwal} className="border-b border-outline-variant hover:bg-surface-container-low transition-colors">
                              <td className="py-sm px-md font-mono text-outline">{j.id_jadwal}</td>
                              <td className="py-sm px-md font-medium">{j.nama_mapel}</td>
                              <td className="py-sm px-md">{j.guru}</td>
                              <td className="py-sm px-md">{new Date(j.waktu_mulai).toLocaleString('id-ID')}</td>
                              <td className="py-sm px-md text-error">{new Date(j.waktu_selesai).toLocaleString('id-ID')}</td>
                            </tr>
                          )) : (
                            <tr>
                              <td colSpan="5" className="py-md text-center text-on-surface-variant">Tidak ada jadwal aktif</td>
                            </tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </>
              )}
            </div>
          </main>
        </div>
      );
    };

    // ==========================================
    // VIEW: GURU / PENGAWAS
    // ==========================================
    const GuruView = ({ user, onLogout, showMessage }) => {
      const [jadwalAktif, setJadwalAktif] = useState([]);
      const [selectedJadwal, setSelectedJadwal] = useState(null);
      const [monitoringData, setMonitoringData] = useState([]);
      const [token, setToken] = useState('------');
      const [isLoading, setIsLoading] = useState(false);

      const [gradingModal, setGradingModal] = useState({ isOpen: false, siswa: null, nilaiInput: '' });

      useEffect(() => { loadJadwal(); }, []);

      useEffect(() => {
        let tokenInterval;
        if (selectedJadwal) {
          tokenInterval = setInterval(() => fetchToken(selectedJadwal), 300000);
        }
        return () => clearInterval(tokenInterval);
      }, [selectedJadwal]);

      const loadJadwal = async () => {
        setIsLoading(true);
        const res = await fetchAPI('get_jadwal_pengawas');
        if (res.status === 'success') setJadwalAktif(res.data);
        setIsLoading(false);
      };

      const fetchToken = async (id_jadwal) => {
        const res = await fetchAPI('get_token', { id_jadwal });
        if (res.status === 'success') setToken(res.token);
      };

      const loadMonitoring = async (id_jadwal) => {
        setIsLoading(true);
        setSelectedJadwal(id_jadwal);
        await fetchToken(id_jadwal);
        const res = await fetchAPI('monitoring_ujian', { id_jadwal });
        if (res.status === 'success') setMonitoringData(res.data);
        setIsLoading(false);
      };

      const unblockAkun = async (id_log) => {
        const res = await fetchAPI('buka_blokir', { id_log });
        if (res.status === 'success') {
          showMessage('Sukses', 'Blokir berhasil dibuka. Siswa dapat melanjutkan ujian.', 'success');
          loadMonitoring(selectedJadwal);
        } else {
          showMessage('Gagal', res.message, 'error');
        }
      };

      const submitNilaiUraian = async () => {
        if (!gradingModal.nilaiInput || isNaN(gradingModal.nilaiInput)) {
          showMessage('Error', 'Masukkan angka yang valid.', 'error');
          return;
        }
        const res = await fetchAPI('submit_nilai_uraian', { id_log: gradingModal.siswa.id_log, nilai: gradingModal.nilaiInput });
        if (res.status === 'success') {
          setGradingModal({ isOpen: false, siswa: null, nilaiInput: '' });
          showMessage('Tersimpan', 'Nilai uraian berhasil diupdate.', 'success');
          loadMonitoring(selectedJadwal);
        }
      };

      return (
        <div className="bg-background text-on-background min-h-screen font-body-md text-body-md antialiased selection:bg-primary-container selection:text-on-primary-container flex flex-col">
          {/* TopNavBar */}
          <nav className="bg-surface fixed top-0 w-full z-50 flex justify-between items-center px-lg h-16 border-b border-outline-variant">
            <div className="flex items-center gap-xl">
              <div className="flex items-center h-8">
                  <img src="https://lh3.googleusercontent.com/aida/AEtjO1VVZfSUCXhHzY1X0SeCMcnnfH7eVLHQqeKZRoS92h6LX1juBz1mnHDbVWx1-Ba6QJacojgIbeoyE3UGy8T6Tb1_zTR54w2rmJiBCsvoFvsirZvz0_Sze5GuvCCAGNsKINOED0RXdkwpJDJinvxgu4KYdM823w67kkw4wzY5RntMk58ZhF_-cEiEvWXFYy34ycs42ktHbpwy_GH_ydOPW5eO4S5k_plk9debDcu5KRZwhT3Qv_0W8MX-" alt="NEXA Logo" className="h-full w-auto object-contain" />
              </div>
              <div className="hidden md:flex items-center h-full gap-lg">
                <a className="h-16 flex items-center text-primary font-bold border-b-2 border-primary font-label-md text-label-md" href="#">Dashboard Pemantauan</a>
              </div>
            </div>
            <div className="flex items-center gap-md">
              <div className="ml-sm flex items-center gap-sm cursor-pointer">
                <span className="text-sm font-bold text-slate-700 hidden sm:block">{user.nama_lengkap}</span>
              </div>
              <button onClick={onLogout} className="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-error-container/20 hover:text-error transition-colors cursor-pointer active:opacity-80 transition-all" title="Logout">
                <span className="material-symbols-outlined">logout</span>
              </button>
            </div>
          </nav>

          {/* Main Content Canvas */}
          <main className="pt-[96px] px-md md:px-lg max-w-container-max mx-auto space-y-gutter pb-xl flex-1 w-full">
            {!selectedJadwal ? (
              /* Pemilihan Jadwal */
              <>
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-sm mb-lg">
                  <div>
                    <h1 className="font-headline-lg text-headline-lg text-on-surface">Pilih Jadwal Ujian</h1>
                    <p className="font-body-md text-body-md text-on-surface-variant mt-1">Pilih jadwal ujian yang ingin Anda pantau.</p>
                  </div>
                  <div className="flex gap-sm">
                    <button onClick={loadJadwal} className="bg-primary text-on-primary py-sm px-md rounded-lg font-label-md text-label-md hover:bg-on-primary-fixed-variant transition-colors flex items-center gap-2">
                      <span className="material-symbols-outlined text-[18px]">refresh</span> Refresh Jadwal
                    </button>
                  </div>
                </div>

                {isLoading ? <Loader text="Memuat jadwal ujian..." /> : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {jadwalAktif.map(j => (
                      <div key={j.id_jadwal} className="bg-surface-container-lowest border border-outline-variant rounded-xl p-6 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between">
                        <div>
                          <h3 className="font-headline-sm text-headline-sm text-on-surface mb-1">{j.nama_mapel}</h3>
                          <p className="font-mono-label text-mono-label text-on-surface-variant mb-4">{j.id_jadwal}</p>
                          <div className="text-sm text-on-surface-variant mb-6 bg-surface p-4 rounded-xl border border-outline-variant">
                            <div className="flex justify-between mb-1"><span>Mulai:</span> <span className="font-semibold text-on-surface">{new Date(j.waktu_mulai).toLocaleString()}</span></div>
                            <div className="flex justify-between"><span>Selesai:</span> <span className="font-semibold text-on-surface">{new Date(j.waktu_selesai).toLocaleString()}</span></div>
                          </div>
                        </div>
                        <button onClick={() => loadMonitoring(j.id_jadwal)} className="w-full bg-primary text-on-primary py-sm px-md rounded-lg font-label-md text-label-md hover:bg-on-primary-fixed-variant transition-colors flex justify-center items-center gap-2 shadow-sm">
                          <span className="material-symbols-outlined text-[18px]">visibility</span> Monitor Kelas
                        </button>
                      </div>
                    ))}
                    {jadwalAktif.length === 0 && (
                      <div className="col-span-full py-12 text-center text-on-surface-variant">Tidak ada jadwal ujian aktif saat ini.</div>
                    )}
                  </div>
                )}
              </>
            ) : (
              /* Area Monitoring Real-time */
              <>
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-sm mb-lg">
                  <div>
                    <h1 className="font-headline-lg text-headline-lg text-on-surface">Live Monitoring</h1>
                    <p className="font-body-md text-body-md text-on-surface-variant mt-1">Sesi: {selectedJadwal}</p>
                  </div>
                  <div className="flex gap-sm">
                    <button onClick={() => setSelectedJadwal(null)} className="bg-surface-container-lowest border border-outline-variant text-on-surface py-sm px-md rounded-lg font-label-md text-label-md hover:bg-surface-container-low transition-colors flex items-center gap-2">
                      <span className="material-symbols-outlined text-[18px]">arrow_back</span> Kembali
                    </button>
                    <button onClick={() => loadMonitoring(selectedJadwal)} className="bg-primary-container text-on-primary-container py-sm px-md rounded-lg font-label-md text-label-md hover:bg-primary-fixed-dim transition-colors flex items-center gap-2">
                      <span className="material-symbols-outlined text-[18px]">refresh</span> Refresh
                    </button>
                  </div>
                </div>

                {/* Token Card */}
                <div className="bg-primary text-on-primary rounded-xl p-lg md:p-xl shadow-[0_8px_16px_rgba(0,63,177,0.15)] relative overflow-hidden flex flex-col md:flex-row items-center justify-between gap-lg mb-gutter">
                  <div className="absolute -right-20 -top-20 w-64 h-64 bg-white opacity-5 rounded-full blur-3xl pointer-events-none"></div>
                  <div className="flex flex-col gap-xs z-10 w-full md:w-auto text-center md:text-left">
                    <h2 className="font-headline-sm text-headline-sm text-primary-fixed-dim">Token Ujian Aktif</h2>
                    <div className="font-mono-label text-[48px] md:text-[64px] font-bold tracking-widest leading-none mt-2">
                      {token}
                    </div>
                  </div>
                  <div className="w-full md:w-1/3 flex flex-col gap-sm z-10 bg-primary-fixed-dim/20 p-md rounded-lg backdrop-blur-sm border border-primary-fixed-dim/30">
                    <div className="flex justify-between mt-1">
                      <p className="text-on-primary text-[12px] opacity-80">Token ini di-refresh secara otomatis.</p>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-gutter">
                  {/* Left Column: Live Table */}
                  <div className="col-span-1 lg:col-span-8 bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm flex flex-col overflow-hidden">
                    <div className="p-md border-b border-outline-variant flex justify-between items-center bg-surface-container-low">
                      <h3 className="font-headline-sm text-headline-sm text-on-surface flex items-center gap-2">
                        <span className="material-symbols-outlined text-secondary">group</span> Status Peserta
                      </h3>
                    </div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-left font-body-md text-body-md">
                        <thead className="bg-surface-container text-on-surface-variant font-label-md text-label-md border-b border-outline-variant">
                          <tr>
                            <th className="py-3 px-md font-semibold">Peserta</th>
                            <th className="py-3 px-md font-semibold text-center">Status & Pelanggaran</th>
                            <th className="py-3 px-md font-semibold text-center">Skor (Auto / Uraian)</th>
                            <th className="py-3 px-md font-semibold text-right">Aksi</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-outline-variant">
                          {isLoading ? <tr><td colSpan="4" className="py-12"><Loader text="Menarik data..." /></td></tr> :
                           monitoringData.length > 0 ? monitoringData.map(siswa => (
                             <tr key={siswa.id_siswa} className={`hover:bg-surface-container-low transition-colors group ${siswa.is_blocked ? 'bg-error-container/10' : ''}`}>
                               <td className="py-sm px-md flex items-center gap-3">
                                 <div className={`w-8 h-8 rounded-full flex items-center justify-center font-label-md text-label-md font-bold ${siswa.is_blocked ? 'bg-error-container text-error' : 'bg-secondary-container text-on-secondary-container'}`}>
                                   {siswa.nama_lengkap.substring(0, 2).toUpperCase()}
                                 </div>
                                 <div className="flex flex-col">
                                   <span className={`font-semibold ${siswa.is_blocked ? 'text-error' : 'text-on-surface'}`}>{siswa.nama_lengkap}</span>
                                   <span className="text-[12px] text-on-surface-variant">{siswa.id_siswa}</span>
                                 </div>
                               </td>
                               <td className="py-sm px-md text-center">
                                  <span className={`inline-flex items-center gap-1.5 py-1 px-2.5 rounded-full text-[12px] font-semibold mb-1 ${
                                    siswa.is_blocked ? 'bg-error-container text-error border border-error/20' :
                                    siswa.status_ujian === 'SELESAI' ? 'bg-surface-variant text-on-surface-variant border border-outline-variant' :
                                    siswa.status_ujian === 'SEDANG KERJA' ? 'bg-[#e6f4ea] text-[#137333] border border-[#137333]/20' :
                                    'bg-surface-container-high text-on-surface-variant border border-outline-variant'
                                  }`}>
                                    {siswa.is_blocked ? 'TERBLOKIR' : siswa.status_ujian}
                                  </span>
                                  {siswa.pelanggaran > 0 && (
                                    <div className="text-[12px] text-error flex items-center justify-center gap-1">
                                      <span className="material-symbols-outlined text-[14px]">warning</span>
                                      {siswa.pelanggaran} / 3 Pelanggaran
                                    </div>
                                  )}
                               </td>
                               <td className="py-sm px-md text-center">
                                 <div className="font-mono-label text-on-surface font-bold text-lg">{siswa.nilai_auto || '-'} <span className="text-on-surface-variant text-sm">/ {siswa.nilai_uraian || '-'}</span></div>
                               </td>
                               <td className="py-sm px-md text-right space-x-2">
                                 {siswa.is_blocked && siswa.id_log && (
                                    <button onClick={() => unblockAkun(siswa.id_log)} className="bg-error text-on-error py-1 px-3 rounded text-sm font-bold shadow-sm hover:opacity-90">Buka Blokir</button>
                                 )}
                                 {siswa.status_ujian === 'SELESAI' && (
                                    <button onClick={() => setGradingModal({ isOpen: true, siswa, nilaiInput: siswa.nilai_uraian || '' })} className="bg-primary-container text-on-primary-container py-1 px-3 rounded text-sm font-bold shadow-sm hover:opacity-90 border border-primary-fixed-dim">Nilai Uraian</button>
                                 )}
                               </td>
                             </tr>
                           )) : (
                             <tr>
                               <td colSpan="4" className="py-8 text-center text-on-surface-variant">Belum ada data monitoring.</td>
                             </tr>
                           )
                          }
                        </tbody>
                      </table>
                    </div>
                  </div>

                  {/* Right Column: Stats */}
                  <div className="col-span-1 lg:col-span-4 flex flex-col gap-gutter">
                    <div className="grid grid-cols-2 gap-sm">
                      <div className="bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col gap-xs shadow-sm">
                        <div className="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center mb-1">
                          <span className="material-symbols-outlined text-secondary text-[18px]">group</span>
                        </div>
                        <span className="font-label-md text-label-md text-on-surface-variant">Total Peserta Sesi</span>
                        <div className="flex items-baseline gap-1">
                          <span className="font-headline-lg text-headline-lg text-on-surface">{monitoringData.length}</span>
                        </div>
                      </div>
                      <div className="bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col gap-xs shadow-sm">
                        <div className="w-8 h-8 rounded-full bg-[#e6f4ea] flex items-center justify-center mb-1">
                          <span className="material-symbols-outlined text-[#137333] text-[18px]">task_alt</span>
                        </div>
                        <span className="font-label-md text-label-md text-on-surface-variant">Telah Selesai</span>
                        <div className="flex items-baseline gap-1">
                          <span className="font-headline-lg text-headline-lg text-[#137333]">{monitoringData.filter(s => s.status_ujian === 'SELESAI').length}</span>
                        </div>
                      </div>
                    </div>
                    {monitoringData.some(s => s.is_blocked) && (
                      <div className="bg-error-container/20 border border-error-container rounded-xl p-md flex flex-col gap-sm shadow-sm relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-1 h-full bg-error"></div>
                        <div className="flex items-center gap-2 text-error">
                          <span className="material-symbols-outlined">warning</span>
                          <h4 className="font-headline-sm text-headline-sm">Peringatan Sistem</h4>
                        </div>
                        <p className="font-body-md text-body-md text-on-surface-variant">
                          Terdapat <strong className="text-error">{monitoringData.filter(s => s.is_blocked).length} siswa</strong> yang terblokir karena terindikasi curang atau keluar ujian.
                        </p>
                      </div>
                    )}
                  </div>
                </div>
              </>
            )}
          </main>

          {/* Modal Penilaian Uraian */}
          <Modal isOpen={gradingModal.isOpen} title={`Penilaian Uraian - ${gradingModal.siswa?.nama_lengkap}`} type="info" onClose={() => setGradingModal({ isOpen: false, siswa: null })}>
            <div className="mt-4 text-left">
              <label className="block font-label-md text-label-md text-on-surface mb-2">Input Total Nilai Uraian (Angka):</label>
              <input
                type="number"
                className="w-full pl-md pr-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all mb-4"
                value={gradingModal.nilaiInput}
                onChange={(e) => setGradingModal({ ...gradingModal, nilaiInput: e.target.value })}
                placeholder="Contoh: 85"
              />
              <button onClick={submitNilaiUraian} className="w-full bg-primary text-on-primary py-sm px-md rounded-lg font-label-md text-label-md hover:bg-on-primary-fixed-variant transition-colors shadow-sm">
                Simpan Nilai
              </button>
            </div>
          </Modal>
        </div>
      );
    };

    // ==========================================
    // VIEW: RUANG UJIAN (EKSEKUSI SOAL & ANTI-CHEAT)
    // ==========================================
    const ExamRoom = ({ user, jadwal, idLog, showMessage, onFinish }) => {
      const [soal, setSoal] = useState([]);
      const [jawabanSiswa, setJawabanSiswa] = useState({});
      const [raguRagu, setRaguRagu] = useState({});
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isLoading, setIsLoading] = useState(true);
      const [violationCount, setViolationCount] = useState(0);
      const [isBlocked, setIsBlocked] = useState(false);

      const [timeLeft, setTimeLeft] = useState({ total: 1, hours: 0, minutes: 0, seconds: 0 });
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [confirmModal, setConfirmModal] = useState({ isOpen: false });

      const examContainerRef = useRef(null);

      useEffect(() => {
        fetchSoal();
        setupAntiCheat();

        const timerInterval = setInterval(() => {
          const remaining = calculateTimeLeft(jadwal.waktu_selesai);
          setTimeLeft(remaining);

          if (remaining.total <= 0 && !isSubmitting && !isBlocked) {
            clearInterval(timerInterval);
            showMessage('Waktu Habis!', 'Waktu ujian telah berakhir. Sistem mengumpulkan jawaban otomatis.', 'warning');
            executeSubmitExam(true);
          }
        }, 1000);

        return () => {
          clearInterval(timerInterval);
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          document.removeEventListener('fullscreenchange', handleFullscreenChange);
        };
      }, []);

      const fetchSoal = async () => {
        const res = await fetchAPI('get_soal_ujian', { id_jadwal: jadwal.id_jadwal });
        if (res.status === 'success') {
          const parsedSoal = res.data.map(s => {
            let parsedOpsi = [];
            try { parsedOpsi = s.opsi ? JSON.parse(s.opsi) : []; } catch (e) { parsedOpsi = [s.opsi]; }
            return { ...s, opsi: parsedOpsi };
          });
          setSoal(parsedSoal);
        }
        setIsLoading(false);
      };

      const reportViolation = async () => {
        if (isBlocked || isSubmitting) return;

        const res = await fetchAPI('catat_pelanggaran', { id_log: idLog });
        if (res.status === 'success') {
          setViolationCount(res.pelanggaran_saat_ini);
          if (res.terblokir) {
            setIsBlocked(true);
            if (document.fullscreenElement) document.exitFullscreen().catch(() => { });
            showMessage('TERBLOKIR!', 'Akun Anda diblokir karena meninggalkan halaman ujian lebih dari 3 kali. Hubungi pengawas.', 'error');
            setTimeout(onFinish, 5000);
          } else {
            showMessage('Peringatan Keamanan!', `Sistem mendeteksi Anda keluar dari halaman ujian! Ini pelanggaran ke-${res.pelanggaran_saat_ini} dari maksimal 3.`, 'warning');
          }
        }
      };

      const handleVisibilityChange = () => { if (document.hidden) reportViolation(); };
      const handleFullscreenChange = () => { if (!document.fullscreenElement && !isSubmitting && !isBlocked) reportViolation(); };

      const setupAntiCheat = () => {
        document.addEventListener('visibilitychange', handleVisibilityChange);
        document.addEventListener('fullscreenchange', handleFullscreenChange);
      };

      const enforceFullscreen = () => {
        if (!isBlocked && document.documentElement.requestFullscreen && !document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => { });
        }
      };

      const handleAnswerChange = (soalId, value, tipe) => {
        setJawabanSiswa(prev => {
          if (tipe === 'PGK') {
            let arr = Array.isArray(prev[soalId]) ? [...prev[soalId]] : [];
            if (arr.includes(value)) arr = arr.filter(item => item !== value);
            else arr.push(value);
            return { ...prev, [soalId]: arr };
          }
          return { ...prev, [soalId]: value };
        });
      };

      const toggleRaguRagu = (soalId) => {
        setRaguRagu(prev => ({ ...prev, [soalId]: !prev[soalId] }));
      };

      const requestSubmit = () => {
        setConfirmModal({ isOpen: true });
      };

      const executeSubmitExam = async (isAuto = false) => {
        setConfirmModal({ isOpen: false });
        if (isSubmitting) return;

        setIsSubmitting(true);
        setIsLoading(true);

        const formattedJawaban = Object.keys(jawabanSiswa).map(key => ({
          id_soal: key,
          jawaban: jawabanSiswa[key]
        }));

        const res = await fetchAPI('submit_ujian', {
          id_log: idLog,
          id_jadwal: jadwal.id_jadwal,
          id_siswa: user.id_user,
          jawaban: formattedJawaban
        });

        if (document.fullscreenElement) document.exitFullscreen().catch(() => { });

        if (res.status === 'success') {
          showMessage('Ujian Selesai', `Terima kasih! Skor pilihan ganda/objektif Anda: ${res.nilai_objektif}. Soal uraian dinilai terpisah oleh guru.`, 'success');
          setTimeout(onFinish, 4000);
        } else {
          showMessage('Gagal Mengumpulkan', res.message, 'error');
          setIsLoading(false);
          setIsSubmitting(false);
        }
      };

      const renderQuestionInput = (s) => {
        const currentAns = jawabanSiswa[s.id_soal] || '';

        switch (s.tipe_soal) {
          case 'PG':
          case 'BS':
            return s.opsi.map((op, idx) => (
              <label key={idx} className={`flex items-center p-md border rounded-lg cursor-pointer transition-colors ${currentAns === op ? 'border-2 border-primary bg-primary-fixed shadow-[0_4px_8px_rgba(0,0,0,0.05)]' : 'border-outline-variant hover:bg-surface-container-low bg-surface-container-lowest'}`}>
                <input type="radio" name={s.id_soal} value={op} checked={currentAns === op} onChange={() => handleAnswerChange(s.id_soal, op, s.tipe_soal)} className={`form-radio h-5 w-5 ${currentAns === op ? 'text-primary border-primary' : 'text-primary border-outline-variant'} focus:ring-primary focus:ring-offset-0`} />
                <span className="ml-md font-body-lg text-body-lg text-on-surface flex-1">
                  <span className="font-bold mr-sm">{String.fromCharCode(65 + idx)}.</span> {op}
                </span>
              </label>
            ));

          case 'PGK':
            return s.opsi.map((op, idx) => {
              const isChecked = currentAns.includes && currentAns.includes(op);
              return (
                <label key={idx} className={`flex items-center p-md border rounded-lg cursor-pointer transition-colors ${isChecked ? 'border-2 border-primary bg-primary-fixed shadow-[0_4px_8px_rgba(0,0,0,0.05)]' : 'border-outline-variant hover:bg-surface-container-low bg-surface-container-lowest'}`}>
                  <input type="checkbox" value={op} checked={isChecked} onChange={() => handleAnswerChange(s.id_soal, op, s.tipe_soal)} className={`form-checkbox rounded h-5 w-5 ${isChecked ? 'text-primary border-primary' : 'text-primary border-outline-variant'} focus:ring-primary focus:ring-offset-0`} />
                  <span className="ml-md font-body-lg text-body-lg text-on-surface flex-1">
                    <span className="font-bold mr-sm">{String.fromCharCode(65 + idx)}.</span> {op}
                  </span>
                </label>
              );
            });

          case 'JODOH':
            return (
              <div className="bg-secondary-container p-md rounded-lg border border-outline-variant">
                <p className="text-on-secondary-container font-label-md text-label-md mb-sm flex items-center gap-2"><span className="material-symbols-outlined text-[18px]">link</span> Ketikkan pasangan yang tepat sesuai urutan instruksi di soal.</p>
                <textarea rows="3" placeholder="Contoh: 1-A, 2-C, 3-B" value={currentAns} onChange={(e) => handleAnswerChange(s.id_soal, e.target.value, s.tipe_soal)} className="w-full pl-md pr-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"></textarea>
              </div>
            );

          case 'ISIAN':
          case 'URAIAN':
            return (
              <textarea rows={s.tipe_soal === 'URAIAN' ? 8 : 2} placeholder="Ketik jawaban Anda di sini..." value={currentAns} onChange={(e) => handleAnswerChange(s.id_soal, e.target.value, s.tipe_soal)} className="w-full pl-md pr-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"></textarea>
            );

          default: return <p className="text-error font-bold p-sm bg-error-container/20 rounded">⚠️ Tipe soal tidak didukung.</p>;
        }
      };

      if (isLoading) return <div className="min-h-screen bg-background flex flex-col items-center justify-center"><Loader text="Menyiapkan Soal dan Enkripsi Sesi..." /></div>;
      if (isBlocked) return (
        <div className="min-h-screen bg-error flex flex-col items-center justify-center space-y-4">
          <span className="material-symbols-outlined text-[80px] text-on-error">block</span>
          <h1 className="text-on-error font-headline-lg text-headline-lg font-bold">AKUN DIBLOKIR</h1>
          <p className="text-on-error font-body-lg text-body-lg">Sistem mendeteksi kecurangan. Hubungi pengawas untuk membuka akses.</p>
        </div>
      );

      const currentS = soal[currentIndex];

      const answeredCount = soal.filter(s => {
          const ans = jawabanSiswa[s.id_soal];
          return ans && (Array.isArray(ans) ? ans.length > 0 : String(ans).trim() !== '');
      }).length;
      const flaggedCount = Object.values(raguRagu).filter(Boolean).length;
      const unansweredCount = soal.length - answeredCount;

      return (
        <div className="font-body-md text-body-md text-on-background bg-background h-screen flex flex-col overflow-hidden select-none" ref={examContainerRef} onClick={enforceFullscreen}>
          {/* TopNavBar */}
          <header className="fixed top-0 w-full z-50 flex justify-between items-center px-lg h-20 bg-primary shadow-md">
            <div className="flex items-center gap-md">
              <img alt="NEXA Logo" className="h-10 w-auto object-contain hidden md:block" src="https://lh3.googleusercontent.com/aida/AEtjO1VVZfSUCXhHzY1X0SeCMcnnfH7eVLHQqeKZRoS92h6LX1juBz1mnHDbVWx1-Ba6QJacojgIbeoyE3UGy8T6Tb1_zTR54w2rmJiBCsvoFvsirZvz0_Sze5GuvCCAGNsKINOED0RXdkwpJDJinvxgu4KYdM823w67kkw4wzY5RntMk58ZhF_-cEiEvWXFYy34ycs42ktHbpwy_GH_ydOPW5eO4S5k_plk9debDcu5KRZwhT3Qv_0W8MX-"/>
              <div className="font-headline-sm text-headline-sm text-on-primary font-bold md:hidden">NEXA</div>
            </div>
            <div className="flex items-center gap-md md:gap-xl text-on-primary">
              <div className="flex flex-col items-end hidden sm:flex">
                <span className="font-label-md text-label-md text-primary-fixed-dim">{user.nama_lengkap}</span>
                <span className="font-label-md text-label-md text-primary-fixed-dim">ID: {user.id_user}</span>
              </div>
              <div className="h-8 w-px bg-primary-fixed-dim opacity-50 hidden sm:block"></div>
              <div className="font-body-lg text-body-lg text-on-primary font-semibold hidden md:block max-w-[200px] truncate">{jadwal.nama_mapel}</div>
              <div className="h-8 w-px bg-primary-fixed-dim opacity-50 hidden md:block"></div>
              <div className={`font-headline-sm text-headline-sm ${timeLeft.total < 300000 ? 'text-error-container animate-pulse' : 'text-on-primary'} font-bold flex items-center gap-xs`}>
                <span className="material-symbols-outlined" style={{fontVariationSettings: "'FILL' 1"}}>timer</span>
                {String(timeLeft.hours).padStart(2, '0')}:{String(timeLeft.minutes).padStart(2, '0')}:{String(timeLeft.seconds).padStart(2, '0')}
              </div>
              <button onClick={requestSubmit} className="font-label-md text-label-md text-on-primary font-bold hover:opacity-90 active:scale-95 transition-transform ml-sm md:ml-md bg-error text-on-error px-md py-sm rounded">Selesai</button>
            </div>
          </header>
          
          <div className="flex flex-1 pt-20 h-full">
            {/* SideNavBar */}
            <aside className="hidden md:flex fixed left-0 mt-20 w-80 h-[calc(100vh-80px)] border-r border-outline-variant bg-surface flex-col p-md overflow-y-auto sidebar-scroll z-40">
              <div className="mb-md">
                <h2 className="font-label-md text-label-md text-on-surface font-bold">Navigasi Soal</h2>
                <p className="font-label-md text-label-md text-on-surface-variant font-normal">Klik nomor untuk pindah soal</p>
                {violationCount > 0 && (
                   <p className="font-label-md text-label-md text-error mt-2 font-bold flex items-center gap-1">
                      <span className="material-symbols-outlined text-[16px]">warning</span> Pelanggaran: {violationCount} / 3
                   </p>
                )}
              </div>
              <div className="grid grid-cols-6 gap-sm mb-lg">
                {soal.map((s, idx) => {
                  const ans = jawabanSiswa[s.id_soal];
                  const hasAnswered = !!ans && (Array.isArray(ans) ? ans.length > 0 : String(ans).trim() !== '');
                  const isFlagged = raguRagu[s.id_soal];
                  
                  let btnClass = "w-10 h-10 rounded-sm font-mono-label text-mono-label flex items-center justify-center cursor-pointer transition-all ";
                  
                  if (currentIndex === idx) {
                    btnClass += "bg-primary text-on-primary ring-2 ring-primary ring-offset-2";
                  } else if (isFlagged) {
                    btnClass += "bg-[#D97706] text-white"; // flagged color
                  } else if (hasAnswered) {
                    btnClass += "bg-[#10B981] text-white"; // answered color
                  } else {
                    btnClass += "border border-outline-variant text-on-surface hover:border-primary hover:text-primary";
                  }
                  
                  return (
                    <button key={s.id_soal} onClick={() => setCurrentIndex(idx)} className={btnClass}>
                      {idx + 1}
                    </button>
                  );
                })}
              </div>
              <div className="mt-auto pt-md border-t border-outline-variant">
                <div className="flex items-center gap-sm mb-xs">
                  <div className="w-4 h-4 bg-[#10B981] rounded-sm"></div>
                  <span className="font-label-md text-label-md text-on-surface-variant">Terjawab ({answeredCount})</span>
                </div>
                <div className="flex items-center gap-sm mb-xs">
                  <div className="w-4 h-4 bg-[#D97706] rounded-sm"></div>
                  <span className="font-label-md text-label-md text-on-surface-variant">Ragu-ragu ({flaggedCount})</span>
                </div>
                <div className="flex items-center gap-sm mb-xs">
                  <div className="w-4 h-4 border border-outline-variant rounded-sm bg-white"></div>
                  <span className="font-label-md text-label-md text-on-surface-variant">Belum Dijawab ({unansweredCount})</span>
                </div>
                <div className="flex items-center gap-sm">
                  <div className="w-4 h-4 bg-primary rounded-sm ring-1 ring-primary ring-offset-1"></div>
                  <span className="font-label-md text-label-md text-on-surface-variant">Posisi Saat Ini</span>
                </div>
              </div>
            </aside>

            {/* Main Content (Canvas) */}
            <main className="flex-1 md:ml-80 flex flex-col bg-background relative overflow-y-auto pb-24">
              <div className="max-w-[1200px] mx-auto w-full p-md md:p-xl mt-sm md:mt-lg">
                {currentS ? (
                  <div className="bg-surface-container-lowest border-2 border-primary rounded-lg p-md md:p-xl shadow-sm mb-xl">
                    <div className="flex justify-between items-center mb-md pb-md border-b border-outline-variant">
                      <span className="font-headline-md text-headline-md text-on-surface">Soal No. {currentIndex + 1}</span>
                      <div className="flex items-center gap-sm bg-surface-container py-xs px-sm rounded-full">
                        <span className="material-symbols-outlined text-secondary" style={{fontSize: "16px"}}>category</span>
                        <span className="font-label-md text-label-md text-secondary uppercase">{currentS.tipe_soal}</span>
                      </div>
                    </div>
                    <div className="font-question-text text-question-text text-on-surface mb-xl whitespace-pre-wrap">
                      {currentS.pertanyaan}
                    </div>
                    {/* Options */}
                    <div className="space-y-sm">
                      {renderQuestionInput(currentS)}
                    </div>
                  </div>
                ) : (
                  <div className="text-center text-on-surface-variant py-20 font-bold text-xl">Tidak ada soal yang tersedia.</div>
                )}
              </div>
              
              {/* Bottom Action Bar */}
              {currentS && (
                <div className="fixed bottom-0 md:left-80 left-0 right-0 h-20 bg-surface-container-lowest border-t border-outline-variant px-md md:px-xl flex items-center justify-between shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-40">
                  <button 
                    onClick={() => setCurrentIndex(Math.max(0, currentIndex - 1))}
                    disabled={currentIndex === 0}
                    className="flex items-center gap-xs px-md md:px-lg py-sm border-2 border-primary text-primary font-body-md text-body-md font-semibold rounded hover:bg-primary-fixed transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    <span className="material-symbols-outlined">arrow_back</span>
                    <span className="hidden sm:inline">Sebelumnya</span>
                  </button>
                  <div className="flex items-center gap-md md:gap-lg">
                    <label className="flex items-center cursor-pointer gap-sm group">
                      <div className="relative flex items-center justify-center w-6 h-6 border-2 border-outline-variant rounded group-hover:border-[#D97706] transition-colors">
                        <input type="checkbox" checked={raguRagu[currentS.id_soal] || false} onChange={() => toggleRaguRagu(currentS.id_soal)} className="absolute opacity-0 w-full h-full cursor-pointer peer"/>
                        <span className="material-symbols-outlined text-[#D97706] opacity-0 peer-checked:opacity-100 transition-opacity" style={{fontSize: "20px", fontVariationSettings: "'FILL' 1"}}>check</span>
                      </div>
                      <span className="font-body-md text-body-md text-on-surface group-hover:text-[#D97706] transition-colors hidden sm:inline">Tandai Ragu-ragu</span>
                    </label>
                    <button 
                      onClick={() => setCurrentIndex(Math.min(soal.length - 1, currentIndex + 1))}
                      disabled={currentIndex === soal.length - 1}
                      className="flex items-center gap-xs px-md md:px-lg py-sm bg-primary text-on-primary font-body-md text-body-md font-semibold rounded hover:bg-on-primary-fixed-variant transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                      <span className="hidden sm:inline">Selanjutnya</span>
                      <span className="material-symbols-outlined">arrow_forward</span>
                    </button>
                  </div>
                </div>
              )}
            </main>
          </div>

          <Modal
            isOpen={confirmModal.isOpen}
            title="Konfirmasi Pengumpulan"
            message={`Anda telah menjawab ${answeredCount} dari ${soal.length} soal. Yakin ingin mengumpulkan ujian sekarang? Waktu Anda masih tersisa. Anda tidak bisa kembali setelah menekan tombol Kumpulkan.`}
            type="warning"
            onClose={() => setConfirmModal({ isOpen: false })}
            onConfirm={() => executeSubmitExam(false)}
            confirmText="Ya, Kumpulkan"
          />
        </div>
      );
    };

    // ==========================================
    // VIEW: SISWA (DASHBOARD)
    // ==========================================
    const SiswaView = ({ user, onLogout, showMessage }) => {
      const [jadwal, setJadwal] = useState([]);
      const [isLoading, setIsLoading] = useState(false);
      const [activeExamData, setActiveExamData] = useState(null);
      const [inputToken, setInputToken] = useState('');
      const [selectedJadwalUntukToken, setSelectedJadwalUntukToken] = useState(null);

      useEffect(() => { loadJadwal(); }, []);

      const loadJadwal = async () => {
        setIsLoading(true);
        const res = await fetchAPI('get_jadwal', { id_siswa: user.id_user });
        if (res.status === 'success') setJadwal(res.data);
        setIsLoading(false);
      };

      const handleMulaiUjian = async (j) => {
        if (!inputToken) {
          showMessage('Perhatian', 'Harap masukkan 6 digit token dari pengawas.', 'warning');
          return;
        }

        setIsLoading(true);
        const res = await fetchAPI('mulai_ujian', {
          id_jadwal: j.id_jadwal,
          id_siswa: user.id_user,
          token: inputToken.toUpperCase()
        });
        setIsLoading(false);

        if (res.status === 'success') {
          setActiveExamData({ jadwal: j, idLog: res.id_log });
        } else {
          showMessage('Akses Ditolak', res.message, 'error');
        }
      };

      if (activeExamData) {
        return (
          <ExamRoom
            user={user}
            jadwal={activeExamData.jadwal}
            idLog={activeExamData.idLog}
            showMessage={showMessage}
            onFinish={() => {
              setActiveExamData(null);
              setSelectedJadwalUntukToken(null);
              setInputToken('');
              loadJadwal();
            }}
          />
        );
      }

      return (
        <div className="bg-background text-on-background min-h-screen font-body-md text-body-md antialiased selection:bg-primary-container selection:text-on-primary-container flex flex-col">
          {/* TopNavBar */}
          <nav className="bg-surface fixed top-0 w-full z-50 flex justify-between items-center px-lg h-16 border-b border-outline-variant">
            <div className="flex items-center gap-xl">
              <div className="flex items-center h-8">
                  <img src="https://lh3.googleusercontent.com/aida/AEtjO1VVZfSUCXhHzY1X0SeCMcnnfH7eVLHQqeKZRoS92h6LX1juBz1mnHDbVWx1-Ba6QJacojgIbeoyE3UGy8T6Tb1_zTR54w2rmJiBCsvoFvsirZvz0_Sze5GuvCCAGNsKINOED0RXdkwpJDJinvxgu4KYdM823w67kkw4wzY5RntMk58ZhF_-cEiEvWXFYy34ycs42ktHbpwy_GH_ydOPW5eO4S5k_plk9debDcu5KRZwhT3Qv_0W8MX-" alt="NEXA Logo" className="h-full w-auto object-contain" />
              </div>
              <div className="hidden md:flex items-center h-full gap-lg">
                <a className="h-16 flex items-center text-primary font-bold border-b-2 border-primary font-label-md text-label-md" href="#">Portal Ujian Siswa</a>
              </div>
            </div>
            <div className="flex items-center gap-md">
              <div className="ml-sm flex items-center gap-sm cursor-pointer">
                <div className="flex flex-col items-end">
                  <span className="text-sm font-bold text-slate-700 hidden sm:block">{user.nama_lengkap}</span>
                  <span className="text-[10px] text-slate-500 hidden sm:block uppercase font-bold tracking-wider">{user.id_user}</span>
                </div>
              </div>
              <button onClick={onLogout} className="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-error-container/20 hover:text-error transition-colors cursor-pointer active:opacity-80 transition-all" title="Logout">
                <span className="material-symbols-outlined">logout</span>
              </button>
            </div>
          </nav>

          {/* Main Content Canvas */}
          <main className="pt-[96px] px-md md:px-lg max-w-container-max mx-auto space-y-gutter pb-xl flex-1 w-full">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-sm mb-lg">
              <div>
                <h1 className="font-headline-lg text-headline-lg text-on-surface flex items-center gap-2">
                  <span className="material-symbols-outlined text-primary text-[32px]">menu_book</span> Daftar Ujian Tersedia
                </h1>
                <p className="font-body-md text-body-md text-on-surface-variant mt-1">Pilih jadwal ujian dan masukkan token dari pengawas untuk memulai.</p>
              </div>
              <div className="flex gap-sm">
                <button onClick={loadJadwal} className="bg-primary text-on-primary py-sm px-md rounded-lg font-label-md text-label-md hover:bg-on-primary-fixed-variant transition-colors flex items-center gap-2">
                  <span className="material-symbols-outlined text-[18px]">refresh</span> Refresh Jadwal
                </button>
              </div>
            </div>

            {isLoading ? <Loader text="Menyinkronkan jadwal..." /> : (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {jadwal.map(j => (
                  <div key={j.id_jadwal} className="bg-surface-container-lowest border border-outline-variant rounded-xl p-6 shadow-sm hover:shadow-md transition-shadow flex flex-col relative overflow-hidden">
                    <div className={`absolute top-0 left-0 w-full h-1 ${j.status_siswa === 'SELESAI' ? 'bg-[#10B981]' : j.status_siswa === 'SEDANG KERJA' ? 'bg-[#D97706]' : 'bg-primary'}`}></div>

                    <h3 className="font-headline-sm text-headline-sm text-on-surface mb-2 pt-2">{j.nama_mapel}</h3>
                    <div className="flex items-center gap-2 mb-4">
                      <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider ${j.status_siswa === 'SELESAI' ? 'bg-[#10B981]/10 text-[#10B981]' :
                          j.status_siswa === 'SEDANG KERJA' ? 'bg-[#D97706]/10 text-[#D97706]' :
                            'bg-surface-variant text-on-surface-variant'
                        }`}>
                        Status: {j.status_siswa}
                      </span>
                    </div>

                    <div className="font-body-md text-body-md text-on-surface-variant mb-6 space-y-2 bg-surface-container-low p-4 rounded-xl border border-outline-variant flex-1">
                      <div className="flex justify-between items-center border-b border-outline-variant pb-2">
                        <span className="font-medium flex items-center gap-1"><span className="material-symbols-outlined text-[16px]">schedule</span> Buka</span>
                        <span className="font-bold text-on-surface">{new Date(j.waktu_mulai).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                      </div>
                      <div className="flex justify-between items-center pt-1">
                        <span className="font-medium flex items-center gap-1"><span className="material-symbols-outlined text-[16px]">timer_off</span> Tutup</span>
                        <span className="font-bold text-error">{new Date(j.waktu_selesai).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                      </div>
                    </div>

                    {j.status_siswa !== 'SELESAI' ? (
                      selectedJadwalUntukToken === j.id_jadwal ? (
                        <div className="animate-fade-in-up bg-primary-fixed/30 p-4 rounded-xl border border-primary-fixed-dim">
                          <input
                            type="text"
                            placeholder="6 DIGIT TOKEN"
                            className="w-full text-center tracking-[0.3em] font-mono font-bold text-xl p-3 border border-primary/30 rounded-lg mb-3 focus:ring-2 focus:ring-primary outline-none uppercase bg-surface-container-lowest"
                            value={inputToken}
                            onChange={(e) => setInputToken(e.target.value)}
                            maxLength={6}
                          />
                          <div className="flex gap-2">
                            <button onClick={() => setSelectedJadwalUntukToken(null)} className="flex-1 py-2 bg-surface-container-lowest text-on-surface-variant rounded-lg font-label-md text-label-md hover:bg-surface-container-low border border-outline-variant transition-colors">Batal</button>
                            <button onClick={() => handleMulaiUjian(j)} className="flex-1 py-2 bg-primary text-on-primary rounded-lg font-label-md text-label-md hover:bg-on-primary-fixed-variant shadow-sm transition-transform active:scale-95">Masuk Ujian</button>
                          </div>
                        </div>
                      ) : (
                        <button
                          onClick={() => setSelectedJadwalUntukToken(j.id_jadwal)}
                          className={`w-full py-3 rounded-xl font-label-md text-label-md transition-all shadow-sm active:scale-95 border ${j.status_siswa === 'SEDANG KERJA' ? 'bg-[#D97706]/10 text-[#D97706] hover:bg-[#D97706]/20 border-[#D97706]/30' : 'bg-primary text-on-primary hover:bg-on-primary-fixed-variant border-transparent'
                            }`}
                        >
                          {j.status_siswa === 'SEDANG KERJA' ? 'LANJUTKAN UJIAN' : 'MULAI KERJAKAN'}
                        </button>
                      )
                    ) : (
                      <div className="w-full py-3 bg-surface-container text-on-surface-variant rounded-xl font-label-md text-label-md border border-outline-variant flex flex-col items-center">
                        <span>SUDAH DISELESAIKAN</span>
                        <span className="text-[12px] font-normal mt-1 text-on-surface font-bold">Skor Objektif: {j.nilai_auto || 0}</span>
                      </div>
                    )}
                  </div>
                ))}
                {jadwal.length === 0 && (
                  <div className="col-span-full py-12 text-center font-body-md text-on-surface-variant">Tidak ada jadwal ujian saat ini.</div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    };

    // ==========================================
    // ROOT APP & LOGIN
    // ==========================================
    const App = () => {
      const [user, setUser] = useState(null);
      const [isRegistering, setIsRegistering] = useState(false);
      const [loading, setLoading] = useState(false);

      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [rememberMe, setRememberMe] = useState(false);
      const [loginError, setLoginError] = useState('');
      const [loginSuccess, setLoginSuccess] = useState(false);

      const [modal, setModal] = useState({ isOpen: false, title: '', message: '', type: 'info' });

      const showMessage = (title, message, type) => {
        setModal({ isOpen: true, title, message, type });
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoading(true);
        setLoginError('');
        const res = await fetchAPI('login', { username, password });
        setLoading(false);

        if (res.status === 'success') {
          setLoginSuccess(true);
          setTimeout(() => {
            setUser(res.data);
            setLoginSuccess(false);
          }, 1000);
        } else {
          setLoginError(res.message || 'Username atau password yang Anda masukkan salah.');
        }
      };

      const handleLogout = () => {
        setUser(null);
        setUsername('');
        setPassword('');
        setRememberMe(false);
      };

      const renderView = () => {
        if (!user) {
          const onLoginSubmit = (e) => {
            e.preventDefault();
            handleLogin(e);
          };

          const onRegisterSubmit = (e) => {
            e.preventDefault();
            showMessage('Pendaftaran Ditutup', 'Silakan hubungi administrator sekolah untuk membuat akun baru.', 'warning');
          };

          const handleLupaPassword = (e) => {
            e.preventDefault();
            showMessage('Lupa Password?', 'Untuk mereset password, silakan hubungi Administrator Sekolah atau Wali Kelas Anda.', 'info');
          };

          const handleSyaratKetentuan = (e) => {
            e.preventDefault();
            showMessage('Syarat & Ketentuan', 'Dengan mendaftar dan menggunakan sistem NEXA CBT, Anda setuju untuk mematuhi tata tertib ujian, tidak melakukan kecurangan, dan menjaga kerahasiaan akun.', 'info');
          };

          return (
            <div className="min-h-screen flex items-center justify-center p-lg sm:p-xl md:p-gutter relative overflow-hidden bg-surface">
              {/* Decorative Background Elements */}
              <div className="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary-fixed rounded-full blur-[100px] opacity-60 pointer-events-none"></div>
              <div className="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-secondary-fixed rounded-full blur-[100px] opacity-60 pointer-events-none"></div>
              
              <div className="w-full max-w-[900px] bg-white/70 backdrop-blur-xl border border-white/50 rounded-2xl shadow-2xl overflow-hidden relative z-10 flex flex-col md:flex-row animate-fade-in-up">
                
                {/* Left Side: Illustration / Branding (Hidden on small screens) */}
                <div className="hidden md:flex md:w-1/2 bg-primary text-white p-xl flex-col justify-between relative overflow-hidden">
                  <div className="absolute inset-0 bg-gradient-to-br from-primary to-blue-900 opacity-90"></div>
                  <div className="absolute top-[-20%] right-[-20%] w-64 h-64 bg-white opacity-10 rounded-full blur-3xl"></div>
                  
                  <div className="relative z-10">
                    <h2 className="font-headline-lg text-white font-bold flex items-center gap-2 mb-4">
                      <img alt="NEXA Logo" className="w-10 h-10 object-contain rounded bg-white p-1" src="https://lh3.googleusercontent.com/aida/AEtjO1VVZfSUCXhHzY1X0SeCMcnnfH7eVLHQqeKZRoS92h6LX1juBz1mnHDbVWx1-Ba6QJacojgIbeoyE3UGy8T6Tb1_zTR54w2rmJiBCsvoFvsirZvz0_Sze5GuvCCAGNsKINOED0RXdkwpJDJinvxgu4KYdM823w67kkw4wzY5RntMk58ZhF_-cEiEvWXFYy34ycs42ktHbpwy_GH_ydOPW5eO4S5k_plk9debDcu5KRZwhT3Qv_0W8MX-" />
                      NEXA
                    </h2>
                    <p className="font-body-lg text-primary-fixed-dim">Platform Ujian Berbasis Komputer Modern untuk Sekolah.</p>
                  </div>
                  
                  <div className="relative z-10">
                    <div className="bg-white/10 backdrop-blur-sm p-4 rounded-xl border border-white/20 hover:bg-white/20 transition-colors">
                      <p className="font-body-md text-white">"Pendidikan adalah senjata paling mematikan di dunia, karena dengan pendidikan, Anda dapat mengubah dunia."</p>
                      <p className="font-label-md text-primary-fixed-dim mt-2">- Nelson Mandela</p>
                    </div>
                  </div>
                </div>

                {/* Right Side: Forms */}
                <div className="w-full md:w-1/2 overflow-hidden relative bg-white/50">
                  <div className={`form-slider ${isRegistering ? 'show-register' : ''}`}>
                    {/* MASUK FORM PANE */}
                    <div className="form-pane p-lg sm:p-xl flex flex-col justify-center min-h-full">
                      <div className="mb-lg md:hidden">
                        <h2 className="font-headline-md text-on-surface flex items-center gap-xs">
                          <img alt="NEXA Logo" className="w-8 h-8 object-contain rounded" src="https://lh3.googleusercontent.com/aida/AEtjO1VVZfSUCXhHzY1X0SeCMcnnfH7eVLHQqeKZRoS92h6LX1juBz1mnHDbVWx1-Ba6QJacojgIbeoyE3UGy8T6Tb1_zTR54w2rmJiBCsvoFvsirZvz0_Sze5GuvCCAGNsKINOED0RXdkwpJDJinvxgu4KYdM823w67kkw4wzY5RntMk58ZhF_-cEiEvWXFYy34ycs42ktHbpwy_GH_ydOPW5eO4S5k_plk9debDcu5KRZwhT3Qv_0W8MX-" />
                          NEXA
                        </h2>
                        <p className="font-body-md text-on-surface-variant mt-xs">Silakan masuk ke akun Anda.</p>
                      </div>
                      
                      <div className="hidden md:block mb-lg">
                        <h2 className="font-headline-md text-on-surface font-bold">Selamat Datang</h2>
                        <p className="font-body-md text-on-surface-variant mt-1">Masukkan kredensial Anda untuk mengakses sistem.</p>
                      </div>

                      <form onSubmit={onLoginSubmit} className="flex flex-col gap-md">
                        {/* Segmented Control */}
                        <div className="flex bg-surface-container p-1 rounded-lg relative isolation-auto z-0 mb-xs shadow-inner">
                          {['siswa', 'guru', 'admin'].map((r) => (
                            <label key={r} className="flex-1 cursor-pointer relative">
                              <input defaultChecked={r === 'siswa'} className="peer sr-only" name="login-role" type="radio" value={r} />
                              <div className="w-full text-center py-2 rounded-md text-on-surface-variant font-label-md transition-all duration-300 peer-checked:text-primary z-10 relative capitalize">
                                {r}
                              </div>
