                              <div className="absolute inset-0 bg-white rounded-md shadow-sm transform scale-90 opacity-0 peer-checked:opacity-100 peer-checked:scale-100 transition-all duration-300 -z-10"></div>
                            </label>
                          ))}
                        </div>
                        
                        {loginError && (
                          <div className="bg-error-container text-error px-4 py-3 rounded-lg text-sm font-medium flex items-center gap-2 animate-fade-in-up border border-error/20">
                            <span className="material-symbols-outlined text-[18px]">error</span>
                            {loginError}
                          </div>
                        )}

                        <div className="flex flex-col gap-xs group">
                          <label className="font-label-md text-on-surface group-focus-within:text-primary transition-colors" htmlFor="login-username">Username / NISN</label>
                          <div className="relative flex items-center">
                            <span className="material-symbols-outlined absolute left-sm text-outline group-focus-within:text-primary transition-colors">person</span>
                            <input required value={username} onChange={e => setUsername(e.target.value)} className="academic-input w-full pl-[40px] pr-sm py-sm rounded-lg border border-outline-variant bg-white/80 text-body-md text-on-surface placeholder:text-outline-variant transition-all hover:border-outline focus:border-primary focus:ring-4 focus:ring-primary/10 focus:bg-white" id="login-username" placeholder="Masukkan Username atau NISN" type="text" />
                          </div>
                        </div>

                        <div className="flex flex-col gap-xs group">
                          <label className="font-label-md text-on-surface group-focus-within:text-primary transition-colors" htmlFor="login-password">Password</label>
                          <div className="relative flex items-center">
                            <span className="material-symbols-outlined absolute left-sm text-outline group-focus-within:text-primary transition-colors">lock</span>
                            <input required value={password} onChange={e => setPassword(e.target.value)} className="academic-input w-full pl-[40px] pr-[40px] py-sm rounded-lg border border-outline-variant bg-white/80 text-body-md text-on-surface placeholder:text-outline-variant transition-all hover:border-outline focus:border-primary focus:ring-4 focus:ring-primary/10 focus:bg-white" id="login-password" placeholder="••••••••" type={showPassword ? "text" : "password"} />
                            <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-sm text-outline hover:text-on-surface-variant transition-colors flex items-center justify-center h-full">
                                <span className="material-symbols-outlined text-[20px]">{showPassword ? 'visibility_off' : 'visibility'}</span>
                            </button>
                          </div>
                        </div>

                        <div className="flex justify-between items-center mb-xs mt-[-4px]">
                          <label className="flex items-center gap-2 cursor-pointer group">
                            <div className="relative flex items-center justify-center w-4 h-4 border border-outline-variant rounded group-hover:border-primary transition-colors">
                              <input type="checkbox" checked={rememberMe} onChange={() => setRememberMe(!rememberMe)} className="absolute opacity-0 w-full h-full cursor-pointer peer" />
                              <span className="material-symbols-outlined text-primary opacity-0 peer-checked:opacity-100 transition-opacity" style={{fontSize: "14px", fontVariationSettings: "'FILL' 1"}}>check</span>
                            </div>
                            <span className="font-body-md text-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Ingat Saya</span>
                          </label>
                          <button type="button" onClick={handleLupaPassword} className="font-body-md text-sm text-primary font-medium hover:text-primary-container transition-colors">Lupa Password?</button>
                        </div>

                        <button disabled={loading || loginSuccess} className={`w-full font-label-md py-sm rounded-lg transition-all duration-300 shadow-sm flex justify-center items-center gap-xs mt-2 ${loginSuccess ? 'bg-[#10B981] text-white' : 'bg-primary text-on-primary hover:bg-primary-container hover:shadow-lg hover:-translate-y-1'} disabled:opacity-80 disabled:cursor-not-allowed`} type="submit">
                          {loading ? (
                            <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                          ) : loginSuccess ? (
                            <><span className="material-symbols-outlined text-[20px] animate-fade-in-up">check_circle</span> Berhasil Masuk</>
                          ) : (
                            <>Masuk Sekarang <span className="material-symbols-outlined text-[18px]">arrow_forward</span></>
                          )}
                        </button>
                      </form>
                      
                      <p className="text-center font-body-md text-sm text-on-surface-variant mt-lg">
                        Belum punya akun? <button onClick={() => { setIsRegistering(true); setLoginError(''); }} className="text-primary hover:underline font-semibold" type="button">Daftar</button>
                      </p>
                    </div>

                    {/* DAFTAR FORM PANE */}
                    <div className="form-pane p-lg sm:p-xl flex flex-col justify-center min-h-full">
                      <div className="mb-lg md:hidden">
                        <h2 className="font-headline-md text-on-surface flex items-center gap-xs">
                          <img alt="NEXA Logo" className="w-8 h-8 object-contain rounded" src="https://lh3.googleusercontent.com/aida/AEtjO1VVZfSUCXhHzY1X0SeCMcnnfH7eVLHQqeKZRoS92h6LX1juBz1mnHDbVWx1-Ba6QJacojgIbeoyE3UGy8T6Tb1_zTR54w2rmJiBCsvoFvsirZvz0_Sze5GuvCCAGNsKINOED0RXdkwpJDJinvxgu4KYdM823w67kkw4wzY5RntMk58ZhF_-cEiEvWXFYy34ycs42ktHbpwy_GH_ydOPW5eO4S5k_plk9debDcu5KRZwhT3Qv_0W8MX-" />
                          NEXA
                        </h2>
                        <p className="font-body-md text-on-surface-variant mt-xs">Buat akun baru Anda.</p>
                      </div>
                      
                      <div className="hidden md:block mb-lg">
                        <h2 className="font-headline-md text-on-surface font-bold">Buat Akun Baru</h2>
                        <p className="font-body-md text-on-surface-variant mt-1">Lengkapi data berikut untuk bergabung.</p>
                      </div>

                      <form onSubmit={onRegisterSubmit} className="flex flex-col gap-sm flex-1">
                        {/* Segmented Control */}
                        <div className="flex bg-surface-container p-1 rounded-lg relative isolation-auto z-0 mb-xs shadow-inner">
                          {['siswa', 'guru'].map((r) => (
                            <label key={r} className="flex-1 cursor-pointer relative">
                              <input defaultChecked={r === 'siswa'} className="peer sr-only" name="reg-role" type="radio" value={r} />
                              <div className="w-full text-center py-2 rounded-md text-on-surface-variant font-label-md transition-all duration-300 peer-checked:text-primary z-10 relative capitalize">
                                {r}
                              </div>
                              <div className="absolute inset-0 bg-white rounded-md shadow-sm transform scale-90 opacity-0 peer-checked:opacity-100 peer-checked:scale-100 transition-all duration-300 -z-10"></div>
                            </label>
                          ))}
                        </div>

                        <div className="flex flex-col gap-xs group">
                          <label className="font-label-md text-on-surface text-sm group-focus-within:text-primary transition-colors" htmlFor="reg-name">Nama Lengkap</label>
                          <input className="academic-input w-full px-sm py-2 rounded-lg border border-outline-variant bg-white/80 text-body-md text-on-surface placeholder:text-outline-variant transition-all hover:border-outline focus:border-primary focus:ring-4 focus:ring-primary/10 focus:bg-white" id="reg-name" placeholder="Masukkan nama lengkap" type="text" />
                        </div>
                        <div className="flex flex-col gap-xs group">
                          <label className="font-label-md text-on-surface text-sm group-focus-within:text-primary transition-colors" htmlFor="reg-username">Username / NISN</label>
                          <input className="academic-input w-full px-sm py-2 rounded-lg border border-outline-variant bg-white/80 text-body-md text-on-surface placeholder:text-outline-variant transition-all hover:border-outline focus:border-primary focus:ring-4 focus:ring-primary/10 focus:bg-white" id="reg-username" placeholder="Masukkan Username atau NISN unik" type="text" />
                        </div>
                        <div className="flex flex-col gap-xs group mb-1">
                          <label className="font-label-md text-on-surface text-sm group-focus-within:text-primary transition-colors" htmlFor="reg-password">Password</label>
                          <div className="relative flex items-center">
                            <input className="academic-input w-full px-sm pr-[40px] py-2 rounded-lg border border-outline-variant bg-white/80 text-body-md text-on-surface placeholder:text-outline-variant transition-all hover:border-outline focus:border-primary focus:ring-4 focus:ring-primary/10 focus:bg-white" id="reg-password" placeholder="Buat password yang kuat" type={showPassword ? "text" : "password"} />
                            <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-sm text-outline hover:text-on-surface-variant transition-colors flex items-center justify-center h-full">
                                <span className="material-symbols-outlined text-[20px]">{showPassword ? 'visibility_off' : 'visibility'}</span>
                            </button>
                          </div>
                        </div>

                        <div className="mt-auto pt-2">
                          <button className="w-full bg-primary text-on-primary font-label-md py-sm rounded-lg hover:bg-primary-container hover:shadow-lg hover:-translate-y-1 transition-all duration-300 shadow-sm flex justify-center items-center gap-xs" type="submit">
                            Daftar Sekarang 
                            <span className="material-symbols-outlined text-[18px]">arrow_forward</span>
                          </button>
                          <p className="text-center font-body-md text-on-surface-variant mt-sm text-[12px]">
                            Dengan mendaftar, Anda menyetujui <button type="button" onClick={handleSyaratKetentuan} className="text-primary hover:underline">Syarat & Ketentuan</button> kami.
                          </p>
                        </div>
                      </form>
                      
                      <p className="text-center font-body-md text-sm text-on-surface-variant mt-md">
                        Sudah punya akun? <button onClick={() => { setIsRegistering(false); setLoginError(''); }} className="text-primary hover:underline font-semibold" type="button">Masuk</button>
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        switch (user.role) {
          case 'admin': return <AdminView user={user} onLogout={handleLogout} />;
          case 'guru': return <GuruView user={user} onLogout={handleLogout} showMessage={showMessage} />;
          case 'siswa': return <SiswaView user={user} onLogout={handleLogout} showMessage={showMessage} />;
          default: return <div className="p-8 text-center text-red-600 font-bold bg-white h-screen">Role tidak valid!</div>;
        }
      };

      return (
        <React.Fragment>
          {renderView()}
          <Modal
            isOpen={modal.isOpen}
            title={modal.title}
            message={modal.message}
            type={modal.type}
            onClose={() => setModal({ ...modal, isOpen: false })}
          />
        </React.Fragment>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
