  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ==============================================================================
    // KONFIGURASI UTAMA
    // ==============================================================================
    const SUPABASE_URL = 'https://cdcbarlyxjywltgrjgnr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkY2Jhcmx5eGp5d2x0Z3JqZ25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyOTkwNTQsImV4cCI6MjEwMjg3NTA1NH0.Lze94l74sblAVNN4-IUtyQ_idr-aQCECxgPWTVAI5-c';
    const STATUS = { SUCCESS: "success", ERROR: "error" };
    const ROLES = { ADMIN: "admin", GURU: "guru", SISWA: "siswa" };

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Utility: Penghitung Waktu Mundur
    const calculateTimeLeft = (endTime) => {
      const difference = new Date(endTime) - new Date();
      if (difference <= 0) return { total: 0, hours: 0, minutes: 0, seconds: 0 };
      return {
        total: difference,
        hours: Math.floor((difference / (1000 * 60 * 60)) % 24),
        minutes: Math.floor((difference / 1000 / 60) % 60),
        seconds: Math.floor((difference / 1000) % 60)
      };
    };

    // Fungsi fetchAPI sebagai Router Supabase

    const fetchAPI = async (action, payload = {}) => {
      try {
        let data, error;
        switch (action) {
          // ================= AUTH =================
          case 'login': {
            const table = payload.role === 'admin' ? 'admin' : (payload.role === 'guru' ? 'guru' : 'siswa');
            ({ data, error } = await supabaseClient
              .from(table)
              .select('*')
              .eq('username', payload.username)
              .eq('password', payload.password)
              .single());
            if (error || !data) return { status: 'error', message: 'Username, password, atau role salah.' };
            data.role = payload.role;
            return { status: 'success', data };
          }
          case 'register': {
            ({ data, error } = await supabaseClient
              .from('siswa')
              .insert([{
                id_siswa: payload.id_user,
                nama_lengkap: payload.nama_lengkap,
                username: payload.username,
                password: payload.password
              }]));
            if (error) {
              if (error.code === '23505') return { status: 'error', message: 'Username sudah terdaftar.' };
              return { status: 'error', message: error.message };
            }
            return { status: 'success', message: 'Registrasi berhasil. Silakan login.' };
          }

          // ================= ADMIN DASHBOARD =================
          case 'get_admin_dashboard_data': {
            const [siswaRes, guruRes, jadwalRes, aktifRes] = await Promise.all([
              supabaseClient.from('siswa').select('id_siswa', { count: 'exact' }),
              supabaseClient.from('guru').select('id_guru', { count: 'exact' }),
              supabaseClient.from('jadwal').select('id_jadwal', { count: 'exact' }),
              supabaseClient.from('log_ujian').select('id_log', { count: 'exact' }).eq('status_ujian', 'SEDANG KERJA')
            ]);

            const { data: jadwalAktifData } = await supabaseClient
              .from('jadwal')
              .select('id_jadwal, waktu_mulai, waktu_selesai, guru(nama_lengkap), mata_pelajaran(nama_mapel)')
              .limit(5);

            return {
              status: 'success',
              data: {
                totalSiswa: siswaRes.count || 0,
                totalGuru: guruRes.count || 0,
                totalJadwal: jadwalRes.count || 0,
                totalSesiAktif: aktifRes.count || 0,
                jadwalAktif: (jadwalAktifData || []).map(j => ({
                  id_jadwal: j.id_jadwal,
                  nama_mapel: j.mata_pelajaran ? j.mata_pelajaran.nama_mapel : 'Unknown',
                  guru: j.guru ? j.guru.nama_lengkap : 'Unknown',
                  waktu_mulai: j.waktu_mulai,
                  waktu_selesai: j.waktu_selesai
                }))
              }
            };
          }

          // ================= CRUD ADMIN =================
          case 'get_siswa': {
            ({ data, error } = await supabaseClient.from('siswa').select('*').order('created_at', { ascending: false }));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', data };
          }
          case 'create_siswa': {
            ({ error } = await supabaseClient.from('siswa').insert([payload]));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', message: 'Siswa berhasil ditambahkan' };
          }
          case 'create_siswa_bulk': {
            ({ error } = await supabaseClient.from('siswa').insert(payload));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', message: 'Siswa berhasil ditambahkan secara massal' };
          }
          case 'update_siswa': {
            const { id_siswa, ...updates } = payload;
            ({ error } = await supabaseClient.from('siswa').update(updates).eq('id_siswa', id_siswa));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', message: 'Siswa berhasil diperbarui' };
          }
          case 'delete_siswa': {
            ({ error } = await supabaseClient.from('siswa').delete().eq('id_siswa', payload.id_siswa));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', message: 'Siswa berhasil dihapus' };
          }

          // GURU
          case 'get_guru': {
            ({ data, error } = await supabaseClient.from('guru').select('*, guru_mapel(id_mapel, mata_pelajaran(nama_mapel))').order('created_at', { ascending: false }));
            if (error) return { status: 'error', message: error.message };
            const processedData = data.map(g => {
              const mapels = g.guru_mapel ? g.guru_mapel.map(gm => gm.mata_pelajaran?.nama_mapel).filter(Boolean) : [];
              const idMapels = g.guru_mapel ? g.guru_mapel.map(gm => gm.id_mapel) : [];
              return {
                ...g,
                mapels_list: mapels.join(', ') || '-',
                id_mapels: idMapels
              };
            });
            return { status: 'success', data: processedData };
          }
          case 'create_guru': {
            const { mapels, ...guruData } = payload;
            const res = await supabaseClient.from('guru').insert([guruData]).select();
            if (res.error) return { status: 'error', message: res.error.message };
            if (mapels && mapels.length > 0) {
              const mapelInserts = mapels.map(m => ({ id_guru: guruData.id_guru, id_mapel: m }));
              await supabaseClient.from('guru_mapel').insert(mapelInserts);
            }
            return { status: 'success', message: 'Guru berhasil ditambahkan' };
          }
          case 'create_guru_bulk': {
            ({ error } = await supabaseClient.from('guru').insert(payload));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', message: 'Guru berhasil ditambahkan secara massal' };
          }
          case 'update_guru': {
            const { id_guru, mapels, ...updates } = payload;
            const res = await supabaseClient.from('guru').update(updates).eq('id_guru', id_guru);
            if (res.error) return { status: 'error', message: res.error.message };
            // delete old guru_mapel
            await supabaseClient.from('guru_mapel').delete().eq('id_guru', id_guru);
            // insert new guru_mapel
            if (mapels && mapels.length > 0) {
              const mapelInserts = mapels.map(m => ({ id_guru, id_mapel: m }));
              await supabaseClient.from('guru_mapel').insert(mapelInserts);
            }
            return { status: 'success', message: 'Guru berhasil diperbarui' };
          }
          case 'delete_guru': {
            ({ error } = await supabaseClient.from('guru').delete().eq('id_guru', payload.id_guru));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', message: 'Guru berhasil dihapus' };
          }

          // MATA PELAJARAN
          case 'get_all_mapel': {
            ({ data, error } = await supabaseClient.from('mata_pelajaran').select('*'));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', data };
          }
          case 'create_mapel': {
            ({ error } = await supabaseClient.from('mata_pelajaran').insert([payload]));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', message: 'Mata pelajaran berhasil ditambahkan' };
          }
          case 'create_mapel_bulk': {
            ({ error } = await supabaseClient.from('mata_pelajaran').insert(payload));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', message: 'Mata pelajaran berhasil ditambahkan secara massal' };
          }
          case 'update_mapel': {
            const { id_mapel, ...updates } = payload;
            ({ error } = await supabaseClient.from('mata_pelajaran').update(updates).eq('id_mapel', id_mapel));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', message: 'Mata pelajaran berhasil diperbarui' };
          }
          case 'delete_mapel': {
            ({ error } = await supabaseClient.from('mata_pelajaran').delete().eq('id_mapel', payload.id_mapel));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', message: 'Mata pelajaran berhasil dihapus' };
          }

          case 'get_all_jadwal': {
            ({ data, error } = await supabaseClient.from('jadwal').select('*, guru(nama_lengkap), mata_pelajaran(nama_mapel)'));
            if (error) return { status: 'error', message: error.message };
            return {
              status: 'success',
              data: data.map(j => ({
                ...j,
                guru: j.guru ? j.guru.nama_lengkap : 'Unknown',
                nama_mapel: j.mata_pelajaran ? j.mata_pelajaran.nama_mapel : 'Unknown'
              }))
            };
          }

          case 'create_jadwal': {
            ({ error } = await supabaseClient.from('jadwal').insert([payload]));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', message: 'Jadwal berhasil ditambahkan' };
          }
          case 'create_jadwal_bulk': {
            ({ error } = await supabaseClient.from('jadwal').insert(payload));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', message: 'Jadwal berhasil ditambahkan secara massal' };
          }

          case 'delete_jadwal': {
            ({ error } = await supabaseClient.from('jadwal').delete().eq('id_jadwal', payload.id_jadwal));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', message: 'Jadwal berhasil dihapus.' };
          }

          // ================= GURU / PENGAWAS =================
          case 'get_jadwal_pengawas': {
            let q = supabaseClient.from('jadwal').select('*, mata_pelajaran(nama_mapel)');
            if (payload.id_guru) q = q.eq('id_guru', payload.id_guru);
            ({ data, error } = await q);
            if (error) return { status: 'error', message: error.message };
            return {
              status: 'success',
              data: data.map(j => ({ ...j, nama_mapel: j.mata_pelajaran ? j.mata_pelajaran.nama_mapel : 'Unknown' }))
            };
          }

          case 'get_mapel_guru': {
            ({ data, error } = await supabaseClient.from('guru_mapel').select('*, mata_pelajaran(nama_mapel)').eq('id_guru', payload.id_guru));
            if (error) return { status: 'error', message: error.message };
            return {
              status: 'success',
              data: data.map(gm => ({ ...gm, nama_mapel: gm.mata_pelajaran ? gm.mata_pelajaran.nama_mapel : 'Unknown' }))
            };
          }

          case 'get_soal_by_mapel': {
            ({ data, error } = await supabaseClient.from('soal_ujian').select('*').eq('id_mapel', payload.id_mapel));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', data };
          }

          case 'create_soal_mapel': {
            ({ error } = await supabaseClient.from('soal_ujian').insert([payload]));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', message: 'Soal berhasil ditambahkan.' };
          }

          case 'update_soal_mapel': {
            const { id_soal, ...updates } = payload;
            ({ error } = await supabaseClient.from('soal_ujian').update(updates).eq('id_soal', id_soal));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', message: 'Soal berhasil diperbarui.' };
          }

          case 'delete_soal_mapel': {
            ({ error } = await supabaseClient.from('soal_ujian').delete().eq('id_soal', payload.id_soal));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', message: 'Soal berhasil dihapus.' };
          }

          case 'get_jawaban_uraian': {
            ({ data, error } = await supabaseClient.from('jawaban_siswa').select('*, soal_ujian(pertanyaan)').eq('id_log', payload.id_log).eq('is_uraian', true));
            if (error) return { status: 'error', message: error.message };
            return {
              status: 'success',
              data: data.map(j => ({ ...j, pertanyaan: j.soal_ujian ? j.soal_ujian.pertanyaan : 'Unknown' }))
            };
          }

          case 'update_nilai_uraian': {
            const { id_log, nilai_uraian_total } = payload;
            // update log_ujian with new total uraian
            ({ error } = await supabaseClient.from('log_ujian').update({ nilai_uraian: nilai_uraian_total }).eq('id_log', id_log));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', message: 'Nilai uraian berhasil disimpan.' };
          }

          case 'get_token': {
            ({ data, error } = await supabaseClient.from('jadwal').select('token_aktif, last_update_token').eq('id_jadwal', payload.id_jadwal).single());
            if (error) return { status: 'error', message: error.message };

            let token = data.token_aktif;
            let lastUpdate = data.last_update_token ? new Date(data.last_update_token).getTime() : 0;
            let now = new Date().getTime();

            if (now - lastUpdate > 300000 || !token) {
              token = Math.random().toString(36).substring(2, 8).toUpperCase();
              await supabaseClient.from('jadwal').update({
                token_aktif: token,
                last_update_token: new Date().toISOString()
              }).eq('id_jadwal', payload.id_jadwal);
            }
            return { status: 'success', token };
          }

          case 'monitoring_ujian': {
            ({ data, error } = await supabaseClient.from('log_ujian').select('*, siswa(nama_lengkap)').eq('id_jadwal', payload.id_jadwal));
            if (error) return { status: 'error', message: error.message };
            return {
              status: 'success',
              data: data.map(l => ({ ...l, nama_lengkap: l.siswa ? l.siswa.nama_lengkap : 'Unknown' }))
            };
          }

          case 'get_hasil_ujian': {
            ({ data, error } = await supabaseClient.from('log_ujian').select('*, siswa(nama_lengkap, angkatan, kelas_paralel)').eq('id_jadwal', payload.id_jadwal).eq('status_ujian', 'SELESAI'));
            if (error) return { status: 'error', message: error.message };
            return {
              status: 'success',
              data: data.map(l => ({
                ...l,
                nama_lengkap: l.siswa ? l.siswa.nama_lengkap : 'Unknown',
                angkatan: l.siswa ? l.siswa.angkatan : '-',
                kelas_paralel: l.siswa ? l.siswa.kelas_paralel : '-',
                total_nilai: (Number(l.nilai_auto) || 0) + (Number(l.nilai_uraian) || 0)
              }))
            };
          }

          case 'buka_blokir': {
            ({ error } = await supabaseClient.from('log_ujian').update({ is_blocked: false }).eq('id_log', payload.id_log));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', message: 'Blokir berhasil dibuka.' };
          }

          case 'submit_nilai_uraian': {
            ({ error } = await supabaseClient.from('log_ujian').update({ nilai_uraian: payload.nilai }).eq('id_log', payload.id_log));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', message: 'Nilai uraian berhasil diupdate.' };
          }

          // ================= SISWA =================
          case 'get_jadwal': {
            ({ data, error } = await supabaseClient.from('jadwal').select('*, guru(nama_lengkap), mata_pelajaran(nama_mapel)'));
            if (error) return { status: 'error', message: error.message };
            return {
              status: 'success',
              data: data.map(j => ({
                ...j,
                nama_guru: j.guru ? j.guru.nama_lengkap : 'Unknown',
                nama_mapel: j.mata_pelajaran ? j.mata_pelajaran.nama_mapel : 'Unknown'
              }))
            };
          }

          case 'mulai_ujian': {
            ({ data, error } = await supabaseClient.from('jadwal').select('token_aktif, waktu_selesai').eq('id_jadwal', payload.id_jadwal).single());
            if (error || !data) return { status: 'error', message: 'Jadwal tidak ditemukan.' };
            if (new Date(data.waktu_selesai) < new Date()) return { status: 'error', message: 'Ujian sudah berakhir.' };
            if (data.token_aktif !== payload.token) return { status: 'error', message: 'Token tidak valid atau sudah expired.' };

            const { data: logData } = await supabaseClient.from('log_ujian').select('*').eq('id_siswa', payload.id_siswa).eq('id_jadwal', payload.id_jadwal).single();
            let idLog = logData ? logData.id_log : null;

            if (logData) {
              if (logData.is_blocked) return { status: 'error', message: 'Akun Anda diblokir dari ujian ini.' };
              if (logData.status_ujian === 'SELESAI') return { status: 'error', message: 'Anda sudah menyelesaikan ujian ini.' };
            } else {
              idLog = 'LOG-' + Math.random().toString(36).substr(2, 9);
              await supabaseClient.from('log_ujian').insert([{
                id_log: idLog,
                id_jadwal: payload.id_jadwal,
                id_siswa: payload.id_siswa,
                status_ujian: 'SEDANG KERJA'
              }]);
            }
            return { status: 'success', id_log: idLog };
          }

          case 'get_soal_ujian': {
            const { data: jadwal } = await supabaseClient.from('jadwal').select('id_mapel').eq('id_jadwal', payload.id_jadwal).single();
            if (!jadwal) return { status: 'error', message: 'Jadwal tidak ditemukan' };
            ({ data, error } = await supabaseClient.from('soal_ujian').select('*').eq('id_mapel', jadwal.id_mapel));
            if (error) return { status: 'error', message: error.message };
            return { status: 'success', data };
          }

          case 'catat_pelanggaran': {
            const { data: currLog } = await supabaseClient.from('log_ujian').select('pelanggaran').eq('id_log', payload.id_log).single();
            if (!currLog) return { status: 'error', message: 'Log tidak ditemukan' };
            const newPelanggaran = (currLog.pelanggaran || 0) + 1;
            const isBlocked = newPelanggaran >= 3;
            await supabaseClient.from('log_ujian').update({ pelanggaran: newPelanggaran, is_blocked: isBlocked }).eq('id_log', payload.id_log);
            return { status: 'success' };
          }

          case 'submit_ujian': {
            const logId = payload.id_log;
            const jawaban = payload.jawaban; // object: { id_soal: jawaban_user }
            const idSiswa = payload.id_siswa;

            const { data: jadwal } = await supabaseClient.from('jadwal').select('id_mapel').eq('id_jadwal', payload.id_jadwal).single();
            const { data: soalData } = await supabaseClient.from('soal_ujian').select('*').eq('id_mapel', jadwal?.id_mapel);
            
            let totalSkorMaxAuto = 0;
            let totalSkorDiperolehAuto = 0;
            let insertJawaban = [];

            if (soalData) {
              for (const soal of soalData) {
                let jwb = jawaban[soal.id_soal];
                let isCorrect = false;
                let skorDiperoleh = 0;
                let bobot = Number(soal.bobot) || 1;
                
                if (soal.tipe_soal !== 'URAIAN') {
                  totalSkorMaxAuto += bobot;
                }

                if (jwb !== undefined && jwb !== null) {
                  if (soal.tipe_soal === 'PG' || soal.tipe_soal === 'BS' || soal.tipe_soal === 'ISIAN') {
                    if (String(jwb).trim().toLowerCase() === String(soal.kunci_jawaban).trim().toLowerCase()) {
                      isCorrect = true;
                      skorDiperoleh = bobot;
                    }
                  } else if (soal.tipe_soal === 'PGK') {
                    try {
                      let kunciArr = JSON.parse(soal.kunci_jawaban);
                      if (Array.isArray(jwb) && jwb.length === kunciArr.length && jwb.every(v => kunciArr.includes(v))) {
                        isCorrect = true;
                        skorDiperoleh = bobot;
                      }
                    } catch (e) {}
                  } else if (soal.tipe_soal === 'JODOH') {
                    try {
                      let kunciObj = JSON.parse(soal.kunci_jawaban);
                      let jwbObj = typeof jwb === 'string' ? JSON.parse(jwb) : jwb;
                      let isMatch = true;
                      for (let key in kunciObj) {
                        if (kunciObj[key] !== jwbObj[key]) isMatch = false;
                      }
                      if (isMatch) {
                        isCorrect = true;
                        skorDiperoleh = bobot;
                      }
                    } catch (e) {}
                  }
                }

                let stringJawaban = (typeof jwb === 'object') ? JSON.stringify(jwb) : String(jwb || '');

                insertJawaban.push({
                  id_jawaban: 'JWB-' + Math.random().toString(36).substr(2, 9),
                  id_log: logId,
                  id_soal: soal.id_soal,
                  jawaban_user: stringJawaban,
                  is_correct: isCorrect,
                  skor_diperoleh: skorDiperoleh,
                  is_uraian: soal.tipe_soal === 'URAIAN'
                });
                
                totalSkorDiperolehAuto += skorDiperoleh;
              }
            }

            await supabaseClient.from('jawaban_siswa').delete().eq('id_log', logId);
            if (insertJawaban.length > 0) {
              await supabaseClient.from('jawaban_siswa').insert(insertJawaban);
            }

            let nilaiAuto = 0;
            if (totalSkorMaxAuto > 0) {
              nilaiAuto = (totalSkorDiperolehAuto / totalSkorMaxAuto) * 100;
              nilaiAuto = Math.round(nilaiAuto * 100) / 100;
            }

            await supabaseClient.from('log_ujian').update({
              status_ujian: 'SELESAI',
              nilai_auto: nilaiAuto
            }).eq('id_log', logId);

            return { status: 'success', message: 'Ujian berhasil diselesaikan.', nilai_auto: nilaiAuto };
          }

          default:
            return { status: 'error', message: 'Action tidak dikenali oleh router Supabase.' };
        }
      } catch (error) {
        console.error("Supabase Error:", error);
        return { status: 'error', message: error.message };
      }

        </div>
      );
    };


    const FormSoalModal = ({ isOpen, data, onClose, onSave }) => {
      if (!isOpen) return null;
      const [tipe, setTipe] = useState(data ? data.tipe_soal : 'PG');
      const [pertanyaan, setPertanyaan] = useState(data ? data.pertanyaan : '');
      const [bobot, setBobot] = useState(data ? data.bobot : 1);
      
      const [opsiPG, setOpsiPG] = useState(data && (data.tipe_soal==='PG' || data.tipe_soal==='PGK') ? JSON.parse(data.opsi || '["","","","",""]') : ['','','','','']);
      const [kunciPG, setKunciPG] = useState(data && data.tipe_soal==='PG' ? data.kunci_jawaban : '');
      const [kunciPGK, setKunciPGK] = useState(data && data.tipe_soal==='PGK' ? JSON.parse(data.kunci_jawaban || '[]') : []);
      const [kunciBS, setKunciBS] = useState(data && data.tipe_soal==='BS' ? data.kunci_jawaban : 'Benar');
      
      const defaultPremis = [''];
      const defaultRespon = [''];
      const [premis, setPremis] = useState(data && data.tipe_soal==='JODOH' && data.opsi ? JSON.parse(data.opsi).premis : defaultPremis);
      const [respon, setRespon] = useState(data && data.tipe_soal==='JODOH' && data.opsi ? JSON.parse(data.opsi).respon : defaultRespon);
      const [kunciJodoh, setKunciJodoh] = useState(data && data.tipe_soal==='JODOH' ? JSON.parse(data.kunci_jawaban || '{}') : {});
      
      const [kunciIsian, setKunciIsian] = useState(data && data.tipe_soal==='ISIAN' ? data.kunci_jawaban : '');

      const handleSave = () => {
        let payload = {
          id_soal: data ? data.id_soal : null,
          tipe_soal: tipe,
          pertanyaan: pertanyaan,
          bobot: bobot
        };

        if (tipe === 'PG') {
          payload.opsi = JSON.stringify(opsiPG);
          payload.kunci_jawaban = opsiPG[parseInt(kunciPG)];
          if (kunciPG === '') return alert('Pilih kunci jawaban PG.');
        } else if (tipe === 'PGK') {
          payload.opsi = JSON.stringify(opsiPG);
          payload.kunci_jawaban = JSON.stringify(kunciPGK.map(idx => opsiPG[idx]));
          if (kunciPGK.length < 2) return alert('Pilih minimal 2 kunci jawaban untuk PGK.');
        } else if (tipe === 'BS') {
          payload.opsi = JSON.stringify(['Benar', 'Salah']);
          payload.kunci_jawaban = kunciBS;
        } else if (tipe === 'JODOH') {
          payload.opsi = JSON.stringify({ premis, respon });
          payload.kunci_jawaban = JSON.stringify(kunciJodoh);
        } else if (tipe === 'ISIAN') {
          payload.opsi = null;
          payload.kunci_jawaban = kunciIsian;
        } else if (tipe === 'URAIAN') {
          payload.opsi = null;
          payload.kunci_jawaban = null;
        }

        onSave(payload);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
          <div className="bg-surface dark:bg-slate-800 rounded-2xl w-full max-w-3xl max-h-[90vh] flex flex-col shadow-2xl">
            <div className="p-6 border-b dark:border-slate-700 flex justify-between items-center">
              <h2 className="text-2xl font-bold">{data ? 'Edit Soal' : 'Tambah Soal'}</h2>
              <button onClick={onClose} className="text-slate-500 hover:text-slate-800"><span className="material-symbols-outlined">close</span></button>
            </div>
            <div className="p-6 overflow-y-auto flex-1 space-y-4">
              <div>
                <label className="block text-sm font-bold mb-1">Tipe Soal</label>
                <select value={tipe} onChange={(e) => setTipe(e.target.value)} disabled={!!data} className="w-full p-2 border rounded bg-surface dark:bg-slate-900">
                  <option value="PG">Pilihan Ganda (PG)</option>
                  <option value="PGK">Pilihan Ganda Kompleks (PGK)</option>
                  <option value="BS">Benar / Salah (BS)</option>
                  <option value="JODOH">Menjodohkan</option>
                  <option value="ISIAN">Isian Singkat</option>
                  <option value="URAIAN">Uraian</option>
                </select>
              </div>
              <div>
                <label className="block text-sm font-bold mb-1">Pertanyaan / Stimulus</label>
                <textarea value={pertanyaan} onChange={(e) => setPertanyaan(e.target.value)} className="w-full p-2 border rounded h-32 bg-surface dark:bg-slate-900" placeholder="Tuliskan teks bacaan (stimulus) beserta pertanyaan..."></textarea>
              </div>
              <div>
                <label className="block text-sm font-bold mb-1">Bobot Nilai</label>
                <input type="number" value={bobot} onChange={(e) => setBobot(e.target.value)} className="w-full p-2 border rounded bg-surface dark:bg-slate-900" min="1" />
              </div>

              {/* PG / PGK */}
              {(tipe === 'PG' || tipe === 'PGK') && (
                <div className="space-y-2">
                  <label className="block text-sm font-bold mb-1">Opsi Jawaban & Kunci</label>
                  {opsiPG.map((o, idx) => (
                    <div key={idx} className="flex gap-2 items-center">
                      {tipe === 'PG' ? (
                        <input type="radio" name="kunciPG" value={idx} checked={String(kunciPG) === String(idx) || (data && opsiPG[idx] === data.kunci_jawaban)} onChange={() => setKunciPG(idx)} />
                      ) : (
                        <input type="checkbox" checked={kunciPGK.includes(idx) || (data && JSON.parse(data.kunci_jawaban || '[]').includes(opsiPG[idx]))} onChange={(e) => {
                          if (e.target.checked) setKunciPGK([...kunciPGK, idx]);
                          else setKunciPGK(kunciPGK.filter(i => i !== idx));
                        }} />
                      )}
                      <input type="text" value={o} onChange={(e) => { const newOpsi = [...opsiPG]; newOpsi[idx] = e.target.value; setOpsiPG(newOpsi); }} className="flex-1 p-2 border rounded bg-surface dark:bg-slate-900" placeholder={`Opsi ${String.fromCharCode(65+idx)}`} />
                    </div>
                  ))}
                </div>
              )}

              {/* BS */}
              {tipe === 'BS' && (
                <div>
                  <label className="block text-sm font-bold mb-1">Kunci Jawaban</label>
                  <select value={kunciBS} onChange={(e) => setKunciBS(e.target.value)} className="w-full p-2 border rounded bg-surface dark:bg-slate-900">
                    <option value="Benar">Benar</option>
                    <option value="Salah">Salah</option>
                  </select>
                </div>
              )}

              {/* JODOH */}
              {tipe === 'JODOH' && (
                <div>
                  <div className="flex gap-4">
                    <div className="flex-1">
                      <label className="block text-sm font-bold mb-1">Premis (Bagian A)</label>
                      {premis.map((p, idx) => (
                        <input key={idx} type="text" value={p} onChange={(e) => { const newP = [...premis]; newP[idx] = e.target.value; setPremis(newP); }} className="w-full p-2 border rounded mb-2 bg-surface dark:bg-slate-900" />
                      ))}
                      <button onClick={() => setPremis([...premis, ''])} className="text-sm text-primary">+ Tambah Premis</button>
                    </div>
                    <div className="flex-1">
                      <label className="block text-sm font-bold mb-1">Respon (Bagian B)</label>
                      {respon.map((r, idx) => (
                        <input key={idx} type="text" value={r} onChange={(e) => { const newR = [...respon]; newR[idx] = e.target.value; setRespon(newR); }} className="w-full p-2 border rounded mb-2 bg-surface dark:bg-slate-900" />
                      ))}
                      <button onClick={() => setRespon([...respon, ''])} className="text-sm text-primary">+ Tambah Respon</button>
                    </div>
                  </div>
                  <div className="mt-4">
                    <label className="block text-sm font-bold mb-1">Kunci Pasangan</label>
                    {premis.map((p, idx) => p && (
                      <div key={idx} className="flex gap-2 items-center mb-2">
                        <span className="flex-1">{p}</span>
                        <span>&rarr;</span>
                        <select value={kunciJodoh[p] || ''} onChange={(e) => setKunciJodoh({...kunciJodoh, [p]: e.target.value})} className="flex-1 p-2 border rounded bg-surface dark:bg-slate-900">
                          <option value="">Pilih Respon...</option>
                          {respon.map((r, i) => r && <option key={i} value={r}>{r}</option>)}
                        </select>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* ISIAN */}
              {tipe === 'ISIAN' && (
                <div>
                  <label className="block text-sm font-bold mb-1">Kunci Jawaban Isian</label>
                  <input type="text" value={kunciIsian} onChange={(e) => setKunciIsian(e.target.value)} className="w-full p-2 border rounded bg-surface dark:bg-slate-900" />
                </div>
              )}

            </div>
            <div className="p-6 border-t dark:border-slate-700 flex justify-end gap-4">
              <button onClick={onClose} className="px-6 py-2 rounded-lg font-bold bg-surface-variant text-on-surface hover:bg-surface-variant/80">Batal</button>
              <button onClick={handleSave} className="px-6 py-2 rounded-lg font-bold bg-primary text-on-primary hover:bg-primary/90">Simpan Soal</button>
            </div>
          </div>
        </div>
      );
    };

    const ModalPeriksaUraian = ({ isOpen, logUjian, jawabanUraian, onClose, onSave }) => {
      if (!isOpen) return null;
      
      const [scores, setScores] = useState({});

      const handleSave = () => {
        let totalUraian = 0;
        for (let key in scores) {
          totalUraian += Number(scores[key] || 0);
        }
        onSave(totalUraian);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
          <div className="bg-surface dark:bg-slate-800 rounded-2xl w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl">
            <div className="p-6 border-b dark:border-slate-700">
              <h2 className="text-2xl font-bold">Periksa Jawaban Uraian</h2>
              <p className="text-sm text-slate-500">Siswa: {logUjian?.nama_lengkap}</p>
            </div>
            <div className="p-6 overflow-y-auto flex-1 space-y-6">
              {jawabanUraian.length === 0 ? (
                <div className="text-center text-slate-500">Tidak ada soal uraian untuk ujian ini.</div>
              ) : (
                jawabanUraian.map((j, idx) => (
                  <div key={idx} className="bg-surface-variant/20 p-4 rounded-xl border border-outline-variant">
                    <div className="font-bold mb-2">Soal {idx + 1}:</div>
                    <div className="text-sm mb-4" dangerouslySetInnerHTML={{ __html: j.pertanyaan }}></div>
                    <div className="font-bold text-primary mb-1">Jawaban Siswa:</div>
                    <div className="bg-surface dark:bg-slate-900 p-3 rounded text-sm mb-4 whitespace-pre-wrap">{j.jawaban_user || '-'}</div>
                    <div className="flex items-center gap-4">
                      <label className="font-bold">Skor Diberikan:</label>
                      <input type="number" min="0" value={scores[j.id_jawaban] !== undefined ? scores[j.id_jawaban] : ''} onChange={(e) => setScores({...scores, [j.id_jawaban]: e.target.value})} className="w-24 p-2 border rounded bg-surface dark:bg-slate-900" placeholder="0" />
                    </div>
                  </div>
                ))
              )}
            </div>
            <div className="p-6 border-t dark:border-slate-700 flex justify-end gap-4">
              <button onClick={onClose} className="px-6 py-2 rounded-lg font-bold bg-surface-variant hover:bg-surface-variant/80">Tutup</button>
              <button onClick={handleSave} className="px-6 py-2 rounded-lg font-bold bg-primary text-white hover:bg-primary/90">Simpan Nilai Uraian</button>
            </div>
          </div>
        </div>
      );
    };

    const GuruView = ({ user, onLogout, isDarkMode, setIsDarkMode }) => {
      const [activeTab, setActiveTab] = useState('jadwal');
      const [dataJadwal, setDataJadwal] = useState([]);
      const [selectedJadwal, setSelectedJadwal] = useState(null);
      const [dataLog, setDataLog] = useState([]);
      const [isLoading, setIsLoading] = useState(false);
      
      const [dataMapel, setDataMapel] = useState([]);
      const [selectedMapel, setSelectedMapel] = useState(null);
      const [dataSoal, setDataSoal] = useState([]);
      const [formSoal, setFormSoal] = useState({ isOpen: false, data: null });
      
      const [modalUraian, setModalUraian] = useState({ isOpen: false, logUjian: null, jawabanUraian: [] });

      const fetchData = async () => {
        setIsLoading(true);
        if (activeTab === 'jadwal') {
          const res = await fetchAPI('get_jadwal_pengawas', { id_guru: user.id_user });
          if (res.status === 'success') setDataJadwal(res.data);
        } else if (activeTab === 'monitoring') {
          const res = await fetchAPI('get_jadwal_pengawas', { id_guru: user.id_user });
          if (res.status === 'success') setDataJadwal(res.data);
          if (selectedJadwal) {
            const logRes = await fetchAPI('monitoring_ujian', { id_jadwal: selectedJadwal });
            if (logRes.status === 'success') setDataLog(logRes.data);
          }
        } else if (activeTab === 'bank_soal') {
          const res = await fetchAPI('get_mapel_guru', { id_guru: user.id_user });
          if (res.status === 'success') setDataMapel(res.data);
          
          if (selectedMapel) {
            const soalRes = await fetchAPI('get_soal_by_mapel', { id_mapel: selectedMapel });
            if (soalRes.status === 'success') setDataSoal(soalRes.data);
          }
        }
        setIsLoading(false);
      };

      useEffect(() => {
        fetchData();
        // Polling for monitoring
        let interval;
        if (activeTab === 'monitoring' && selectedJadwal) {
          interval = setInterval(fetchData, 5000);
        }
        return () => clearInterval(interval);
      }, [activeTab, selectedJadwal, selectedMapel]);

      const handleGenerateToken = async (id) => {
        const res = await fetchAPI('get_token', { id_jadwal: id });
        if (res.status === 'success') {
          alert('Token Ujian: ' + res.token);
          fetchData();
        } else alert(res.message);
      };

      const handleBlock = async (idLog) => {
        if (!confirm('Blokir siswa ini?')) return;
        await fetchAPI('catat_pelanggaran', { id_log: idLog });
        fetchData();
      };

      const handleUnblock = async (idLog) => {
        if (!confirm('Buka blokir siswa ini?')) return;
        await fetchAPI('buka_blokir', { id_log: idLog });
        fetchData();
      };

      const saveSoal = async (payload) => {
        const endpoint = payload.id_soal ? 'update_soal_mapel' : 'create_soal_mapel';
        if (!payload.id_soal) {
          payload.id_soal = 'S-' + Math.random().toString(36).substr(2, 6).toUpperCase();
        }
        payload.id_mapel = selectedMapel;
        const res = await fetchAPI(endpoint, payload);
        if (res.status === 'success') {
          setFormSoal({ isOpen: false, data: null });
          fetchData();
        } else alert(res.message);
      };

      const deleteSoal = async (id) => {
        if (!confirm('Hapus soal ini?')) return;
        const res = await fetchAPI('delete_soal_mapel', { id_soal: id });
        if (res.status === 'success') fetchData();
        else alert(res.message);
      };

      const openPeriksaUraian = async (logData) => {
        const res = await fetchAPI('get_jawaban_uraian', { id_log: logData.id_log });
        if (res.status === 'success') {
          setModalUraian({ isOpen: true, logUjian: logData, jawabanUraian: res.data });
        } else {
          alert('Gagal mengambil jawaban uraian: ' + res.message);
        }
      };

      const saveNilaiUraian = async (totalNilai) => {
        const res = await fetchAPI('update_nilai_uraian', { id_log: modalUraian.logUjian.id_log, nilai_uraian_total: totalNilai });
        if (res.status === 'success') {
          setModalUraian({ isOpen: false, logUjian: null, jawabanUraian: [] });
          fetchData();
        } else alert(res.message);
      };

      return (
        <div className="bg-background dark:bg-slate-900 text-on-background dark:text-slate-100 antialiased flex min-h-screen transition-colors duration-500">
          <nav className="bg-surface-container-low dark:bg-slate-900 text-primary docked left-0 h-full w-64 border-r border-outline-variant dark:border-slate-800 flex flex-col p-md z-40 hidden md:flex transition-colors duration-500">
            <div className="flex items-center space-x-sm mb-lg px-sm">
              <div>
                <h1 className="font-headline-sm text-headline-sm font-bold text-on-surface dark:text-white flex items-center gap-2"><img src="stitch_assets/screen_3_logo.png" className="w-8 h-8 rounded-full bg-white p-0.5 object-contain" /> NEXA</h1>
                <p className="font-label-md text-label-md text-on-surface-variant dark:text-slate-400">Guru Panel</p>
              </div>
            </div>
            <div className="flex-1 space-y-base mt-md">
              <a onClick={(e) => { e.preventDefault(); setActiveTab('jadwal'); setSelectedMapel(null); }} className={`flex items-center space-x-sm px-md py-sm rounded-lg font-label-md cursor-pointer ${activeTab === 'jadwal' ? 'bg-primary-container text-on-primary-container' : 'hover:bg-surface-variant'}`}>
                <span className="material-symbols-outlined">calendar_today</span><span>Jadwal Saya</span>
              </a>
              <a onClick={(e) => { e.preventDefault(); setActiveTab('bank_soal'); setSelectedMapel(null); }} className={`flex items-center space-x-sm px-md py-sm rounded-lg font-label-md cursor-pointer ${activeTab === 'bank_soal' ? 'bg-primary-container text-on-primary-container' : 'hover:bg-surface-variant'}`}>
                <span className="material-symbols-outlined">library_books</span><span>Bank Soal</span>
              </a>
              <a onClick={(e) => { e.preventDefault(); setActiveTab('monitoring'); setSelectedMapel(null); }} className={`flex items-center space-x-sm px-md py-sm rounded-lg font-label-md cursor-pointer ${activeTab === 'monitoring' ? 'bg-primary-container text-on-primary-container' : 'hover:bg-surface-variant'}`}>
                <span className="material-symbols-outlined">monitor</span><span>Monitoring</span>
              </a>
            </div>
            <div className="mt-auto border-t border-outline-variant dark:border-slate-800 pt-md">
              <button onClick={onLogout} className="w-full flex items-center justify-center space-x-sm bg-error-container text-on-error-container px-md py-sm rounded-lg font-label-md hover:bg-error/20">
                <span className="material-symbols-outlined">logout</span><span>Keluar</span>
              </button>
            </div>
          </nav>

          <main className="flex-1 p-lg sm:p-xl w-full">
            <header className="mb-xl">
              <h2 className="font-display-sm text-display-sm font-semibold">{activeTab === 'jadwal' ? 'Jadwal Mengawas' : activeTab === 'bank_soal' ? 'Bank Soal' : 'Monitoring Ujian'}</h2>
            </header>

            {activeTab === 'jadwal' && (
              <div className="bg-surface dark:bg-slate-800 rounded-2xl border border-outline-variant shadow-sm overflow-x-auto">
                <table className="w-full text-left">
                  <thead className="bg-surface-variant/30">
                    <tr><th className="p-4">ID Jadwal</th><th className="p-4">Mapel</th><th className="p-4">Waktu</th><th className="p-4 text-right">Aksi</th></tr>
                  </thead>
                  <tbody>
                    {dataJadwal.map(j => (
                      <tr key={j.id_jadwal} className="border-t border-outline-variant/30">
                        <td className="p-4">{j.id_jadwal}</td>
                        <td className="p-4">{j.nama_mapel}</td>
                        <td className="p-4 text-sm">{new Date(j.waktu_mulai).toLocaleString()} - {new Date(j.waktu_selesai).toLocaleString()}</td>
                        <td className="p-4 text-right">
                          <button onClick={() => handleGenerateToken(j.id_jadwal)} className="bg-primary/10 text-primary hover:bg-primary/20 px-3 py-1 rounded text-sm font-bold">Token</button>
                          <button onClick={() => { setSelectedJadwal(j.id_jadwal); setActiveTab('monitoring'); }} className="bg-green-100 text-green-700 hover:bg-green-200 px-3 py-1 rounded text-sm font-bold ml-2">Pantau</button>
                        </td>
                      </tr>
                    ))}
                    {dataJadwal.length === 0 && <tr><td colSpan="4" className="p-8 text-center text-slate-500">Tidak ada jadwal mengawas.</td></tr>}
                  </tbody>
                </table>
              </div>
            )}

            {activeTab === 'monitoring' && (
              <div>
                <select onChange={(e) => setSelectedJadwal(e.target.value)} value={selectedJadwal || ''} className="p-2 border rounded-lg bg-surface dark:bg-slate-800 mb-6 w-full max-w-md">
                  <option value="">-- Pilih Jadwal --</option>
                  {dataJadwal.map(j => <option key={j.id_jadwal} value={j.id_jadwal}>{j.id_jadwal} - {j.nama_mapel}</option>)}
                </select>

                {selectedJadwal ? (
                  <div className="bg-surface dark:bg-slate-800 rounded-2xl border shadow-sm overflow-x-auto">
                    <table className="w-full text-left">
                      <thead className="bg-surface-variant/30">
                        <tr><th className="p-4">Siswa</th><th className="p-4">Status</th><th className="p-4 text-center">Pelanggaran</th><th className="p-4 text-right">Aksi</th></tr>
                      </thead>
                      <tbody>
                        {dataLog.map(l => (
                          <tr key={l.id_log} className="border-t border-outline-variant/30">
                            <td className="p-4 font-bold">{l.nama_lengkap} <br /><span className="text-xs text-slate-500 font-normal">{l.id_siswa}</span></td>
                            <td className="p-4"><span className={`px-2 py-1 rounded text-xs font-bold ${l.is_blocked ? 'bg-red-100 text-red-700' : l.status_ujian === 'SELESAI' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'}`}>{l.is_blocked ? 'DIBLOKIR' : l.status_ujian}</span></td>
                            <td className="p-4 text-center font-bold text-error">{l.pelanggaran || 0}</td>
                            <td className="p-4 text-right">
                              {!l.is_blocked ? (
                                <button onClick={() => handleBlock(l.id_log)} className="bg-red-100 text-red-700 px-3 py-1 rounded text-xs font-bold">Blokir</button>
                              ) : (
                                <button onClick={() => handleUnblock(l.id_log)} className="bg-green-100 text-green-700 px-3 py-1 rounded text-xs font-bold">Buka Blokir</button>
                              )}
                              {l.status_ujian === 'SELESAI' && (
                                <button onClick={() => openPeriksaUraian(l)} className="bg-blue-100 text-blue-700 hover:bg-blue-200 px-3 py-1 rounded text-xs font-bold ml-2">Periksa Uraian</button>
                              )}
                            </td>
                          </tr>
                        ))}
                        {dataLog.length === 0 && <tr><td colSpan="4" className="p-8 text-center text-slate-500">Belum ada siswa yang login.</td></tr>}
                      </tbody>
                    </table>
                  </div>
                ) : <div className="p-8 text-center bg-surface-variant/30 rounded-xl">Pilih jadwal ujian.</div>}
              </div>
            )}

            {activeTab === 'bank_soal' && !selectedMapel && (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-md">
                {dataMapel.map(m => (
                  <div key={m.id_mapel} onClick={() => setSelectedMapel(m.id_mapel)} className="bg-surface dark:bg-slate-800 p-lg rounded-2xl border border-outline-variant shadow-sm cursor-pointer hover:-translate-y-1 transition-all">
                    <div className="w-12 h-12 rounded-full bg-primary/10 text-primary flex items-center justify-center mb-4"><span className="material-symbols-outlined">library_books</span></div>
                    <h3 className="text-xl font-bold mb-1">{m.nama_mapel}</h3>
                    <p className="text-sm text-slate-500">ID: {m.id_mapel}</p>
                  </div>
                ))}
                {dataMapel.length === 0 && <div className="col-span-full p-8 text-center text-slate-500">Belum ada mata pelajaran yang ditugaskan.</div>}
              </div>
            )}

            {activeTab === 'bank_soal' && selectedMapel && (
              <div className="animate-fade-in-up">
                <div className="flex justify-between items-center mb-4">
                  <button onClick={() => setSelectedMapel(null)} className="flex items-center gap-2 text-primary font-bold hover:underline"><span className="material-symbols-outlined">arrow_back</span> Kembali</button>
                  <button onClick={() => setFormSoal({ isOpen: true, data: null })} className="bg-primary text-on-primary hover:bg-primary/90 px-4 py-2 rounded-lg font-bold flex items-center gap-2 shadow-sm hover:-translate-y-0.5 transition-all"><span className="material-symbols-outlined">add</span> Tambah Soal</button>
                </div>
                <div className="bg-surface dark:bg-slate-800 rounded-2xl border border-outline-variant shadow-sm overflow-x-auto">
                  <table className="w-full text-left">
                    <thead className="bg-surface-variant/30">
                      <tr><th className="p-4">Tipe</th><th className="p-4">Pertanyaan / Stimulus</th><th className="p-4 text-center">Bobot</th><th className="p-4 text-right">Aksi</th></tr>
                    </thead>
                    <tbody>
                      {dataSoal.map(s => (
                        <tr key={s.id_soal} className="border-t border-outline-variant/30 hover:bg-surface-variant/10">
                          <td className="p-4 font-bold text-primary">{s.tipe_soal}</td>
                          <td className="p-4 text-sm"><div className="line-clamp-2 max-w-lg" dangerouslySetInnerHTML={{ __html: s.pertanyaan }}></div></td>
                          <td className="p-4 text-center font-bold">{s.bobot || 1}</td>
                          <td className="p-4 text-right whitespace-nowrap">
                            <button onClick={() => setFormSoal({ isOpen: true, data: s })} className="text-blue-500 hover:text-blue-700 mr-3 p-1 rounded hover:bg-blue-50"><span className="material-symbols-outlined">edit</span></button>
                            <button onClick={() => deleteSoal(s.id_soal)} className="text-red-500 hover:text-red-700 p-1 rounded hover:bg-red-50"><span className="material-symbols-outlined">delete</span></button>
                          </td>
                        </tr>
                      ))}
                      {dataSoal.length === 0 && <tr><td colSpan="4" className="p-8 text-center text-slate-500">Belum ada soal untuk mata pelajaran ini.</td></tr>}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* Render Form Modals */}
            <FormSoalModal isOpen={formSoal.isOpen} data={formSoal.data} onClose={() => setFormSoal({ isOpen: false, data: null })} onSave={saveSoal} />
            <ModalPeriksaUraian isOpen={modalUraian.isOpen} logUjian={modalUraian.logUjian} jawabanUraian={modalUraian.jawabanUraian} onClose={() => setModalUraian({ isOpen: false, logUjian: null, jawabanUraian: [] })} onSave={saveNilaiUraian} />
          </main>
        </div>
      );
    };


    const ExamRoom = ({ user, jadwal, idLog, showMessage, onFinish, isDarkMode, setIsDarkMode }) => {
      const [soal, setSoal] = useState([]);
      const [jawabanSiswa, setJawabanSiswa] = useState({});
      const [raguRagu, setRaguRagu] = useState({});
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isLoading, setIsLoading] = useState(true);
      const [violationCount, setViolationCount] = useState(0);
      const [isBlocked, setIsBlocked] = useState(false);

      const [timeLeft, setTimeLeft] = useState({ total: 1, hours: 0, minutes: 0, seconds: 0 });
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [confirmModal, setConfirmModal] = useState({ isOpen: false });

      const examContainerRef = useRef(null);

      useEffect(() => {
        fetchSoal();
        setupAntiCheat();

        const calculateTimeLeft = (endTimeStr) => {
          const diff = new Date(endTimeStr).getTime() - new Date().getTime();
          if (diff <= 0) return { total: 0, hours: 0, minutes: 0, seconds: 0 };
          return {
            total: diff,
            hours: Math.floor((diff / (1000 * 60 * 60)) % 24),
            minutes: Math.floor((diff / 1000 / 60) % 60),
            seconds: Math.floor((diff / 1000) % 60)
          };
        };

        const timerInterval = setInterval(() => {
          const remaining = calculateTimeLeft(jadwal.waktu_selesai);
          setTimeLeft(remaining);

          if (remaining.total <= 0 && !isSubmitting && !isBlocked) {
            clearInterval(timerInterval);
            showMessage('Waktu Habis!', 'Waktu ujian telah berakhir. Sistem mengumpulkan jawaban otomatis.', 'warning');
            executeSubmitExam(true);
          }
        }, 1000);

        return () => {
          clearInterval(timerInterval);
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          document.removeEventListener('fullscreenchange', handleFullscreenChange);
        };
      }, []);

      const fetchSoal = async () => {
        const res = await fetchAPI('get_soal_by_mapel', { id_mapel: jadwal.id_mapel });
        if (res.status === 'success') {
          const parsedSoal = res.data.map(s => {
            let parsedOpsi = null;
            if (s.opsi) {
              try { parsedOpsi = JSON.parse(s.opsi); } catch (e) { parsedOpsi = s.opsi; }
            }
            return { ...s, opsi: parsedOpsi };
          });
          setSoal(parsedSoal);
        }
        setIsLoading(false);
      };

      const reportViolation = async () => {
        if (isBlocked || isSubmitting) return;

        const res = await fetchAPI('catat_pelanggaran', { id_log: idLog });
        if (res.status === 'success') {
          setViolationCount(res.pelanggaran_saat_ini);
          if (res.terblokir) {
            setIsBlocked(true);
            if (document.fullscreenElement) document.exitFullscreen().catch(() => { });
            showMessage('TERBLOKIR!', 'Akun Anda diblokir karena meninggalkan halaman ujian lebih dari 3 kali. Hubungi pengawas.', 'error');
            setTimeout(onFinish, 5000);
          } else {
            showMessage('Peringatan Keamanan!', `Sistem mendeteksi Anda keluar dari halaman ujian! Ini pelanggaran ke-${res.pelanggaran_saat_ini} dari maksimal 3.`, 'warning');
          }
        }
      };

      const handleVisibilityChange = () => { if (document.hidden) reportViolation(); };
      const handleFullscreenChange = () => { if (!document.fullscreenElement && !isSubmitting && !isBlocked) reportViolation(); };

      const setupAntiCheat = () => {
        document.addEventListener('visibilitychange', handleVisibilityChange);
        document.addEventListener('fullscreenchange', handleFullscreenChange);
      };

      const enforceFullscreen = () => {
        if (!isBlocked && document.documentElement.requestFullscreen && !document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => { });
        }
      };

      const handleAnswerChange = (soalId, value, tipe, parentKey = null) => {
        setJawabanSiswa(prev => {
          if (tipe === 'PGK') {
            let arr = Array.isArray(prev[soalId]) ? [...prev[soalId]] : [];
            if (arr.includes(value)) arr = arr.filter(item => item !== value);
            else arr.push(value);
            return { ...prev, [soalId]: arr };
          }
          if (tipe === 'JODOH' && parentKey) {
            const currentObj = typeof prev[soalId] === 'object' && !Array.isArray(prev[soalId]) ? { ...prev[soalId] } : {};
            currentObj[parentKey] = value;
            return { ...prev, [soalId]: currentObj };
          }
          return { ...prev, [soalId]: value };
        });
      };

      const toggleRaguRagu = (soalId) => {
        setRaguRagu(prev => ({ ...prev, [soalId]: !prev[soalId] }));
      };

      const requestSubmit = () => {
        setConfirmModal({ isOpen: true });
      };

      const executeSubmitExam = async (isAuto = false) => {
        setConfirmModal({ isOpen: false });
        if (isSubmitting) return;

        setIsSubmitting(true);
        setIsLoading(true);

        const formattedJawaban = Object.keys(jawabanSiswa).map(key => ({
          id_soal: key,
          jawaban: jawabanSiswa[key]
        }));

        const res = await fetchAPI('submit_ujian', {
          id_log: idLog,
          id_jadwal: jadwal.id_jadwal,
          id_siswa: user.id_user,
          jawaban: formattedJawaban
        });

        if (document.fullscreenElement) document.exitFullscreen().catch(() => { });

        if (res.status === 'success') {
          showMessage('Ujian Selesai', `Terima kasih! Skor pilihan ganda/objektif Anda: ${res.nilai_auto}. Soal uraian dinilai terpisah oleh guru.`, 'success');
          setTimeout(onFinish, 4000);
        } else {
          showMessage('Gagal Mengumpulkan', res.message, 'error');
          setIsLoading(false);
          setIsSubmitting(false);
        }
      };

      const renderQuestionInput = (s) => {
        const currentAns = jawabanSiswa[s.id_soal] || '';

        switch (s.tipe_soal) {
          case 'PG':
          case 'BS':
            return (s.opsi || []).map((op, idx) => (
              <label key={idx} className={`flex items-center p-md border rounded-lg cursor-pointer transition-colors ${currentAns === op ? 'border-2 border-primary dark:border-primary-fixed bg-primary-fixed dark:bg-primary/20 shadow-[0_4px_8px_rgba(0,0,0,0.05)]' : 'border-outline-variant dark:border-slate-700 hover:bg-surface-container-low dark:hover:bg-slate-700/50 bg-white dark:bg-slate-800'}`}>
                <input type="radio" name={s.id_soal} value={op} checked={currentAns === op} onChange={() => handleAnswerChange(s.id_soal, op, s.tipe_soal)} className={`form-radio h-5 w-5 ${currentAns === op ? 'text-primary border-primary' : 'text-primary border-outline-variant dark:border-slate-600'} focus:ring-primary focus:ring-offset-0`} />
                <span className="ml-md font-body-lg text-body-lg text-on-surface dark:text-white flex-1">
                  {s.tipe_soal === 'PG' && <span className="font-bold mr-sm text-primary dark:text-primary-fixed">{String.fromCharCode(65 + idx)}.</span>} {op}
                </span>
              </label>
            ));

          case 'PGK':
            return (s.opsi || []).map((op, idx) => {
              const isChecked = Array.isArray(currentAns) && currentAns.includes(op);
              return (
                <label key={idx} className={`flex items-center p-md border rounded-lg cursor-pointer transition-colors ${isChecked ? 'border-2 border-primary dark:border-primary-fixed bg-primary-fixed dark:bg-primary/20 shadow-[0_4px_8px_rgba(0,0,0,0.05)]' : 'border-outline-variant dark:border-slate-700 hover:bg-surface-container-low dark:hover:bg-slate-700/50 bg-white dark:bg-slate-800'}`}>
                  <input type="checkbox" value={op} checked={isChecked} onChange={() => handleAnswerChange(s.id_soal, op, s.tipe_soal)} className={`form-checkbox rounded h-5 w-5 ${isChecked ? 'text-primary border-primary' : 'text-primary border-outline-variant dark:border-slate-600'} focus:ring-primary focus:ring-offset-0`} />
                  <span className="ml-md font-body-lg text-body-lg text-on-surface dark:text-white flex-1">
                    <span className="font-bold mr-sm text-primary dark:text-primary-fixed">{String.fromCharCode(65 + idx)}.</span> {op}
                  </span>
                </label>
              );
            });

          case 'JODOH':
            const premis = s.opsi?.premis || [];
            const respon = s.opsi?.respon || [];
            const ansObj = typeof currentAns === 'object' && !Array.isArray(currentAns) ? currentAns : {};
            return (
              <div className="bg-secondary-container dark:bg-secondary/20 p-md rounded-lg border border-outline-variant dark:border-slate-700">
                <p className="text-on-secondary-container dark:text-secondary-fixed font-label-md text-label-md mb-sm flex items-center gap-2"><span className="material-symbols-outlined text-[18px]">link</span> Pasangkan premis berikut dengan respon yang tepat.</p>
                {premis.map((p, idx) => p && (
                  <div key={idx} className="flex gap-4 items-center mb-2">
                    <span className="flex-1 font-medium">{p}</span>
                    <span className="material-symbols-outlined text-slate-400">arrow_forward</span>
                    <select value={ansObj[p] || ''} onChange={(e) => handleAnswerChange(s.id_soal, e.target.value, s.tipe_soal, p)} className="flex-1 p-2 border rounded bg-surface dark:bg-slate-900 focus:ring-primary">
                      <option value="">Pilih Respon...</option>
                      {respon.map((r, i) => r && <option key={i} value={r}>{r}</option>)}
                    </select>
                  </div>
                ))}
              </div>
            );

          case 'ISIAN':
          case 'URAIAN':
            return (
              <textarea rows={s.tipe_soal === 'URAIAN' ? 8 : 2} placeholder="Ketik jawaban Anda di sini..." value={currentAns} onChange={(e) => handleAnswerChange(s.id_soal, e.target.value, s.tipe_soal)} className="w-full pl-md pr-md py-sm bg-white dark:bg-slate-900 border border-outline-variant dark:border-slate-600 rounded-lg font-body-md text-body-md text-on-surface dark:text-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"></textarea>
            );

          default: return <p className="text-error font-bold p-sm bg-error-container/20 rounded">⚠️ Tipe soal tidak didukung.</p>;
        }
      };

      if (isLoading) return <div className="min-h-screen bg-background dark:bg-slate-900 flex flex-col items-center justify-center"><Loader text="Menyiapkan Soal dan Enkripsi Sesi..." /></div>;
      if (isBlocked) return (
        <div className="min-h-screen bg-error flex flex-col items-center justify-center space-y-4">
          <span className="material-symbols-outlined text-[80px] text-on-error">block</span>
          <h1 className="text-on-error font-headline-lg text-headline-lg font-bold">AKUN DIBLOKIR</h1>
          <p className="text-on-error font-body-lg text-body-lg">Sistem mendeteksi kecurangan. Hubungi pengawas untuk membuka akses.</p>
        </div>
      );

      const currentS = soal[currentIndex];

      const answeredCount = soal.filter(s => {
        const ans = jawabanSiswa[s.id_soal];
        if (!ans) return false;
        if (s.tipe_soal === 'PGK') return Array.isArray(ans) && ans.length > 0;
        if (s.tipe_soal === 'JODOH') return typeof ans === 'object' && Object.keys(ans).length > 0 && Object.values(ans).some(v => v !== '');
        return String(ans).trim() !== '';
      }).length;
      
      const flaggedCount = Object.values(raguRagu).filter(Boolean).length;
      const unansweredCount = soal.length - answeredCount;

      return (
        <div className="font-body-md text-body-md text-on-background dark:text-slate-100 bg-background dark:bg-slate-900 h-screen flex flex-col overflow-hidden select-none transition-colors duration-500" ref={examContainerRef} onClick={enforceFullscreen}>
          {/* TopNavBar */}
          <header className="fixed top-0 w-full z-50 flex justify-between items-center px-lg h-20 bg-primary dark:bg-slate-900 border-b border-transparent dark:border-slate-800 shadow-md">
            <div className="flex items-center gap-md">
              <img alt="NEXA Logo" className="h-10 w-auto object-contain hidden md:block bg-white p-1 rounded-full" src="stitch_assets/screen_3_logo.png" />
              <div className="font-headline-sm text-headline-sm text-on-primary font-bold md:hidden">NEXA</div>
            </div>
            <div className="flex items-center gap-md md:gap-xl text-on-primary">
              <div className="flex flex-col items-end hidden sm:flex">
                <span className="font-label-md text-label-md text-primary-fixed-dim">{user.nama_lengkap}</span>
                <span className="font-label-md text-label-md text-primary-fixed-dim">ID: {user.id_user}</span>
              </div>
              <div className="h-8 w-px bg-primary-fixed-dim opacity-50 hidden sm:block"></div>
              <div className="font-body-lg text-body-lg text-on-primary font-semibold hidden md:block max-w-[200px] truncate">{jadwal.nama_mapel}</div>
              <div className="h-8 w-px bg-primary-fixed-dim opacity-50 hidden md:block"></div>
              <div className={`font-headline-sm text-headline-sm ${timeLeft.total < 300000 ? 'text-error-container animate-pulse' : 'text-on-primary'} font-bold flex items-center gap-xs`}>
                <span className="material-symbols-outlined" style={{ fontVariationSettings: "'FILL' 1" }}>timer</span>
                {String(timeLeft.hours).padStart(2, '0')}:{String(timeLeft.minutes).padStart(2, '0')}:{String(timeLeft.seconds).padStart(2, '0')}
              </div>
              <button onClick={requestSubmit} className="font-label-md text-label-md text-on-primary font-bold hover:opacity-90 active:scale-95 transition-transform ml-sm md:ml-md bg-error text-on-error px-md py-sm rounded">Selesai</button>
            </div>
          </header>

          <div className="flex flex-1 pt-20 h-full">
            {/* SideNavBar */}
            <aside className="hidden md:flex fixed left-0 mt-20 w-80 h-[calc(100vh-80px)] border-r border-outline-variant dark:border-slate-800 bg-surface dark:bg-slate-900 flex-col p-md overflow-y-auto sidebar-scroll z-40 transition-colors duration-500">
              <div className="mb-md">
                <h2 className="font-label-md text-label-md text-on-surface dark:text-white font-bold">Navigasi Soal</h2>
                <p className="font-label-md text-label-md text-on-surface-variant dark:text-slate-400 font-normal">Klik nomor untuk pindah soal</p>
                {violationCount > 0 && (
                  <p className="font-label-md text-label-md text-error mt-2 font-bold flex items-center gap-1">
                    <span className="material-symbols-outlined text-[16px]">warning</span> Pelanggaran: {violationCount} / 3
                  </p>
                )}
              </div>
              <div className="grid grid-cols-6 gap-sm mb-lg">
                {soal.map((s, idx) => {
                  const ans = jawabanSiswa[s.id_soal];
                  let hasAnswered = false;
                  if (ans) {
                    if (s.tipe_soal === 'PGK') hasAnswered = Array.isArray(ans) && ans.length > 0;
                    else if (s.tipe_soal === 'JODOH') hasAnswered = typeof ans === 'object' && Object.keys(ans).length > 0 && Object.values(ans).some(v => v !== '');
                    else hasAnswered = String(ans).trim() !== '';
                  }
                  
                  const isFlagged = raguRagu[s.id_soal];

                  let btnClass = "w-10 h-10 rounded-sm font-mono-label text-mono-label flex items-center justify-center cursor-pointer transition-all ";

                  if (currentIndex === idx) {
                    btnClass += "bg-primary text-on-primary ring-2 ring-primary ring-offset-2 dark:ring-offset-slate-900";
                  } else if (isFlagged) {
                    btnClass += "bg-[#D97706] text-white"; // flagged color
                  } else if (hasAnswered) {
                    btnClass += "bg-[#10B981] text-white"; // answered color
                  } else {
                    btnClass += "border border-outline-variant dark:border-slate-700 text-on-surface dark:text-slate-300 hover:border-primary hover:text-primary dark:hover:border-primary-fixed dark:hover:text-primary-fixed bg-white dark:bg-slate-800";
                  }

                  return (
                    <button key={s.id_soal} onClick={() => setCurrentIndex(idx)} className={btnClass}>
                      {idx + 1}
                    </button>
                  );
                })}
              </div>
              <div className="mt-auto pt-md border-t border-outline-variant dark:border-slate-800">
                <div className="flex items-center gap-sm mb-xs">
                  <div className="w-4 h-4 bg-[#10B981] rounded-sm"></div>
                  <span className="font-label-md text-label-md text-on-surface-variant dark:text-slate-400">Terjawab ({answeredCount})</span>
                </div>
                <div className="flex items-center gap-sm mb-xs">
                  <div className="w-4 h-4 bg-[#D97706] rounded-sm"></div>
                  <span className="font-label-md text-label-md text-on-surface-variant dark:text-slate-400">Ragu-ragu ({flaggedCount})</span>
                </div>
                <div className="flex items-center gap-sm mb-xs">
                  <div className="w-4 h-4 border border-outline-variant dark:border-slate-700 rounded-sm bg-white dark:bg-slate-800"></div>
                  <span className="font-label-md text-label-md text-on-surface-variant dark:text-slate-400">Belum Dijawab ({unansweredCount})</span>
                </div>
                <div className="flex items-center gap-sm">
                  <div className="w-4 h-4 bg-primary rounded-sm ring-1 ring-primary ring-offset-1 dark:ring-offset-slate-900"></div>
                  <span className="font-label-md text-label-md text-on-surface-variant dark:text-slate-400">Posisi Saat Ini</span>
                </div>
              </div>
            </aside>

            {/* Main Content (Canvas) */}
            <main className="flex-1 md:ml-80 flex flex-col bg-background dark:bg-slate-900 relative overflow-y-auto pb-24 transition-colors duration-500">
              <div className="max-w-[1200px] mx-auto w-full p-md md:p-xl mt-sm md:mt-lg">
                {currentS ? (
                  <div className="bg-white dark:bg-slate-800 border-2 border-primary dark:border-primary/50 rounded-lg p-md md:p-xl shadow-sm mb-xl">
                    <div className="flex justify-between items-center mb-md pb-md border-b border-outline-variant dark:border-slate-700">
                      <span className="font-headline-md text-headline-md text-on-surface dark:text-white font-bold">Soal No. {currentIndex + 1}</span>
                      <div className="flex items-center gap-sm bg-surface-container dark:bg-slate-700 py-xs px-sm rounded-full">
                        <span className="material-symbols-outlined text-secondary dark:text-slate-300" style={{ fontSize: "16px" }}>category</span>
                        <span className="font-label-md text-label-md text-secondary dark:text-slate-300 uppercase font-bold">{currentS.tipe_soal}</span>
                        {currentS.bobot && <span className="text-xs ml-2 text-slate-500">({currentS.bobot} Poin)</span>}
                      </div>
                    </div>
                    <div className="font-question-text text-question-text text-on-surface dark:text-white mb-xl whitespace-pre-wrap" dangerouslySetInnerHTML={{ __html: currentS.pertanyaan }}>
                    </div>
                    {/* Options */}
                    <div className="space-y-sm">
                      {renderQuestionInput(currentS)}
                    </div>
                  </div>
                ) : (
                  <div className="text-center text-on-surface-variant py-20 font-bold text-xl">Tidak ada soal yang tersedia.</div>
                )}
              </div>

              {/* Bottom Action Bar */}
              {currentS && (
                <div className="fixed bottom-0 md:left-80 left-0 right-0 h-20 bg-white dark:bg-slate-900 border-t border-outline-variant dark:border-slate-800 px-md md:px-xl flex items-center justify-between shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-40 transition-colors duration-500">
                  <button
                    onClick={() => setCurrentIndex(Math.max(0, currentIndex - 1))}
                    disabled={currentIndex === 0}
                    className="flex items-center gap-xs px-md md:px-lg py-sm border-2 border-primary dark:border-primary-fixed text-primary dark:text-primary-fixed font-body-md text-body-md font-semibold rounded hover:bg-primary-fixed dark:hover:bg-primary/20 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    <span className="material-symbols-outlined">arrow_back</span>
                    <span className="hidden sm:inline">Sebelumnya</span>
                  </button>
                  <div className="flex items-center gap-md md:gap-lg">
                    <label className="flex items-center cursor-pointer gap-sm group">
                      <div className="relative flex items-center justify-center w-6 h-6 border-2 border-outline-variant dark:border-slate-600 rounded group-hover:border-[#D97706] transition-colors">
                        <input type="checkbox" checked={raguRagu[currentS.id_soal] || false} onChange={() => toggleRaguRagu(currentS.id_soal)} className="absolute opacity-0 w-full h-full cursor-pointer peer" />

        { text: "Hiduplah seolah engkau mati besok. Belajarlah seolah engkau hidup selamanya.", author: "Mahatma Gandhi" },
        { text: "Pendidikan bukan sekadar mengisi wadah, melainkan menyalakan api.", author: "William Butler Yeats" },
        { text: "Tujuan pendidikan itu untuk mempertajam kecerdasan, memperkukuh kemauan serta memperhalus perasaan.", author: "Tan Malaka" }
      ];
      const [quoteIndex, setQuoteIndex] = useState(0);

      const usernameInputRef = useRef(null);

      useEffect(() => {
        const interval = setInterval(() => {
          setQuoteIndex((prev) => (prev + 1) % quotes.length);
        }, 8000);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        if (!user && usernameInputRef.current) {
          usernameInputRef.current.focus();
        }
      }, [user, isRegistering]);

      useEffect(() => {
        const handleOnline = () => setIsOnline(true);
        const handleOffline = () => setIsOnline(false);
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, []);

      useEffect(() => {
        if (isDarkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [isDarkMode]);

      const handlePasswordKeyUp = (e) => {
        if (e.getModifierState && e.getModifierState('CapsLock')) {
          setCapsLockActive(true);
        } else {
          setCapsLockActive(false);
        }
      };

        e.preventDefault();
        setLoading(true);

        if (res.status === 'success') {
          setLoginSuccess(true);

            setUser(res.data);
            setLoginSuccess(false);

        } else {
          setLoginError(res.message || 'Username atau password yang Anda masukkan salah.');
